name: c2-4-3-hardening

on:
  push:
    branches: [c2/fault-campaign-replay]
    paths:
      - .github/workflows/c2-4-3-hardening.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c2/fault-campaign-replay
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply bounded reproducibility hardening
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('simulator/fault_campaign.py')
          text = path.read_text()

          old = '''        previous = -1.0\n        seen_fault_ids: set[str] = set()\n        for item in self.schedule:\n            if item.injection_time < previous:\n                raise ValueError("fault schedule must be ordered by non-decreasing injection time")\n            previous = item.injection_time\n            if item.fault_id in seen_fault_ids:\n                raise ValueError("fault schedule reuses a FaultID")\n            seen_fault_ids.add(item.fault_id)\n'''
          new = '''        previous = -1.0\n        seen_fault_ids: set[str] = set()\n        for item in self.schedule:\n            if item.injection_time < previous:\n                raise ValueError("fault schedule must be ordered by non-decreasing injection time")\n            previous = item.injection_time\n            if item.fault_id in seen_fault_ids:\n                raise ValueError("fault schedule reuses a FaultID")\n            seen_fault_ids.add(item.fault_id)\n\n        schedule_by_id = {item.fault_id: item for item in self.schedule}\n        for decision in self.decisions:\n            if decision.selected_fault_class is None:\n                if decision.fault_id is not None:\n                    raise ValueError("no-fault probabilistic decision must not name a FaultID")\n                continue\n            if decision.fault_id is None:\n                raise ValueError("selected probabilistic fault decision must name a FaultID")\n            realized = schedule_by_id.get(decision.fault_id)\n            if realized is None:\n                raise ValueError("probabilistic decision FaultID is absent from realized schedule")\n            if realized.fault_class is not decision.selected_fault_class:\n                raise ValueError("probabilistic decision class disagrees with realized schedule")\n            if realized.target != decision.target:\n                raise ValueError("probabilistic decision target disagrees with realized schedule")\n'''
          if old not in text:
              raise SystemExit('missing manifest decision consistency target')
          text = text.replace(old, new, 1)

          old = '''    def __init__(\n        self,\n        simulator: DiscreteEventSimulator,\n        manifest: FaultCampaignManifest,\n        *,\n        resources: ResourceModel | None = None,\n        adapter: ContinuityAdapter | None = None,\n    ) -> None:\n        if not isinstance(simulator, DiscreteEventSimulator):\n            raise TypeError("simulator must be DiscreteEventSimulator")\n        if not isinstance(manifest, FaultCampaignManifest):\n            raise TypeError("manifest must be FaultCampaignManifest")\n        if resources is not None and resources.simulator is not simulator:\n            raise ValueError("resources must reference replay simulator")\n        if adapter is not None and adapter.simulator is not simulator:\n            raise ValueError("adapter must reference replay simulator")\n        self.simulator = simulator\n        self.manifest = manifest\n        self.resources = resources\n        self.adapter = adapter\n'''
          new = '''    def __init__(\n        self,\n        simulator: DiscreteEventSimulator,\n        manifest: FaultCampaignManifest,\n        *,\n        git_commit: str,\n        scenario_fingerprint: str,\n        resources: ResourceModel | None = None,\n        adapter: ContinuityAdapter | None = None,\n    ) -> None:\n        if not isinstance(simulator, DiscreteEventSimulator):\n            raise TypeError("simulator must be DiscreteEventSimulator")\n        if not isinstance(manifest, FaultCampaignManifest):\n            raise TypeError("manifest must be FaultCampaignManifest")\n        _require_id(git_commit, "git_commit")\n        _require_id(scenario_fingerprint, "scenario_fingerprint")\n        if git_commit != manifest.git_commit:\n            raise FaultReplayError("replay git commit does not match campaign manifest")\n        if scenario_fingerprint != manifest.scenario_fingerprint:\n            raise FaultReplayError("replay scenario fingerprint does not match campaign manifest")\n        if resources is not None and resources.simulator is not simulator:\n            raise ValueError("resources must reference replay simulator")\n        if adapter is not None and adapter.simulator is not simulator:\n            raise ValueError("adapter must reference replay simulator")\n        self.simulator = simulator\n        self.manifest = manifest\n        self.git_commit = git_commit\n        self.scenario_fingerprint = scenario_fingerprint\n        self.resources = resources\n        self.adapter = adapter\n'''
          if old not in text:
              raise SystemExit('missing replay constructor target')
          text = text.replace(old, new, 1)
          path.write_text(text)

          tests_path = Path('tests/simulator/test_fault_campaign.py')
          tests = tests_path.read_text()
          tests = tests.replace(
              'FaultScheduleReplayer(replay_sim, manifest).replay()',
              'FaultScheduleReplayer(\n        replay_sim, manifest,\n        git_commit=manifest.git_commit,\n        scenario_fingerprint=manifest.scenario_fingerprint,\n    ).replay()',
          )
          tests = tests.replace(
              'FaultScheduleReplayer(sim, manifest).replay()',
              'FaultScheduleReplayer(\n            sim, manifest,\n            git_commit=manifest.git_commit,\n            scenario_fingerprint=manifest.scenario_fingerprint,\n        ).replay()',
          )
          tests = tests.replace(
              '''    replayed = FaultScheduleReplayer(\n        replay_sim,\n        manifest,\n        adapter=replay_adapter,\n    ).replay()''',
              '''    replayed = FaultScheduleReplayer(\n        replay_sim,\n        manifest,\n        git_commit=manifest.git_commit,\n        scenario_fingerprint=manifest.scenario_fingerprint,\n        adapter=replay_adapter,\n    ).replay()''',
          )
          tests += '''\n\ndef test_replay_rejects_revision_or_scenario_mismatch_before_mutation():\n    _, manifest = _delivery_campaign()\n\n    sim_revision = _delivery_scenario()\n    with pytest.raises(FaultReplayError, match="git commit"):\n        FaultScheduleReplayer(\n            sim_revision,\n            manifest,\n            git_commit="different-revision",\n            scenario_fingerprint=manifest.scenario_fingerprint,\n        )\n    assert not sim_revision.trace\n    assert not any(event.event_id.startswith("fault:") for event in sim_revision.pending_events)\n\n    sim_scenario = _delivery_scenario()\n    with pytest.raises(FaultReplayError, match="scenario fingerprint"):\n        FaultScheduleReplayer(\n            sim_scenario,\n            manifest,\n            git_commit=manifest.git_commit,\n            scenario_fingerprint="different-scenario",\n        )\n    assert not sim_scenario.trace\n    assert not any(event.event_id.startswith("fault:") for event in sim_scenario.pending_events)\n\n\ndef test_probabilistic_decision_metadata_must_match_realized_schedule():\n    from simulator.faults import ProbabilisticFaultDecision\n\n    base = _probabilistic_manifest()\n    realized = base.schedule[0]\n\n    with pytest.raises(ValueError, match="no-fault.*FaultID"):\n        FaultCampaignManifest(\n            campaign_id=base.campaign_id,\n            git_commit=base.git_commit,\n            scenario_fingerprint=base.scenario_fingerprint,\n            seed=base.seed,\n            generator=base.generator,\n            fault_configuration=base.fault_configuration,\n            decisions=(\n                ProbabilisticFaultDecision(\n                    base.seed, 0, "e1", 0.1, None, realized.fault_id\n                ),\n            ),\n            schedule=base.schedule,\n        )\n\n    with pytest.raises(ValueError, match="class disagrees"):\n        FaultCampaignManifest(\n            campaign_id=base.campaign_id,\n            git_commit=base.git_commit,\n            scenario_fingerprint=base.scenario_fingerprint,\n            seed=base.seed,\n            generator=base.generator,\n            fault_configuration=base.fault_configuration,\n            decisions=(\n                ProbabilisticFaultDecision(\n                    base.seed,\n                    0,\n                    realized.target,\n                    0.1,\n                    FaultClass.DELIVERY_DROP,\n                    realized.fault_id,\n                ),\n            ),\n            schedule=base.schedule,\n        )\n'''
          tests_path.write_text(tests)
          PY
      - name: Validate full repository suite
        run: |
          python -m pip install --upgrade pip pytest
          python -m pytest
      - name: Commit hardening and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c2-4-3-hardening.yml
          git add simulator/fault_campaign.py tests/simulator/test_fault_campaign.py
          git commit -m "Harden C2.4.3 campaign provenance consistency"
          git push origin HEAD:c2/fault-campaign-replay
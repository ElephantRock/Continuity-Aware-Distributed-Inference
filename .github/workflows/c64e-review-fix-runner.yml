name: c64e-review-fix-runner

on:
  push:
    branches: [c6/source-kernel-v4-exhaustive-protocol]
    paths:
      - .github/workflows/c64e-review-fix-runner.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      OPENBLAS_CORETYPE: Haswell
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.12.14
          check-latest: false
      - name: Apply corrected review hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/c64e-review-fix.yml').read_text()
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          script = textwrap.dedent(workflow[start:end])
          broken = "if old not in t:\\n              raise SystemExit('numerical model test block not found')"
          fixed = "if old not in t:\n    raise SystemExit('numerical model test block not found')"
          if broken not in script:
              raise SystemExit('expected review patch syntax defect not found')
          script = script.replace(broken, fixed, 1)
          exec(compile(script, '<c64e-review-fix>', 'exec'))
          PY
      - name: Install exact test runtime
        run: python -m pip install pytest==8.3.5 numpy==1.26.4 pandas==2.2.3 scikit-learn==1.5.2 scipy==1.14.1 joblib==1.4.2 threadpoolctl==3.5.0 fasteners==0.19
      - name: Run focused contract tests
        run: python -m pytest -q tests/simulator/test_inference_cost_v4.py
      - name: Commit review fixes
        shell: bash
        run: |
          git config user.name "Alajmah"
          git config user.email "55954113+Alajmah@users.noreply.github.com"
          git add simulator/inference_cost_v4.py tests/simulator/test_inference_cost_v4.py spec/46-c6.4e-source-kernel-v4-exhaustive-protocol.md
          git diff --cached --check
          git commit -m "C6.4e: preserve source materialization kernel"
          git push origin HEAD:c6/source-kernel-v4-exhaustive-protocol

name: c1-final-record

on:
  push:
    branches: [c1/deterministic-core]
    paths:
      - '.github/workflows/c1-final-record.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c1/deterministic-core
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Update completion candidate record
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('spec/07-c1-deterministic-core-record.md')
          text = p.read_text()
          replacements = [
              ('Latest completion-candidate result after all review fixes:\n\n```text\n117 passed\n```',
               'Latest completion-candidate result after all review fixes:\n\n```text\n118 passed\n```'),
              ('State producer Attempt/Phase consistency\nsame-Attempt Phase dependency temporal ordering',
               'State producer Attempt/Phase consistency\ndeclared State origin re-resolution and cached-provenance consistency\nsame-Attempt Phase dependency temporal ordering'),
              ('- Phase-provenance temporal inversion inside a State derivation.',
               '- Phase-provenance temporal inversion inside a State derivation;\n- mismatch between a declared State origin and its cached producer provenance.'),
              ('- Output creation rejects unresolved Evidence references instead of storing oracle-invalid state.',
               '- Output creation rejects unresolved Evidence references instead of storing oracle-invalid state;\n- the independent oracle rejects a Phase-origin State whose declared `origin_id` disagrees with its cached producer Phase.'),
              ('Codex review identified three correctness inconsistencies during closure:\n\n1. wall-clock-dependent time-sensitive operation replay;\n2. missing independent Phase-dependency ordering validation in restored/corrupted State provenance;\n3. public Output creation accepting unresolved Evidence references while the oracle rejected them.\n\nAll three are fixed and covered by regression tests.',
               'Codex review identified four correctness inconsistencies during closure:\n\n1. wall-clock-dependent time-sensitive operation replay;\n2. missing independent Phase-dependency ordering validation in restored/corrupted State provenance;\n3. public Output creation accepting unresolved Evidence references while the oracle rejected them;\n4. restored/corrupted State could declare one Phase origin while carrying cached producer provenance from another Phase.\n\nAll four are fixed and covered by regression tests.')
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one match for: {old[:80]!r}; got {text.count(old)}')
              text = text.replace(old, new, 1)
          p.write_text(text)
          PY
      - name: Verify deterministic C1 suite
        run: |
          python -m pip install --upgrade pip pytest
          python -m pytest -q
      - name: Commit record and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add spec/07-c1-deterministic-core-record.md
          git rm .github/workflows/c1-final-record.yml
          git commit -m 'Record fourth C1 review correction and 118-test validation'
          git push origin HEAD:c1/deterministic-core

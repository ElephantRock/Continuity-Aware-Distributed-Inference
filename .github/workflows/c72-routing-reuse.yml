name: c72-routing-reuse

on:
  push:
    branches:
      - c7/paired-routing-reuse
    paths:
      - .github/workflows/c72-routing-reuse.yml
      - experiments/c7_protocol.py
      - experiments/c72_routing_reuse.py
      - tests/experiments/test_c72_routing_reuse.py
      - spec/51-c7.2-routing-reuse.md
      - pyproject.toml
  pull_request:
    paths:
      - .github/workflows/c72-routing-reuse.yml
      - experiments/c7_protocol.py
      - experiments/c72_routing_reuse.py
      - tests/experiments/test_c72_routing_reuse.py
      - spec/51-c7.2-routing-reuse.md
      - pyproject.toml
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'
  MOONCAKE_URL: 'https://raw.githubusercontent.com/kvcache-ai/Mooncake/3cca71daccf2a7afb8fe3f0295358f70e3a69fdb/FAST25-release/traces/conversation_trace.jsonl'

jobs:
  harness-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify immutable checkout
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: Install test runner only
        run: python -m pip install 'pytest==8.4.2'
      - name: Run C7.2 mechanics tests
        run: python -m pytest -q tests/experiments/test_c72_routing_reuse.py
      - name: Reproduce harness identity twice
        run: |
          python -m experiments.c72_routing_reuse > /tmp/c72-a.json
          python -m experiments.c72_routing_reuse > /tmp/c72-b.json
          cmp /tmp/c72-a.json /tmp/c72-b.json
      - name: Verify frozen parent protocol and no comparative payload
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from experiments.c7_protocol import C7_PROTOCOL_FINGERPRINT

          payload = json.loads(Path('/tmp/c72-a.json').read_text())
          assert payload['protocol_fingerprint'] == C7_PROTOCOL_FINGERPRINT
          assert payload['protocol_fingerprint'] == '706e0d5fff362a1eda8c906b957c914251c6e7949bac6be3c2c143ae21625474'
          assert payload['comparative_result_inspection'] == 'NONE'
          assert 'policy_results' not in payload
          print(json.dumps(payload, sort_keys=True, separators=(',', ':')))
          PY

  source-admissibility-establishment:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify immutable checkout
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: Download exact pinned Mooncake source
        run: curl --fail --location --silent --show-error "$MOONCAKE_URL" --output /tmp/mooncake.jsonl
      - name: Derive frozen C7-admissible subset twice
        run: |
          python - <<'PY' > /tmp/c72-source-a.json
          import json
          from pathlib import Path
          from experiments.c72_routing_reuse import summarize_pinned_mooncake_c7_admissible
          summary = summarize_pinned_mooncake_c7_admissible(Path('/tmp/mooncake.jsonl').read_bytes())
          print(json.dumps(summary.to_dict(), sort_keys=True, separators=(',', ':'), allow_nan=False))
          PY
          python - <<'PY' > /tmp/c72-source-b.json
          import json
          from pathlib import Path
          from experiments.c72_routing_reuse import summarize_pinned_mooncake_c7_admissible
          summary = summarize_pinned_mooncake_c7_admissible(Path('/tmp/mooncake.jsonl').read_bytes())
          print(json.dumps(summary.to_dict(), sort_keys=True, separators=(',', ':'), allow_nan=False))
          PY
          cmp /tmp/c72-source-a.json /tmp/c72-source-b.json
          cat /tmp/c72-source-a.json
      - name: Verify establishment boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/c72-source-a.json').read_text())
          assert payload['source_dataset_fingerprint'] == '22ead90d97ae218f229f94378f8f019499ede0e4050e6cbf8092b455ae047718'
          assert payload['total_records'] == 12031
          assert 0 < payload['retained_records'] < payload['total_records']
          assert payload['input_max'] + payload['output_min'] <= 4096 or payload['input_max'] <= 4095
          print('source_admissibility_establishment=DESCRIPTIVE_ONLY')
          print('comparative_result_inspection=NONE')
          PY

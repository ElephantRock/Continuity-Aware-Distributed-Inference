name: c1-final-record-134

on:
  push:
    branches: [c1/deterministic-core]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c1/deterministic-core
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Synchronize nine-finding C1 record
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('spec/07-c1-deterministic-core-record.md')
          text = p.read_text()
          reps = [
            ('Snapshot restore must reproduce the same canonical snapshot and satisfy the independent invariant oracle.',
             'Snapshot restore must reproduce the same canonical snapshot and satisfy the independent invariant oracle. `restore_core` validates the independent oracle before returning a live core and rejects invariant-invalid persisted state.'),
            ('Two fresh cores replaying the same valid operation trace must therefore produce identical canonical snapshots and identical snapshot fingerprints independently of when replay occurs. Event and Operation JSONL use the same strict finite-number canonical JSON rule.',
             'Two fresh cores replaying the same valid operation trace must therefore produce identical canonical snapshots and identical snapshot fingerprints independently of when replay occurs. Event and Operation JSONL use the same strict finite-number canonical JSON rule. Snapshot, Event JSONL, and Operation JSONL ingress likewise reject non-finite JSON constants before decoding or replay.'),
            ('```text\n128 passed\n```', '```text\n134 passed\n```'),
            ('- canonical snapshots and Operation JSONL reject `NaN`, `+Infinity`, and `-Infinity`.',
             '- canonical snapshots and Operation JSONL reject `NaN`, `+Infinity`, and `-Infinity`;\n- snapshot, Event JSONL, and Operation JSONL parsers reject externally supplied non-finite constants;\n- `restore_core` rejects snapshots that violate the independent invariant oracle before exposing a live core.'),
            ('Codex review identified seven correctness inconsistencies during closure:', 'Codex review identified nine correctness inconsistencies during closure:'),
            ('7. canonical JSON/JSONL serialization could emit non-standard `NaN`/`Infinity` tokens.\n\nAll seven are fixed and covered by regression tests.',
             '7. canonical JSON/JSONL serialization could emit non-standard `NaN`/`Infinity` tokens;\n8. external JSON/JSONL parsing accepted non-finite constants that could bypass freshness semantics;\n9. snapshot restoration could expose invariant-invalid persisted state without running the independent oracle.\n\nAll nine are fixed and covered by regression tests.'),
          ]
          for old, new in reps:
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'expected one match, got {n}: {old[:100]!r}')
              text = text.replace(old, new, 1)
          p.write_text(text)
          PY
      - name: Validate deterministic C1 suite
        run: |
          python -m pip install --upgrade pip pytest
          python -m pytest -q
      - name: Commit record and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add spec/07-c1-deterministic-core-record.md
          git rm .github/workflows/c1-final-record-134.yml
          git commit -m 'Synchronize C1 record at 134 tests'
          git push origin HEAD:c1/deterministic-core

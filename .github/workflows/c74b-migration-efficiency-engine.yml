name: c74b-migration-efficiency-engine

on:
  push:
    branches:
      - c7/migration-efficiency-engine
    paths:
      - .github/workflows/c74b-migration-efficiency-engine.yml
      - experiments/c74_migration_engine.py
      - experiments/c74_migration_protocol.py
      - experiments/c7_protocol.py
      - continuity/core.py
      - continuity/core_base.py
      - continuity/invariants.py
      - simulator/continuity_policy.py
      - simulator/inference_cost_runtime.py
      - simulator/policies.py
      - tests/experiments/test_c74_migration_engine.py
      - tests/experiments/test_c74b_engine_fingerprint_freeze.py
      - pyproject.toml
  pull_request:
    paths:
      - .github/workflows/c74b-migration-efficiency-engine.yml
      - experiments/c74_migration_engine.py
      - experiments/c74_migration_protocol.py
      - experiments/c7_protocol.py
      - continuity/core.py
      - continuity/core_base.py
      - continuity/invariants.py
      - simulator/continuity_policy.py
      - simulator/inference_cost_runtime.py
      - simulator/policies.py
      - tests/experiments/test_c74_migration_engine.py
      - tests/experiments/test_c74b_engine_fingerprint_freeze.py
      - pyproject.toml
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'

jobs:
  mechanics-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify immutable checkout
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: Install test runner only
        run: python -m pip install 'pytest==8.4.2'
      - name: Run C7.4b mechanics tests
        run: |
          python -m pytest -q \
            tests/experiments/test_c74_migration_engine.py \
            tests/experiments/test_c74b_engine_fingerprint_freeze.py
      - name: Reproduce engine identity byte-identically
        run: |
          python -m experiments.c74_migration_engine > /tmp/c74b-1.json
          python -m experiments.c74_migration_engine > /tmp/c74b-2.json
          cmp /tmp/c74b-1.json /tmp/c74b-2.json
          cat /tmp/c74b-1.json
          python - <<'PY'
          import json
          from pathlib import Path
          from experiments.c74_migration_engine import (
              C74B_BASE_COMMIT,
              C74B_COMPARATIVE_RESULT_INSPECTION,
              C74B_FROZEN_C74A_FINGERPRINT,
              engine_identity,
          )

          EXPECTED_C74B_ENGINE_FINGERPRINT = (
              '2083e1a227330ea1a0ac57caf166cf8777865cbe6e3c6d259796cfd56fe02c32'
          )
          payload = json.loads(Path('/tmp/c74b-1.json').read_text())
          assert C74B_BASE_COMMIT == 'de4046fc4bcbf343d372cf8a151cdbb96fc6b45b'
          assert C74B_FROZEN_C74A_FINGERPRINT == '21601257767442204f1acfae4c6e2e42959e37701c9236a2d2b560a2dda486b6'
          assert C74B_COMPARATIVE_RESULT_INSPECTION == 'NONE'
          assert payload == engine_identity()
          assert payload['comparative_result_inspection'] == 'NONE'
          assert payload['full_comparative_executor_present'] is False
          assert payload['common_c1_commit_authority'] is True
          assert payload['engine_fingerprint'] == EXPECTED_C74B_ENGINE_FINGERPRINT
          print('comparative_result_inspection=NONE')
          print('frozen_engine_fingerprint=' + EXPECTED_C74B_ENGINE_FINGERPRINT)
          PY

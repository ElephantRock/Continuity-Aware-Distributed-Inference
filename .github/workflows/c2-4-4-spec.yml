name: c2-4-4-spec

on:
  push:
    branches: [c2/fault-trust-oracle]
    paths:
      - .github/workflows/c2-4-4-spec.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c2/fault-trust-oracle
          fetch-depth: 0
      - name: Synchronize C2.4.4 implementation record
        run: python tools/c2_4_4_spec_patch.py
      - name: Commit record and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c2-4-4-spec.yml tools/c2_4_4_spec_patch.py
          git add spec/10-c2-fault-injection-record.md
          git commit -m "Synchronize C2.4.4 trust-oracle record"
          git push origin HEAD:c2/fault-trust-oracle

name: c1-restore-hardening

on:
  push:
    branches: [c1/deterministic-core]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c1/deterministic-core
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Harden restored-state validation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast

          # Make every independent oracle check non-strippable under python -O.
          path = Path('continuity/invariants.py')
          tree = ast.parse(path.read_text())

          class AssertTransformer(ast.NodeTransformer):
              def visit_Assert(self, node):
                  self.generic_visit(node)
                  call = ast.Call(
                      func=ast.Name(id='_require', ctx=ast.Load()),
                      args=[node.test] + ([node.msg] if node.msg is not None else []),
                      keywords=[],
                  )
                  return ast.copy_location(ast.Expr(value=call), node)

          tree = AssertTransformer().visit(tree)
          ast.fix_missing_locations(tree)
          text = ast.unparse(tree)
          marker = 'from .entities import AttemptAuthority, BindingStatus, EvidenceAuthority, EvidenceStatus, RequestStatus, StateValidity\n'
          helper = '''\n\ndef _require(condition, message=None):\n    if not condition:\n        raise AssertionError(message or "Continuity invariant violation")\n'''
          if marker not in text:
              raise SystemExit('invariants import marker not found')
          text = text.replace(marker, marker + helper, 1)

          old = '''    def assert_all(self) -> None:\n        self._parent_scopes()\n'''
          new = '''    def assert_all(self) -> None:\n        self._global_identity_uniqueness()\n        self._parent_scopes()\n'''
          if old not in text:
              raise SystemExit('assert_all marker not found')
          text = text.replace(old, new, 1)

          insert = '''    def _global_identity_uniqueness(self):\n        collections = (\n            self.c.programs, self.c.sessions, self.c.continuations, self.c.requests,\n            self.c.attempts, self.c.phases, self.c.states, self.c.replicas,\n            self.c.bindings, self.c.evidence, self.c.outputs, self.c.events,\n        )\n        seen = set()\n        for collection in collections:\n            for key, entity in collection.items():\n                _require(entity.id == key)\n                _require(key not in seen)\n                seen.add(key)\n\n'''
          parent_marker = '    def _parent_scopes(self):\n'
          if parent_marker not in text:
              raise SystemExit('parent scope marker not found')
          text = text.replace(parent_marker, insert + parent_marker, 1)

          old_commit = '''    def _request_commit_consistency(self):\n        for r in self.c.requests.values():\n            if r.status == RequestStatus.COMPLETED:\n                _require(r.current_attempt_id is None)\n                _require(r.committed_attempt_id is not None)\n                _require(r.authoritative_output_id is not None)\n                _require(self.c.outputs[r.authoritative_output_id].attempt_id == r.committed_attempt_id)\n'''
          new_commit = '''    def _request_commit_consistency(self):\n        from .entities import ExecutionStatus\n        for r in self.c.requests.values():\n            if r.status == RequestStatus.COMPLETED:\n                _require(r.current_attempt_id is None)\n                _require(r.committed_attempt_id is not None)\n                _require(r.authoritative_output_id is not None)\n                attempt = self.c.attempts[r.committed_attempt_id]\n                output = self.c.outputs[r.authoritative_output_id]\n                _require(attempt.request_id == r.id)\n                _require(attempt.authority_status == AttemptAuthority.COMMITTED)\n                _require(attempt.execution_status == ExecutionStatus.SUCCEEDED)\n                _require(output.attempt_id == r.committed_attempt_id)\n                _require(output.terminal)\n'''
          if old_commit not in text:
              raise SystemExit('request commit consistency block not found')
          text = text.replace(old_commit, new_commit, 1)
          path.write_text(text + '\n')

          # Add typed snapshot schema validation before state is installed.
          path = Path('continuity/serialization.py')
          text = path.read_text()
          text = text.replace('import json\nfrom typing import Any, Callable, Iterable, Optional\n',
                              'import json\nimport math\nimport types\nfrom typing import Any, Callable, Iterable, Optional, Union, get_args, get_origin, get_type_hints\n')

          marker = '''_CORE_FIELDS = (\n    "programs",\n    "sessions",\n    "continuations",\n    "requests",\n    "attempts",\n    "phases",\n    "states",\n    "replicas",\n    "bindings",\n    "evidence",\n    "outputs",\n    "events",\n    "event_order",\n    "current_binding_by_subject",\n    "current_epoch_by_subject",\n    "last_allocated_epoch_by_subject",\n)\n'''
          additions = marker + '''\n_ENTITY_COLLECTION_TYPES = {\n    "programs": Program,\n    "sessions": Session,\n    "continuations": Continuation,\n    "requests": LogicalRequest,\n    "attempts": Attempt,\n    "phases": Phase,\n    "states": ReusableState,\n    "replicas": StateReplica,\n    "bindings": Binding,\n    "evidence": Evidence,\n    "outputs": Output,\n    "events": SemanticEvent,\n}\n\n\ndef _matches_annotation(value: Any, annotation: Any) -> bool:\n    if annotation is Any:\n        return True\n    origin = get_origin(annotation)\n    args = get_args(annotation)\n    if origin in (Union, types.UnionType):\n        return any(_matches_annotation(value, arg) for arg in args)\n    if origin is frozenset:\n        return isinstance(value, frozenset) and all(_matches_annotation(item, args[0]) for item in value)\n    if origin is tuple:\n        if not isinstance(value, tuple):\n            return False\n        if len(args) == 2 and args[1] is Ellipsis:\n            return all(_matches_annotation(item, args[0]) for item in value)\n        return len(value) == len(args) and all(_matches_annotation(item, arg) for item, arg in zip(value, args))\n    if annotation is bool:\n        return type(value) is bool\n    if annotation is int:\n        return type(value) is int\n    if annotation is float:\n        return type(value) in (int, float) and not isinstance(value, bool) and math.isfinite(float(value))\n    if annotation is str:\n        return type(value) is str\n    if isinstance(annotation, type) and issubclass(annotation, Enum):\n        return isinstance(value, annotation)\n    if isinstance(annotation, type):\n        return isinstance(value, annotation)\n    return False\n\n\ndef _validate_entity(entity: Any, expected_type: type, field_name: str) -> None:\n    if not isinstance(entity, expected_type):\n        raise ValueError(f"snapshot {field_name} contains {type(entity).__name__}, expected {expected_type.__name__}")\n    hints = get_type_hints(expected_type)\n    for field in fields(expected_type):\n        value = getattr(entity, field.name)\n        if not _matches_annotation(value, hints[field.name]):\n            raise ValueError(f"snapshot {field_name}.{entity.id}.{field.name} has invalid type")\n\n\ndef _validate_decoded_state(state: dict[str, Any]) -> None:\n    for name, expected_type in _ENTITY_COLLECTION_TYPES.items():\n        collection = state[name]\n        if not isinstance(collection, dict):\n            raise ValueError(f"snapshot {name} must decode to a dict")\n        for key, entity in collection.items():\n            if type(key) is not str:\n                raise ValueError(f"snapshot {name} keys must be strings")\n            _validate_entity(entity, expected_type, name)\n            if entity.id != key:\n                raise ValueError(f"snapshot {name} key does not match entity ID")\n\n    event_order = state["event_order"]\n    if not isinstance(event_order, list) or any(type(item) is not str for item in event_order):\n        raise ValueError("snapshot event_order must decode to list[str]")\n\n    for name in ("current_binding_by_subject",):\n        mapping = state[name]\n        if not isinstance(mapping, dict) or any(type(k) is not str or type(v) is not str for k, v in mapping.items()):\n            raise ValueError(f"snapshot {name} must decode to dict[str, str]")\n\n    for name in ("current_epoch_by_subject", "last_allocated_epoch_by_subject"):\n        mapping = state[name]\n        if not isinstance(mapping, dict) or any(type(k) is not str or type(v) is not int for k, v in mapping.items()):\n            raise ValueError(f"snapshot {name} must decode to dict[str, int]")\n\n    seen = set()\n    for name in _ENTITY_COLLECTION_TYPES:\n        ids = set(state[name])\n        if seen.intersection(ids):\n            raise ValueError("snapshot reuses a logical ID across entity collections")\n        seen.update(ids)\n'''
          if text.count(marker) != 1:
              raise SystemExit('CORE_FIELDS block mismatch')
          text = text.replace(marker, additions, 1)

          old_restore = '''    payload = _strict_json_loads(snapshot)\n    if payload.get("schema") != SNAPSHOT_SCHEMA:\n        raise ValueError("unsupported Continuity snapshot schema")\n    core = ContinuityCore(semantic_validity=semantic_validity)\n    state = payload["state"]\n    missing = set(_CORE_FIELDS) - set(state)\n    if missing:\n        raise ValueError(f"snapshot missing core fields: {sorted(missing)}")\n    for name in _CORE_FIELDS:\n        setattr(core, name, _decode(state[name]))\n    from .invariants import InvariantOracle\n    try:\n        InvariantOracle(core).assert_all()\n    except (AssertionError, KeyError, TypeError, AttributeError) as exc:\n        raise ValueError("snapshot violates Continuity invariants") from exc\n    return core\n'''
          new_restore = '''    payload = _strict_json_loads(snapshot)\n    if not isinstance(payload, dict) or payload.get("schema") != SNAPSHOT_SCHEMA:\n        raise ValueError("unsupported Continuity snapshot schema")\n    raw_state = payload.get("state")\n    if not isinstance(raw_state, dict):\n        raise ValueError("snapshot state must be an object")\n    missing = set(_CORE_FIELDS) - set(raw_state)\n    extra = set(raw_state) - set(_CORE_FIELDS)\n    if missing:\n        raise ValueError(f"snapshot missing core fields: {sorted(missing)}")\n    if extra:\n        raise ValueError(f"snapshot has unknown core fields: {sorted(extra)}")\n    try:\n        state = {name: _decode(raw_state[name]) for name in _CORE_FIELDS}\n        _validate_decoded_state(state)\n    except (KeyError, TypeError, AttributeError, ValueError) as exc:\n        raise ValueError("snapshot violates Continuity schema") from exc\n    core = ContinuityCore(semantic_validity=semantic_validity)\n    for name in _CORE_FIELDS:\n        setattr(core, name, state[name])\n    from .invariants import InvariantOracle\n    try:\n        InvariantOracle(core).assert_all()\n    except (AssertionError, KeyError, TypeError, AttributeError, ValueError) as exc:\n        raise ValueError("snapshot violates Continuity invariants") from exc\n    return core\n'''
          if text.count(old_restore) != 1:
              raise SystemExit('restore block mismatch')
          text = text.replace(old_restore, new_restore, 1)
          path.write_text(text)

          # Regression coverage for all four review findings plus enum/member schema validation.
          p = Path('tests/test_serialization.py')
          text = p.read_text()
          if 'import subprocess\n' not in text:
              text = text.replace('import json\n', 'import json\nimport subprocess\nimport sys\n')
          text += r'''\n\n@pytest.mark.parametrize("corruption", ["failed_attempt", "nonterminal_output"])\ndef test_restore_rechecks_completed_request_finalization_postconditions(corruption, exact_evidence):\n    core = ContinuityCore()\n    core.create_program('p'); core.create_session('s', 'p'); core.create_continuation('c', 's')\n    core.create_request('r', 'c'); core.start_attempt('a', 'r'); core.complete_attempt('a', True)\n    exact_evidence(core, 'e', {('attempt', 'a')})\n    core.create_output('o', 'a', True, ['e']); core.finalize_request('r', 'o', now=10)\n    if corruption == 'failed_attempt':\n        core.attempts['a'] = replace(core.attempts['a'], execution_status=ExecutionStatus.FAILED)\n    else:\n        core.outputs['o'] = replace(core.outputs['o'], terminal=False)\n    with pytest.raises(ValueError, match='snapshot violates Continuity invariants'):\n        restore_core(snapshot_core(core))\n\n\ndef test_restore_rejects_wrong_entity_member_type():\n    core = ContinuityCore(); core.create_program('p')\n    payload = json.loads(snapshot_core(core))\n    payload['state']['programs'] = {'$dict': [['p', 'not-a-program']]}\n    with pytest.raises(ValueError, match='snapshot violates Continuity schema'):\n        restore_core(json.dumps(payload))\n\n\ndef test_restore_rejects_wrong_enum_type_inside_entity():\n    core = ContinuityCore(); core.create_program('p')\n    payload = json.loads(snapshot_core(core))\n    program = payload['state']['programs']['$dict'][0][1]\n    program['fields']['status'] = {'$enum': 'RequestStatus', 'name': 'READY'}\n    with pytest.raises(ValueError, match='snapshot violates Continuity schema'):\n        restore_core(json.dumps(payload))\n\n\ndef test_restore_rejects_cross_collection_global_id_reuse():\n    core = ContinuityCore(); core.create_program('p')\n    core.sessions['p'] = Session('p', 'p')\n    with pytest.raises(ValueError):\n        restore_core(snapshot_core(core))\n\n\ndef test_restore_validation_survives_python_optimized_mode():\n    core = ContinuityCore()\n    core.create_program('p'); core.create_session('s', 'p'); core.create_continuation('c', 's')\n    core.create_request('r', 'c'); core.start_attempt('a1', 'r'); core.start_attempt('a2', 'r')\n    core.attempts['a1'] = replace(core.attempts['a1'], authority_status=AttemptAuthority.CURRENT)\n    snapshot = snapshot_core(core)\n    code = '''\nimport sys\nfrom continuity.serialization import restore_core\ntry:\n    restore_core(sys.stdin.read())\nexcept ValueError:\n    raise SystemExit(0)\nraise SystemExit(1)\n'''\n    result = subprocess.run([sys.executable, '-O', '-c', code], input=snapshot, text=True, capture_output=True)\n    assert result.returncode == 0, result.stderr\n\n\ndef test_invariant_oracle_contains_no_strippable_assert_nodes():\n    import ast\n    from pathlib import Path\n    tree = ast.parse(Path('continuity/invariants.py').read_text())\n    assert not any(isinstance(node, ast.Assert) for node in ast.walk(tree))\n'''
          # Need Session for direct corrupted-state construction.
          text = text.replace('    AttemptAuthority, Evidence, EvidenceAuthority, EvidenceStatus, ExecutionStatus, PhaseStatus, PhaseType,\n',
                              '    AttemptAuthority, Evidence, EvidenceAuthority, EvidenceStatus, ExecutionStatus, PhaseStatus, PhaseType, Session,\n')
          p.write_text(text)
          PY
      - name: Validate deterministic C1 suite
        run: |
          python -m pip install --upgrade pip pytest
          python -m pytest -q
      - name: Commit restore hardening and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add continuity/invariants.py continuity/serialization.py tests/test_serialization.py
          git rm .github/workflows/c1-restore-hardening.yml
          git commit -m 'Harden C1 snapshot restoration invariants'
          git push origin HEAD:c1/deterministic-core

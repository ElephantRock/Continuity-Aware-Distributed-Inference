name: c2-4-4-trust-hardening

on:
  push:
    branches: [c2/fault-trust-oracle]
    paths:
      - .github/workflows/c2-4-4-trust-hardening.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c2/fault-trust-oracle
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Harden independent trust oracle
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('simulator/fault_oracle.py')
          text = path.read_text()

          marker = '''_EXPECTED_EVENT_KIND: dict[FaultClass, EventKind] = {
    FaultClass.WORKER_FAILURE: EventKind.WORKER_FAILED,
    FaultClass.REPLICA_LOSS: EventKind.STATE_LOST,
    FaultClass.REPLICA_EVICTION: EventKind.STATE_EVICTED,
    FaultClass.ATTEMPT_TIMEOUT: EventKind.ATTEMPT_TIMEOUT,
    FaultClass.LATE_ATTEMPT_RESULT: EventKind.LATE_RESULT,
    FaultClass.STALE_ATTEMPT_OBSERVATION: EventKind.OBSERVATION_CREATED,
}
'''
          addition = marker + '''
_EXPECTED_GROUND_TRUTH_EFFECT: dict[FaultClass, str] = {
    FaultClass.DELIVERY_DELAY: "original delivery cancelled; equivalent delivery rescheduled later",
    FaultClass.DELIVERY_DROP: "pending delivery cancelled and not replaced",
    FaultClass.DELIVERY_DUPLICATE: "original delivery retained and one duplicate delivery added",
    FaultClass.DELIVERY_REORDER: "target delivery cancelled and reinserted after the anchor delivery",
    FaultClass.WORKER_FAILURE: "WORKER_FAILED event scheduled for the target worker",
    FaultClass.REPLICA_LOSS: "STATE_LOST event scheduled for the target physical replica",
    FaultClass.REPLICA_EVICTION: "STATE_EVICTED event scheduled for the target physical replica",
    FaultClass.ATTEMPT_TIMEOUT: "ATTEMPT_TIMEOUT delivery scheduled; semantic supersession remains C1-authorized",
    FaultClass.LATE_ATTEMPT_RESULT: "late physical success delivery scheduled for an already SUPERSEDED Attempt",
    FaultClass.STALE_ATTEMPT_OBSERVATION: "terminal observation delivered for a SUCCEEDED but SUPERSEDED Attempt",
}

_EXPECTED_PRESSURE: dict[FaultClass, tuple[str, ...]] = {
    FaultClass.DELIVERY_DELAY: ("Evidence freshness", "late/stale event fencing"),
    FaultClass.DELIVERY_DROP: ("missing Evidence", "fail-closed reconciliation"),
    FaultClass.DELIVERY_DUPLICATE: ("Event/Evidence idempotence",),
    FaultClass.DELIVERY_REORDER: ("causal ordering", "late/stale event fencing"),
    FaultClass.WORKER_FAILURE: ("physical availability", "retry/recovery path"),
    FaultClass.REPLICA_LOSS: ("physical StateReplica availability", "State reuse safety"),
    FaultClass.REPLICA_EVICTION: ("physical StateReplica availability", "cold-resume/reuse path"),
    FaultClass.ATTEMPT_TIMEOUT: ("Attempt authority supersession", "late-result fencing"),
    FaultClass.LATE_ATTEMPT_RESULT: ("superseded-event fencing", "finalization authority"),
    FaultClass.STALE_ATTEMPT_OBSERVATION: ("Evidence scope/authority", "terminal-request fencing"),
}

_EXPECTED_SAFE: dict[FaultClass, tuple[str, ...]] = {
    FaultClass.DELIVERY_DELAY: ("WAIT", "RETRY", "IGNORE_STALE", "MATCHED_AFTER_DELAY"),
    FaultClass.DELIVERY_DROP: ("WAIT", "RETRY", "RECOMPUTE", "FAIL_CLOSED"),
    FaultClass.DELIVERY_DUPLICATE: ("IDEMPOTENT", "IGNORE_DUPLICATE"),
    FaultClass.DELIVERY_REORDER: ("IGNORE_STALE", "WAIT", "RETRY", "MATCHED"),
    FaultClass.WORKER_FAILURE: ("FAIL_PHYSICAL_WORK", "RETRY", "RECOMPUTE", "MIGRATE"),
    FaultClass.REPLICA_LOSS: ("RECOMPUTE", "MIGRATE", "REJECT_REUSE"),
    FaultClass.REPLICA_EVICTION: ("RECOMPUTE", "RESTORE", "COLD_RESUME"),
    FaultClass.ATTEMPT_TIMEOUT: ("RETRY", "IGNORE_STALE", "WAIT"),
    FaultClass.LATE_ATTEMPT_RESULT: ("RECORD_NON_AUTHORITATIVE", "IGNORE_STALE"),
    FaultClass.STALE_ATTEMPT_OBSERVATION: ("REJECT", "IGNORE_STALE", "FAIL_CLOSED"),
}
'''
          if marker not in text:
              raise SystemExit('missing expected event-kind marker')
          text = text.replace(marker, addition, 1)

          old = '''    if not _is_nonempty_string(record.ground_truth_effect):
        errors.append(f"{prefix}: ground_truth_effect must be a non-empty string")
    if not _string_tuple(record.expected_invariant_pressure):
        errors.append(f"{prefix}: expected_invariant_pressure must be tuple[str, ...]")
    if not _string_tuple(record.expected_safe_outcomes):
        errors.append(f"{prefix}: expected_safe_outcomes must be tuple[str, ...]")
'''
          new = '''    if not _is_nonempty_string(record.ground_truth_effect):
        errors.append(f"{prefix}: ground_truth_effect must be a non-empty string")
    elif record.ground_truth_effect != _EXPECTED_GROUND_TRUTH_EFFECT[record.fault_class]:
        errors.append(f"{prefix}: ground_truth_effect disagrees with fault class contract")
    if not _string_tuple(record.expected_invariant_pressure):
        errors.append(f"{prefix}: expected_invariant_pressure must be tuple[str, ...]")
    elif record.expected_invariant_pressure != _EXPECTED_PRESSURE[record.fault_class]:
        errors.append(f"{prefix}: expected_invariant_pressure disagrees with fault class contract")
    if not _string_tuple(record.expected_safe_outcomes):
        errors.append(f"{prefix}: expected_safe_outcomes must be tuple[str, ...]")
    elif record.expected_safe_outcomes != _EXPECTED_SAFE[record.fault_class]:
        errors.append(f"{prefix}: expected_safe_outcomes disagree with fault class contract")
'''
          if old not in text:
              raise SystemExit('missing metadata validation target')
          text = text.replace(old, new, 1)

          old = '''    elif record.fault_class is FaultClass.DELIVERY_DROP:
        if produced or cancelled != (record.target,) or float(record.duration) != 0.0:
            errors.append(f"{prefix}: drop must only cancel target with zero duration")
'''
          new = '''    elif record.fault_class is FaultClass.DELIVERY_DROP:
        if (
            produced
            or cancelled != (record.target,)
            or not _finite_nonnegative(record.duration)
            or float(record.duration) != 0.0
        ):
            errors.append(f"{prefix}: drop must only cancel target with zero duration")
'''
          if old not in text:
              raise SystemExit('missing drop robustness target')
          text = text.replace(old, new, 1)

          old = '''            if record.id in seen_ids:
                violations.append(f"duplicate FaultID in oracle input: {record.id}")
            seen_ids.add(record.id)
'''
          new = '''            if _is_nonempty_string(record.id):
                if record.id in seen_ids:
                    violations.append(f"duplicate FaultID in oracle input: {record.id}")
                seen_ids.add(record.id)
'''
          if old not in text:
              raise SystemExit('missing hashability target')
          text = text.replace(old, new, 1)

          old = '''            expected_kind = _EXPECTED_EVENT_KIND.get(record.fault_class)
            if expected_kind is not None and record.produced_event_ids:
                event_id = record.produced_event_ids[0]
                event = trace.get(event_id) or pending.get(event_id)
                if event is not None and event.kind is not expected_kind:
                    errors.append(
                        f"{prefix}: produced event kind {event.kind.value} != {expected_kind.value}"
                    )

            params = _parameter_dict(record) or {}
'''
          new = '''            expected_kind = _EXPECTED_EVENT_KIND.get(record.fault_class)
            if expected_kind is not None and record.produced_event_ids:
                event_id = record.produced_event_ids[0]
                event = trace.get(event_id) or pending.get(event_id)
                if event is not None:
                    if event.kind is not expected_kind:
                        errors.append(
                            f"{prefix}: produced event kind {event.kind.value} != {expected_kind.value}"
                        )
                    expected_time = float(record.injection_time) + float(record.duration)
                    if not math.isclose(float(event.time), expected_time, rel_tol=0.0, abs_tol=1e-12):
                        errors.append(f"{prefix}: produced event time disagrees with injection_time + duration")
                    payload = dict(event.payload)
                    if record.fault_class is FaultClass.WORKER_FAILURE:
                        if payload.get("worker_id") != record.target:
                            errors.append(f"{prefix}: worker-failure event target payload disagrees with record")
                    elif record.fault_class in {FaultClass.REPLICA_LOSS, FaultClass.REPLICA_EVICTION}:
                        if payload.get("replica_id") != record.target:
                            errors.append(f"{prefix}: replica event target payload disagrees with record")
                    elif record.fault_class is FaultClass.ATTEMPT_TIMEOUT:
                        if payload.get("timed_out_attempt_id") != record.target:
                            errors.append(f"{prefix}: timeout event Attempt target disagrees with record")
                    elif record.fault_class is FaultClass.LATE_ATTEMPT_RESULT:
                        if payload.get("attempt_id") != record.target:
                            errors.append(f"{prefix}: late-result event Attempt target disagrees with record")
                    elif record.fault_class is FaultClass.STALE_ATTEMPT_OBSERVATION:
                        if payload.get("attempt_id") != record.target:
                            errors.append(f"{prefix}: stale-observation Attempt target disagrees with record")

            params = _parameter_dict(record) or {}
            if record.produced_event_ids:
                produced_id = record.produced_event_ids[0]
                produced_event = trace.get(produced_id) or pending.get(produced_id)
                if produced_event is not None:
                    recorded_time = params.get("replacement_time", params.get("duplicate_time"))
                    if recorded_time is not None and _finite_nonnegative(recorded_time):
                        if not math.isclose(float(produced_event.time), float(recorded_time), rel_tol=0.0, abs_tol=1e-12):
                            errors.append(f"{prefix}: runtime produced-event time disagrees with record metadata")
'''
          if old not in text:
              raise SystemExit('missing runtime validation target')
          text = text.replace(old, new, 1)

          old = '''            if self.resources is not None and record.fault_class is FaultClass.WORKER_FAILURE:
                event_id = record.produced_event_ids[0]
                if event_id in trace and record.target in self.resources.workers:
'''
          new = '''            if self.resources is not None and record.fault_class is FaultClass.WORKER_FAILURE:
                event_id = record.produced_event_ids[0]
                if record.target not in self.resources.workers:
                    errors.append(f"{prefix}: worker-failure target is absent from ResourceModel")
                elif event_id in trace:
'''
          if old not in text:
              raise SystemExit('missing worker target validation target')
          text = text.replace(old, new, 1)

          old = '''            if self.resources is not None and record.fault_class is FaultClass.REPLICA_LOSS:
                event_id = record.produced_event_ids[0]
                if event_id in trace and record.target in self.resources.replicas:
'''
          new = '''            if self.resources is not None and record.fault_class is FaultClass.REPLICA_LOSS:
                event_id = record.produced_event_ids[0]
                if record.target not in self.resources.replicas:
                    errors.append(f"{prefix}: replica-loss target is absent from ResourceModel")
                elif event_id in trace:
'''
          if old not in text:
              raise SystemExit('missing replica loss target validation target')
          text = text.replace(old, new, 1)

          old = '''            if self.resources is not None and record.fault_class is FaultClass.REPLICA_EVICTION:
                event_id = record.produced_event_ids[0]
                if event_id in trace and record.target in self.resources.replicas:
'''
          new = '''            if self.resources is not None and record.fault_class is FaultClass.REPLICA_EVICTION:
                event_id = record.produced_event_ids[0]
                if record.target not in self.resources.replicas:
                    errors.append(f"{prefix}: replica-eviction target is absent from ResourceModel")
                elif event_id in trace:
'''
          if old not in text:
              raise SystemExit('missing replica eviction target validation target')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          cat > tests/simulator/test_fault_oracle.py <<'PYTEST'
          from __future__ import annotations

          from dataclasses import replace
          import json

          import pytest

          from continuity.core import ContinuityCore
          from simulator import ContinuityAdapter, DiscreteEventSimulator, EventKind, ResourceModel
          from simulator.events import freeze_payload
          from simulator.fault_campaign import FaultCampaignManifest
          from simulator.fault_oracle import (
              FaultTrustOracle,
              fault_record_from_json,
              fault_record_to_dict,
              fault_record_to_json,
              fault_records_from_jsonl,
              fault_records_to_jsonl,
          )
          from simulator.faults import FaultClass, FaultInjector, ProbabilisticFaultDecision
          from simulator.resources import WorkerStatus


          def _delay_case(*, run: bool = False):
              sim = DiscreteEventSimulator()
              sim.schedule(EventKind.ATTEMPT_COMPLETED, at=2, event_id="e")
              injector = FaultInjector(sim, seed=17)
              record = injector.delay_delivery("e", 3, fault_id="delay")
              if run:
                  sim.run()
              return sim, injector, record


          def test_trust_oracle_accepts_valid_fault_before_and_after_delivery():
              sim, injector, _ = _delay_case(run=False)
              assert FaultTrustOracle.from_injector(injector).assert_all().ok
              sim.run()
              report = FaultTrustOracle.from_injector(injector).assert_all()
              assert report.ok
              assert report.checked_fault_ids == ("delay",)
              assert report.semantic_invariants_ok


          def test_fault_record_json_and_jsonl_round_trip_are_strict_and_canonical():
              _, injector, record = _delay_case()
              text = fault_record_to_json(record)
              assert fault_record_from_json(text) == record
              jsonl = fault_records_to_jsonl(injector.records)
              assert fault_records_from_jsonl(jsonl) == injector.records
              assert jsonl == text + "\n"


          def test_fault_record_json_rejects_nonfinite_numeric_and_unknown_fields():
              _, _, record = _delay_case()
              payload = fault_record_to_dict(record)
              payload["injection_time"] = float("nan")
              with pytest.raises(ValueError, match="non-finite"):
                  fault_record_from_json(json.dumps(payload))

              payload = fault_record_to_dict(record)
              payload["unknown"] = 1
              with pytest.raises(ValueError, match="fields do not match"):
                  fault_record_from_json(json.dumps(payload))


          def test_malformed_record_is_reported_not_crashable_by_bad_duration_or_unhashable_id():
              sim, injector, record = _delay_case()
              bad_duration = replace(record, duration="not-a-number")
              bad_id = replace(record, id=[])
              report = FaultTrustOracle(
                  sim,
                  (bad_duration, bad_id),
                  injector_seed=injector.seed,
              ).inspect()
              assert not report.ok
              assert any("duration must be finite" in item for item in report.violations)
              assert any("FaultID must be a non-empty string" in item for item in report.violations)


          def test_class_contract_metadata_tampering_is_detected():
              sim, injector, record = _delay_case()
              forged = replace(
                  record,
                  ground_truth_effect="different effect",
                  expected_invariant_pressure=("different pressure",),
                  expected_safe_outcomes=("different outcome",),
              )
              report = FaultTrustOracle(sim, (forged,), injector_seed=injector.seed).inspect()
              assert any("ground_truth_effect disagrees" in item for item in report.violations)
              assert any("expected_invariant_pressure disagrees" in item for item in report.violations)
              assert any("expected_safe_outcomes disagree" in item for item in report.violations)


          def test_missing_runtime_produced_event_is_detected():
              sim, injector, record = _delay_case()
              forged = replace(
                  record,
                  produced_event_ids=("missing",),
                  parameters=freeze_payload(
                      {
                          "original_time": 2.0,
                          "replacement_time": 5.0,
                          "replacement_event_id": "missing",
                      }
                  ),
              )
              report = FaultTrustOracle(sim, (forged,), injector_seed=injector.seed).inspect()
              assert any("produced EventID missing" in item for item in report.violations)


          def test_runtime_event_kind_and_target_payload_are_independently_checked():
              sim = DiscreteEventSimulator()
              resources = ResourceModel(sim)
              resources.add_worker("w1")
              resources.add_worker("w2")
              injector = FaultInjector(sim, resources)
              valid = injector.fail_worker("w1", fault_id="worker")

              sim.schedule(
                  EventKind.ATTEMPT_FAILED,
                  at=0,
                  event_id="wrong-kind",
                  payload={"worker_id": "w1"},
              )
              wrong_kind = replace(
                  valid,
                  produced_event_ids=("wrong-kind",),
                  parameters=freeze_payload({"event_id": "wrong-kind"}),
              )
              report = FaultTrustOracle(
                  sim, (wrong_kind,), injector_seed=injector.seed, resources=resources
              ).inspect()
              assert any("produced event kind" in item for item in report.violations)

              sim.schedule(
                  EventKind.WORKER_FAILED,
                  at=0,
                  event_id="wrong-target",
                  payload={"worker_id": "w2"},
              )
              wrong_target = replace(
                  valid,
                  produced_event_ids=("wrong-target",),
                  parameters=freeze_payload({"event_id": "wrong-target"}),
              )
              report = FaultTrustOracle(
                  sim, (wrong_target,), injector_seed=injector.seed, resources=resources
              ).inspect()
              assert any("target payload disagrees" in item for item in report.violations)


          def test_composed_delay_then_drop_is_trusted_but_repeated_cancellation_is_not():
              sim = DiscreteEventSimulator()
              sim.schedule(EventKind.ATTEMPT_COMPLETED, at=1, event_id="e")
              injector = FaultInjector(sim)
              delayed = injector.delay_delivery("e", 2, fault_id="delay")
              dropped = injector.drop_delivery(delayed.produced_event_ids[0], fault_id="drop")
              sim.run()
              assert FaultTrustOracle.from_injector(injector).assert_all().ok

              duplicate_cancel = replace(dropped, id="drop-again")
              report = FaultTrustOracle(
                  sim,
                  (delayed, dropped, duplicate_cancel),
                  injector_seed=injector.seed,
              ).inspect()
              assert any("cancelled by multiple faults" in item for item in report.violations)


          def test_transformation_cycle_is_detected_even_when_runtime_ids_are_fully_consumed():
              template_sim, _, template = _delay_case()
              del template_sim
              sim = DiscreteEventSimulator()
              sim.run(until=10)
              first = replace(
                  template,
                  id="f1",
                  target="a",
                  injection_time=0.0,
                  duration=1.0,
                  parameters=freeze_payload(
                      {"original_time": 0.0, "replacement_time": 1.0, "replacement_event_id": "b"}
                  ),
                  produced_event_ids=("b",),
                  cancelled_event_ids=("a",),
              )
              second = replace(
                  template,
                  id="f2",
                  target="b",
                  injection_time=1.0,
                  duration=1.0,
                  parameters=freeze_payload(
                      {"original_time": 1.0, "replacement_time": 2.0, "replacement_event_id": "a"}
                  ),
                  produced_event_ids=("a",),
                  cancelled_event_ids=("b",),
              )
              report = FaultTrustOracle(sim, (first, second), injector_seed=17).inspect()
              assert any("contains cycle" in item for item in report.violations)


          def test_probabilistic_decision_must_match_record_seed_draw_class_target_and_faultid():
              sim = DiscreteEventSimulator()
              sim.schedule(EventKind.ATTEMPT_COMPLETED, at=1, event_id="e")
              injector = FaultInjector(sim, seed=91)
              record = injector.probabilistic_delivery_fault(
                  "e", {FaultClass.DELIVERY_DROP: 1.0}
              )
              assert record is not None
              decision = injector.decisions[0]
              forged = replace(decision, target="different")
              report = FaultTrustOracle(
                  sim,
                  injector.records,
                  injector_seed=injector.seed,
                  decisions=(forged,),
              ).inspect()
              assert any("target disagrees" in item for item in report.violations)


          def test_no_fault_probabilistic_decision_cannot_name_faultid():
              sim = DiscreteEventSimulator()
              decision = ProbabilisticFaultDecision(7, 0, "e", 0.5, None, "ghost")
              report = FaultTrustOracle(
                  sim, (), injector_seed=7, decisions=(decision,)
              ).inspect()
              assert any("no-fault probabilistic decision names a FaultID" in item for item in report.violations)


          def test_campaign_manifest_must_match_trusted_record_schedule_and_decisions():
              sim, injector, _ = _delay_case()
              manifest = FaultCampaignManifest.from_injector(
                  injector,
                  campaign_id="campaign",
                  git_commit="revision",
                  scenario_fingerprint="scenario",
                  generator="test",
              )
              report = FaultTrustOracle.from_injector(injector, manifest=manifest).assert_all()
              assert report.manifest_fingerprint == manifest.manifest_fingerprint

              forged_manifest = replace(manifest, schedule=())
              report = FaultTrustOracle.from_injector(
                  injector, manifest=forged_manifest
              ).inspect()
              assert any("schedule differs" in item for item in report.violations)


          def test_worker_failure_followed_by_legitimate_recovery_remains_trusted():
              sim = DiscreteEventSimulator()
              resources = ResourceModel(sim)
              resources.add_worker("w1")
              injector = FaultInjector(sim, resources)
              injector.fail_worker("w1", fault_id="down")
              resources.recover_worker("w1")
              sim.run()
              assert resources.workers["w1"].status is WorkerStatus.UP
              assert FaultTrustOracle.from_injector(injector).assert_all().ok


          def test_c1_invariant_failure_is_reported_by_independent_trust_oracle(monkeypatch):
              sim = DiscreteEventSimulator()
              adapter = ContinuityAdapter(sim, ContinuityCore())
              injector = FaultInjector(sim)

              def fail(_self):
                  raise AssertionError("forced semantic invariant failure")

              monkeypatch.setattr("simulator.fault_oracle.InvariantOracle.assert_all", fail)
              report = FaultTrustOracle.from_injector(injector, adapter=adapter).inspect()
              assert not report.semantic_invariants_ok
              assert any("C1 invariant oracle failure" in item for item in report.violations)
          PYTEST

      - name: Validate adversarial trust corpus and full suite
        run: |
          python -m pip install --upgrade pip pytest
          python -m pytest tests/simulator/test_fault_oracle.py
          python -m pytest
      - name: Commit hardening and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c2-4-4-trust-hardening.yml
          git add simulator/fault_oracle.py tests/simulator/test_fault_oracle.py
          git commit -m "Harden C2.4.4 independent fault trust oracle"
          git push origin HEAD:c2/fault-trust-oracle

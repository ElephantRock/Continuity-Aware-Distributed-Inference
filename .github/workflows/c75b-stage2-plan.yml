name: c75b-stage2-plan

on:
  push:
    branches:
      - c7/g2-results
    paths:
      - .github/workflows/c75b-stage2-plan.yml
      - experiments/c75_g2_run.py
      - tests/experiments/test_c75_g2_run.py
  pull_request:
    paths:
      - .github/workflows/c75b-stage2-plan.yml
      - experiments/c75_g2_run.py
      - tests/experiments/test_c75_g2_run.py
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'
  STAGE1_REVIEW_SHA: '6aeb5a3147951645a270088aac0647c03084a73c'

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify immutable checkout
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: Install test runner only
        run: python -m pip install 'pytest==8.4.2'
      - name: Prove reviewed stage1 mechanics are byte-unchanged
        run: |
          git diff --exit-code "$STAGE1_REVIEW_SHA"..HEAD -- \
            experiments/c75_g2_execute.py \
            experiments/c75_g2_adjudicate.py \
            experiments/c75_g2_finalize.py \
            experiments/c75_g2_stage2_contract.py \
            tests/experiments/test_c75_g2_execute.py \
            tests/experiments/test_c75_g2_adjudicate.py \
            tests/experiments/test_c75_g2_stage2_contract.py \
            tests/experiments/test_c75_g2_review_repairs.py \
            .github/workflows/c75b-g2-results.yml \
            spec/59-c7.5b-g2-results.md
      - name: Run stage2 orchestration tests
        run: python -m pytest -q tests/experiments/test_c75_g2_run.py
      - name: Reproduce execution plan twice
        run: |
          python -m experiments.c75_g2_run > /tmp/plan-a.json
          python -m experiments.c75_g2_run > /tmp/plan-b.json
          cmp /tmp/plan-a.json /tmp/plan-b.json
      - name: Verify exact plan and no comparative output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/plan-a.json').read_text())
          assert payload['schema'] == 'cadi.c7.5b.frozen-sweep-runner.v1'
          assert payload['stage1_review_sha'] == '6aeb5a3147951645a270088aac0647c03084a73c'
          assert payload['p1_cells'] == 75
          assert payload['p4_cells'] == 16
          assert payload['p7_cells'] == 3
          assert payload['seed_count'] == 64
          assert payload['paired_program_evaluations'] == 12032
          assert payload['program_row_count'] == 60160
          assert payload['comparative_execution'] == 'READY_NOT_RUN'
          assert 'final_adjudication' not in payload
          assert 'gate_g2' not in payload
          print(json.dumps(payload, sort_keys=True, separators=(',', ':')))
          print('comparative_execution=READY_NOT_RUN')
          PY
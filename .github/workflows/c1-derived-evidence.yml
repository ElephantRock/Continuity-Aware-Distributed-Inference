name: c1-derived-evidence

on:
  push:
    branches: [c1/deterministic-core]
    paths: [.github/workflows/c1-derived-evidence.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c1/deterministic-core
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply derived Evidence provenance model
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match in {path}; got {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'continuity/entities.py',
              '    valid_until: Optional[float] = None\n    confidence: Optional[float] = None\n\n@dataclass(frozen=True)\nclass Output:',
              '    valid_until: Optional[float] = None\n    confidence: Optional[float] = None\n    derived_from: FrozenSet[str] = frozenset()\n    derivation_rule: Optional[str] = None\n\n@dataclass(frozen=True)\nclass Output:'
          )

          replace_once(
              'continuity/core.py',
              '    def record_evidence(self, e: Evidence) -> Evidence:\n        existing = self.evidence.get(e.id)\n        if existing is not None:\n            if existing == e:\n                return existing\n            raise SemanticViolation("conflicting duplicate Evidence identity")\n        self._unique(e.id); self.evidence[e.id] = e; return e\n',
              '''    def record_evidence(self, e: Evidence) -> Evidence:\n        existing = self.evidence.get(e.id)\n        if existing is not None:\n            if existing == e:\n                return existing\n            raise SemanticViolation("conflicting duplicate Evidence identity")\n\n        has_derivation = bool(e.derived_from or e.derivation_rule)\n        if e.authority == EvidenceAuthority.DERIVED:\n            if not e.derived_from or not e.derivation_rule:\n                raise SemanticViolation("DERIVED Evidence requires support IDs and an explicit derivation rule")\n        elif has_derivation:\n            raise SemanticViolation("derived Evidence provenance cannot silently escalate authority in C1")\n\n        if e.derived_from:\n            supports = []\n            for support_id in e.derived_from:\n                support = self.evidence.get(support_id)\n                if support is None:\n                    raise SemanticViolation("DERIVED Evidence references unknown supporting Evidence")\n                supports.append(support)\n            union_scope = set().union(*(set(s.scope) for s in supports)) if supports else set()\n            if not set(e.scope).issubset(union_scope):\n                raise SemanticViolation("DERIVED Evidence scope exceeds supporting Evidence scope")\n            if e.status == EvidenceStatus.VALID and any(s.status != EvidenceStatus.VALID for s in supports):\n                raise SemanticViolation("VALID DERIVED Evidence requires VALID supporting Evidence")\n\n        self._unique(e.id); self.evidence[e.id] = e; return e\n'''
          )

          replace_once(
              'continuity/invariants.py',
              'from .entities import AttemptAuthority, BindingStatus, RequestStatus, StateValidity\n',
              'from .entities import AttemptAuthority, BindingStatus, EvidenceAuthority, EvidenceStatus, RequestStatus, StateValidity\n'
          )
          replace_once(
              'continuity/invariants.py',
              '        self._binding_authority()\n        self._event_identity()\n',
              '        self._binding_authority()\n        self._evidence_derivation()\n        self._event_identity()\n'
          )
          replace_once(
              'continuity/invariants.py',
              '    def _event_identity(self):\n',
              '''    def _evidence_derivation(self):\n        for evidence in self.c.evidence.values():\n            has_derivation = bool(evidence.derived_from or evidence.derivation_rule)\n            if evidence.authority == EvidenceAuthority.DERIVED:\n                assert evidence.derived_from\n                assert evidence.derivation_rule\n            else:\n                assert not has_derivation\n            if evidence.derived_from:\n                supports = [self.c.evidence[eid] for eid in evidence.derived_from]\n                union_scope = set().union(*(set(s.scope) for s in supports)) if supports else set()\n                assert set(evidence.scope).issubset(union_scope)\n                if evidence.status == EvidenceStatus.VALID:\n                    assert all(s.status == EvidenceStatus.VALID for s in supports)\n\n    def _event_identity(self):\n'''
          )

          Path('tests/invariants/test_derived_evidence.py').write_text('''import pytest\n\nfrom continuity.entities import Evidence, EvidenceAuthority, EvidenceStatus\nfrom continuity.errors import SemanticViolation\nfrom continuity.invariants import InvariantOracle\n\n\ndef support(id_, *, status=EvidenceStatus.VALID, scope=frozenset({('state', 'x')})):\n    return Evidence(id_, 'support', 'observer', EvidenceAuthority.EXACT_OBSERVATION, status, 1.0, scope)\n\n\ndef test_derived_evidence_requires_support_ids_and_rule(core):\n    with pytest.raises(SemanticViolation):\n        core.record_evidence(Evidence('d', 'derived', 'rule-engine', EvidenceAuthority.DERIVED, EvidenceStatus.VALID, 2.0))\n\n\ndef test_derived_evidence_requires_known_support(core):\n    derived = Evidence(\n        'd', 'derived', 'rule-engine', EvidenceAuthority.DERIVED, EvidenceStatus.VALID, 2.0,\n        frozenset({('state', 'x')}), derived_from=frozenset({'missing'}), derivation_rule='copy-state-presence'\n    )\n    with pytest.raises(SemanticViolation):\n        core.record_evidence(derived)\n\n\ndef test_valid_derived_evidence_records_explicit_provenance(core):\n    core.record_evidence(support('s1'))\n    derived = Evidence(\n        'd1', 'derived', 'rule-engine', EvidenceAuthority.DERIVED, EvidenceStatus.VALID, 2.0,\n        frozenset({('state', 'x')}), derived_from=frozenset({'s1'}), derivation_rule='copy-state-presence'\n    )\n    assert core.record_evidence(derived) == derived\n    assert core.evidence['d1'].derived_from == frozenset({'s1'})\n    InvariantOracle(core).assert_all()\n\n\ndef test_derived_provenance_cannot_silently_promote_to_authoritative(core):\n    core.record_evidence(support('s1'))\n    promoted = Evidence(\n        'bad', 'promoted', 'rule-engine', EvidenceAuthority.AUTHORITATIVE, EvidenceStatus.VALID, 2.0,\n        frozenset({('state', 'x')}), derived_from=frozenset({'s1'}), derivation_rule='vote'\n    )\n    with pytest.raises(SemanticViolation):\n        core.record_evidence(promoted)\n\n\ndef test_derived_evidence_scope_cannot_exceed_support_scope(core):\n    core.record_evidence(support('s1'))\n    derived = Evidence(\n        'bad', 'derived', 'rule-engine', EvidenceAuthority.DERIVED, EvidenceStatus.VALID, 2.0,\n        frozenset({('state', 'x'), ('binding', 'b')}), derived_from=frozenset({'s1'}), derivation_rule='expand'\n    )\n    with pytest.raises(SemanticViolation):\n        core.record_evidence(derived)\n\n\ndef test_valid_derived_evidence_cannot_depend_on_nonvalid_support(core):\n    core.record_evidence(support('s1', status=EvidenceStatus.STALE))\n    derived = Evidence(\n        'bad', 'derived', 'rule-engine', EvidenceAuthority.DERIVED, EvidenceStatus.VALID, 2.0,\n        frozenset({('state', 'x')}), derived_from=frozenset({'s1'}), derivation_rule='copy'\n    )\n    with pytest.raises(SemanticViolation):\n        core.record_evidence(derived)\n''')
          PY
      - name: Run deterministic C1 tests
        run: |
          python -m pip install --upgrade pip pytest
          python -m pytest -q
      - name: Commit derived Evidence model and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add continuity/entities.py continuity/core.py continuity/invariants.py tests/invariants/test_derived_evidence.py
          git rm .github/workflows/c1-derived-evidence.yml
          git commit -m 'Add explicit DERIVED Evidence provenance'
          git push origin HEAD:c1/deterministic-core

name: c73a-retention-protocol

on:
  push:
    branches:
      - c7/retention-protocol
    paths:
      - .github/workflows/c73a-retention-protocol.yml
      - experiments/c7_protocol.py
      - experiments/c73_retention_protocol.py
      - tests/experiments/test_c73_retention_protocol.py
      - tests/experiments/test_c73_retention_state_binding.py
      - spec/51-c7.3a-retention-protocol.md
      - spec/52-c7.3a-state-size-review-resolution.md
      - pyproject.toml
  pull_request:
    paths:
      - .github/workflows/c73a-retention-protocol.yml
      - experiments/c7_protocol.py
      - experiments/c73_retention_protocol.py
      - tests/experiments/test_c73_retention_protocol.py
      - tests/experiments/test_c73_retention_state_binding.py
      - spec/51-c7.3a-retention-protocol.md
      - spec/52-c7.3a-state-size-review-resolution.md
      - pyproject.toml
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'

jobs:
  protocol-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify immutable checkout
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: Install test runner only
        run: python -m pip install 'pytest==8.4.2'
      - name: Run C7.3a contract tests
        run: python -m pytest -q tests/experiments/test_c73_retention_protocol.py tests/experiments/test_c73_retention_state_binding.py
      - name: Reproduce protocol twice
        run: |
          python -m experiments.c73_retention_protocol > /tmp/c73a-a.json
          python -m experiments.c73_retention_protocol > /tmp/c73a-b.json
          cmp /tmp/c73a-a.json /tmp/c73a-b.json
      - name: Verify pre-result boundary and emit establishment fingerprint
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from experiments.c7_protocol import C7_PROTOCOL_FINGERPRINT
          from experiments.c73_retention_protocol import (
              C73_DEFAULT_STATE_BYTES,
              C73_DEFAULT_STATE_TOKENS,
              C73_RETENTION_PROTOCOL_FINGERPRINT,
              C73_STATE_SIZE_MAP_FINGERPRINT,
          )

          payload = json.loads(Path('/tmp/c73a-a.json').read_text())
          assert payload['schema'] == 'cadi.c7.3a.retention-protocol.v1'
          assert payload['base_commit'] == '47f1574c79f84c2e32e432a5da0f0522a6436937'
          assert payload['parent_protocol']['fingerprint'] == C7_PROTOCOL_FINGERPRINT
          assert C7_PROTOCOL_FINGERPRINT == '706e0d5fff362a1eda8c906b957c914251c6e7949bac6be3c2c143ae21625474'
          assert payload['protocol_fingerprint'] == C73_RETENTION_PROTOCOL_FINGERPRINT
          assert payload['comparative_result_inspection'] == 'NONE'
          assert payload['policy_ids'] == ['LRU', 'FIXED_TTL', 'SESSION_PINNING', 'LIFECYCLE_B4']
          assert payload['policy_visibility']['LRU_sees_lifecycle_for_ranking_or_release'] is False
          assert payload['policy_visibility']['FIXED_TTL_sees_lifecycle_for_ranking_or_release'] is False
          assert payload['policy_visibility']['LIFECYCLE_B4_sees_state_lifecycle'] is True
          assert payload['state_size_rule']['default_state_tokens'] == C73_DEFAULT_STATE_TOKENS == 16
          assert payload['state_size_rule']['default_state_bytes'] == C73_DEFAULT_STATE_BYTES == 8388608
          assert payload['state_size_rule']['state_size_map_fingerprint'] == C73_STATE_SIZE_MAP_FINGERPRINT
          assert payload['state_size_rule']['byte_mapping_evidence'] == 'SIMULATED_SOURCE_MODEL_DERIVED_P_SRC2'
          assert 'policy_results' not in payload
          assert 'p2_results' not in payload
          assert 'p3_results' not in payload
          print(f'candidate_retention_protocol_fingerprint={C73_RETENTION_PROTOCOL_FINGERPRINT}')
          print(f'state_size_map_fingerprint={C73_STATE_SIZE_MAP_FINGERPRINT}')
          print('comparative_result_inspection=NONE')
          PY

name: c64d-review-fix-patch

on:
  push:
    branches: [c6/source-polynomial-v3-adequacy]
    paths: [.github/workflows/c64d-review-fix-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c6/source-polynomial-v3-adequacy
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply bounded C6.4d review fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {text.count(old)}')
              return text.replace(old, new, 1)

          # 1. True IEEE-754 representable-step distance for the frozen 8-ULP fence.
          p = Path('simulator/c64d_export.py')
          text = p.read_text()
          text = replace_once(text, 'import math\n', 'import math\nimport struct\n', 'export import struct')
          marker = '\ndef source_equivalence_report(\n'
          helper = '''\ndef _ordered_binary64(value: float) -> int:\n    bits = struct.unpack(\">Q\", struct.pack(\">d\", value))[0]\n    sign = 1 << 63\n    mask = (1 << 64) - 1\n    return ((~bits) & mask) if bits & sign else bits | sign\n\n\ndef _ulp_distance(left: float, right: float) -> int:\n    if left == right:\n        return 0\n    return abs(_ordered_binary64(left) - _ordered_binary64(right))\n\n'''
          if marker not in text:
              raise SystemExit('export equivalence marker missing')
          text = text.replace(marker, helper + marker, 1)
          old = '''    max_absolute_error = 0.0\n    max_ulp_ratio = 0.0\n    violations = 0\n    for row, reference in zip(rows, source, strict=True):\n        predicted = canonical.evaluate(row)\n        absolute = abs(predicted - reference)\n        ulp = max(math.ulp(predicted), math.ulp(reference))\n        ratio = 0.0 if absolute == 0 else absolute / ulp\n        max_absolute_error = max(max_absolute_error, absolute)\n        max_ulp_ratio = max(max_ulp_ratio, ratio)\n        if absolute > C64D_EQUIVALENCE_ULP_BUDGET * ulp:\n            violations += 1\n    return {\n        \"schema\": C64D_EXPORT_SCHEMA,\n        \"component_id\": canonical.component_id,\n        \"hardware_id\": canonical.hardware_id,\n        \"sample_count\": len(rows),\n        \"ulp_budget\": C64D_EQUIVALENCE_ULP_BUDGET,\n        \"max_absolute_error\": max_absolute_error,\n        \"max_ulp_ratio\": max_ulp_ratio,\n        \"violation_count\": violations,\n        \"decision\": \"PASS\" if violations == 0 else \"FAIL\",\n    }\n'''
          new = '''    max_absolute_error = 0.0\n    max_ulp_distance = 0\n    violations = 0\n    for row, reference in zip(rows, source, strict=True):\n        predicted = canonical.evaluate(row)\n        absolute = abs(predicted - reference)\n        distance = _ulp_distance(predicted, reference)\n        max_absolute_error = max(max_absolute_error, absolute)\n        max_ulp_distance = max(max_ulp_distance, distance)\n        if distance > C64D_EQUIVALENCE_ULP_BUDGET:\n            violations += 1\n    return {\n        \"schema\": C64D_EXPORT_SCHEMA,\n        \"component_id\": canonical.component_id,\n        \"hardware_id\": canonical.hardware_id,\n        \"sample_count\": len(rows),\n        \"ulp_budget\": C64D_EQUIVALENCE_ULP_BUDGET,\n        \"max_absolute_error\": max_absolute_error,\n        \"max_ulp_distance\": max_ulp_distance,\n        \"violation_count\": violations,\n        \"decision\": \"PASS\" if violations == 0 else \"FAIL\",\n    }\n'''
          text = replace_once(text, old, new, 'true ULP distance')
          p.write_text(text)

          # 2. Train source estimators without invoking Vidur's eager prediction materialization,
          #    and fence the complete non-fresh materialization domain.
          p = Path('experiments/c64d_source_polynomial_adequacy.py')
          text = p.read_text()
          text = replace_once(
              text,
              'C64D_EQUIVALENCE_FAILED = \"NOT_EVALUATED_EQUIVALENCE_FENCE_FAILED\"\nC64D_EVALUATED = \"EVALUATED\"\n',
              'C64D_EQUIVALENCE_FAILED = \"NOT_EVALUATED_EQUIVALENCE_FENCE_FAILED\"\nC64D_BOUNDARY_INVALIDATED = \"NOT_EVALUATED_BOUNDARY_INVALIDATED\"\nC64D_EVALUATED = \"EVALUATED\"\n',
              'boundary invalidated constant',
          )
          insert_at = text.index('\ndef _export_component(')
          training_only = '''\ndef _training_only_predictor(\n    *,\n    vidur_root: Path,\n    hardware_id: str,\n    pipeline_stages: int,\n    work_dir: Path,\n):\n    \"\"\"Run the exact pinned training path without materializing source predictions.\"\"\"\n    from vidur.execution_time_predictor.linear_regression_execution_time_predictor import (\n        LinearRegressionExecutionTimePredictor,\n    )\n\n    cls = LinearRegressionExecutionTimePredictor\n    had_local_override = \"_predict_from_models\" in cls.__dict__\n    original = getattr(cls, \"_predict_from_models\")\n    setattr(cls, \"_predict_from_models\", lambda self: {})\n    try:\n        predictor = _predictor(\n            vidur_root=vidur_root,\n            hardware_id=hardware_id,\n            pipeline_stages=pipeline_stages,\n            work_dir=work_dir,\n        )\n    finally:\n        if had_local_override:\n            setattr(cls, \"_predict_from_models\", original)\n        else:\n            delattr(cls, \"_predict_from_models\")\n    if predictor._predictions != {}:\n        raise AssertionError(\"training-only predictor materialized source predictions\")\n    return predictor\n\n'''
          text = text[:insert_at] + training_only + text[insert_at:]

          start = text.index('def _training_frames(')
          end = text.index('\ndef _equivalence(', start)
          frames = '''def _materialization_frames_without_fresh_boundary(\n    prefill_predictor: Any, transfer_predictor: Any\n) -> dict[str, tuple[Any, tuple[str, ...]]]:\n    import numpy as np\n    import pandas as pd\n\n    prefill_max = int(prefill_predictor._max_tokens)\n    transfer_max = int(transfer_predictor._max_tokens)\n    exact_fresh = set(C64C_FRESH_PREFILL_AXES)\n    rounded_fresh = {((axis + 7) // 8) * 8 for axis in C64C_FRESH_PREFILL_AXES}\n    fresh_transfer_tokens = set()\n    for axis in C64C_FRESH_TRANSFER_AXES:\n        domain = transfer_lookup_domain(axis)\n        if not domain.evaluable or domain.num_tokens is None:\n            raise ValueError(f\"frozen C6.4c transfer boundary is outside source domain: {axis}\")\n        fresh_transfer_tokens.add(domain.num_tokens)\n\n    compute = pd.DataFrame({\"num_tokens\": np.arange(1, prefill_max + 1, dtype=np.int64)})\n    compute_nonfresh = compute[~compute[\"num_tokens\"].isin(rounded_fresh)].copy()\n    kv_save_nonfresh = compute[~compute[\"num_tokens\"].isin(exact_fresh)].copy()\n    send_recv = pd.DataFrame({\"num_tokens\": np.arange(1, transfer_max + 1, dtype=np.int64)})\n    send_recv_nonfresh = send_recv[~send_recv[\"num_tokens\"].isin(fresh_transfer_tokens)].copy()\n\n    granularity = int(prefill_predictor._config.kv_cache_prediction_granularity)\n    max_request = int(prefill_predictor._config.prediction_max_tokens_per_request)\n    max_chunk = int(prefill_predictor._config.prediction_max_prefill_chunk_size)\n    kv_values = np.arange(0, max_request + 1, granularity, dtype=np.int64)\n    chunks = np.arange(1, max_chunk + 1, dtype=np.int64)\n    attention = pd.DataFrame(\n        {\n            \"kv_cache_size\": np.repeat(kv_values, len(chunks)),\n            \"prefill_chunk_size_squared\": np.tile(chunks * chunks, len(kv_values)),\n        }\n    )\n    fresh_squares = {axis * axis for axis in exact_fresh}\n    fresh_rows = (attention[\"kv_cache_size\"] == 0) & attention[\"prefill_chunk_size_squared\"].isin(fresh_squares)\n    attention_nonfresh = attention[~fresh_rows].copy()\n\n    result: dict[str, tuple[Any, tuple[str, ...]]] = {\n        component_id: (compute_nonfresh, (\"num_tokens\",))\n        for component_id in _COMPUTE_COMPONENTS\n    }\n    result[\"attn_kv_cache_save\"] = (kv_save_nonfresh, (\"num_tokens\",))\n    result[\"attn_prefill\"] = (\n        attention_nonfresh,\n        (\"kv_cache_size\", \"prefill_chunk_size_squared\"),\n    )\n    result[\"send_recv\"] = (send_recv_nonfresh, (\"num_tokens\",))\n    return result\n\n'''
          text = text[:start] + frames + text[end:]
          text = replace_once(
              text,
              '    frames = _training_frames(prefill_predictor, transfer_predictor)\n',
              '    frames = _materialization_frames_without_fresh_boundary(prefill_predictor, transfer_predictor)\n',
              'equivalence frame call',
          )
          text = replace_once(
              text,
              '        \"training_domain_only\": True,\n        \"fresh_boundary_values_consumed\": False,\n',
              '        \"equivalence_domain\": \"source_materialization_domain_excluding_c64c_boundary_component_identities\",\n        \"fresh_boundary_component_predictions_consumed_current_execution\": False,\n        \"fresh_boundary_values_consumed\": False,\n',
              'equivalence metadata',
          )
          cstart = text.index('def _compile_hardware(')
          cend = text.index('\ndef compile_once(', cstart)
          block = text[cstart:cend]
          block = block.replace('prefill_predictor = _predictor(', 'prefill_predictor = _training_only_predictor(', 1)
          block = block.replace('transfer_predictor = _predictor(', 'transfer_predictor = _training_only_predictor(', 1)
          block = replace_once(
              block,
              '    components = tuple(\n',
              '    if prefill_predictor._predictions or transfer_predictor._predictions:\n        raise AssertionError(\"compile path must not materialize source prediction tables\")\n\n    components = tuple(\n',
              'compile no predictions assertion',
          )
          text = text[:cstart] + block + text[cend:]

          fstart = text.index('def _fresh_source_values(')
          fend = text.index('\ndef evaluate_once(', fstart)
          blocked_fresh = '''def _fresh_source_values(\n    *,\n    vidur_root: Path,\n    hardware_id: str,\n    work_root: Path,\n) -> tuple[dict[int, float], dict[int, float]]:\n    raise RuntimeError(\n        \"C6.4c second boundary was materialized by superseded C6.4d predictor construction; \"\n        \"fresh adequacy evaluation is permanently blocked for this boundary\"\n    )\n\n'''
          text = text[:fstart] + blocked_fresh + text[fend:]

          estart = text.index('def evaluate_once(')
          eend = text.index('\ndef main()', estart)
          evaluate = '''def evaluate_once(vidur_root: Path) -> dict[str, Any]:\n    snapshot = verify_upstream_snapshot(vidur_root)\n    state_source_blobs = _verify_state_source_blobs(vidur_root)\n    hardware_records: list[dict[str, Any]] = []\n\n    with tempfile.TemporaryDirectory(prefix=\"c64d-\") as temp_dir:\n        work_root = Path(temp_dir)\n        for hardware_id in sorted(C64B_HARDWARE_CONFIG):\n            profile, equivalence = _compile_hardware(\n                vidur_root=vidur_root,\n                hardware_id=hardware_id,\n                work_root=work_root,\n            )\n            decode = _validate_carried_decode(vidur_root, hardware_id)\n            representation_decision = (\n                AdequacyDecision.INADEQUATE_REVISE_REPRESENTATION.value\n                if equivalence[\"decision\"] == \"FAIL\"\n                else None\n            )\n            hardware_records.append(\n                {\n                    \"hardware_id\": hardware_id,\n                    \"source_sha256\": VIDUR_SOURCE_SHA256[hardware_id],\n                    \"profile\": profile.to_dict(),\n                    \"profile_fingerprint\": profile.fingerprint,\n                    \"source_equivalence\": equivalence,\n                    \"carried_single_token_decode\": decode,\n                    \"multi_token_decode_composition\": {\n                        \"evidence_class\": \"ANALYTICALLY_DERIVED\",\n                        \"mechanic\": \"m*fixed + slope*(m*n + m*(m-1)/2)\",\n                        \"new_physical_validation\": False,\n                    },\n                    \"fresh_evaluation_status\": C64D_BOUNDARY_INVALIDATED,\n                    \"fresh_prefill\": None,\n                    \"fresh_transfer\": None,\n                    \"adequacy_decision\": None,\n                    \"representation_decision\": representation_decision,\n                }\n            )\n\n    equivalence_failed = any(\n        item[\"source_equivalence\"][\"decision\"] == \"FAIL\"\n        for item in hardware_records\n    )\n    representation_decision = (\n        AdequacyDecision.INADEQUATE_REVISE_REPRESENTATION.value\n        if equivalence_failed\n        else None\n    )\n    result: dict[str, Any] = {\n        \"schema\": C64D_RESULT_SCHEMA,\n        \"result_kind\": (\n            \"PRE_FRESH_EQUIVALENCE_FAILURE\"\n            if equivalence_failed\n            else \"BOUNDARY_INVALIDATED_REFREEZE_REQUIRED\"\n        ),\n        \"representation_id\": C64C_REPRESENTATION_ID,\n        \"protocol_id\": C64B_PROTOCOL_ID,\n        \"protocol_fingerprint\": c64b_protocol_fingerprint(),\n        \"evidence_class\": C64B_REFERENCE_EVIDENCE,\n        \"source_snapshot\": snapshot,\n        \"state_memory_source_blobs\": state_source_blobs,\n        \"fresh_boundary\": {\n            \"prefill_input_tokens\": list(C64C_FRESH_PREFILL_AXES),\n            \"transfer_bytes\": list(C64C_FRESH_TRANSFER_AXES),\n            \"frozen_by_c64c_merge\": \"041bf75102628da401b771845fd0b436f261cd7e\",\n            \"status\": \"INVALIDATED_BY_SUPERSEDED_PREDICTOR_MATERIALIZATION\",\n            \"materialized_in_superseded_workflow_runs\": [\n                34272077193,\n                34306392038,\n                34307451811,\n            ],\n            \"contains_serialized_fresh_reference_timings\": False,\n            \"source_model_predictions_were_materialized\": True,\n        },\n        \"hardware\": hardware_records,\n        \"adequacy_decision\": None,\n        \"representation_decision\": representation_decision,\n        \"decision\": (\n            representation_decision\n            if representation_decision is not None\n            else \"BOUNDARY_INVALIDATED_REFREEZE_REQUIRED\"\n        ),\n        \"post_hoc_repairs\": [],\n    }\n    result[\"scientific_fingerprint\"] = _sha256_json(result)\n    return result\n\n'''
          text = text[:estart] + evaluate + text[eend:]
          text = text.replace(
              'help=\"compile is timing-free with respect to the frozen C6.4c boundary\",',
              'help=\"compile trains/exports without materializing withheld C6.4c boundary predictions\",',
          )
          p.write_text(text)

          # 3. Regression for the binade-boundary ULP bug.
          p = Path('tests/simulator/test_c64d_export.py')
          text = p.read_text()
          marker = '\ndef test_carried_decode_is_exact_c63_evidence() -> None:\n'
          test = '''\ndef test_source_equivalence_counts_true_binary64_steps_across_binade() -> None:\n    model = _export(\n        _pipeline(\n            powers=((0,), (1,)),\n            coefficients=(0.0, 0.0),\n            intercept=1.0,\n            degree=1,\n        )\n    )\n    reference = 1.0\n    for _ in range(16):\n        reference = math.nextafter(reference, 0.0)\n    report = source_equivalence_report(\n        model, feature_rows=[(1.0,)], source_predictions=[reference]\n    )\n    assert report[\"max_ulp_distance\"] == 16\n    assert report[\"violation_count\"] == 1\n    assert report[\"decision\"] == \"FAIL\"\n\n'''
          if marker not in text:
              raise SystemExit('test insertion marker missing')
          text = text.replace(marker, test + marker, 1)
          p.write_text(text)

          # 4. Update dedicated workflow to validate semantics without hard-coding the
          #    pre-review aggregate fingerprint; a later exact-head run will freeze the
          #    corrected cross-host fingerprint after this review fix is observed.
          p = Path('.github/workflows/c64d-source-polynomial-adequacy.yml')
          text = p.read_text()
          text = text.replace(
              "          assert result['compile_fingerprint'] == '487aef0c98035bf24ac1c84572b9a95a1e32d3580e829dccd64a3f068cf8647a', result['compile_fingerprint']\n",
              "          assert len(result['compile_fingerprint']) == 64\n",
          )
          text = text.replace("          assert h100['decision'] == 'PASS', h100\n", "")
          text = text.replace("          assert failed['sample_count'] == 4410, failed\n", "")
          text = text.replace("          assert failed['violation_count'] == 11, failed\n", "          assert failed['violation_count'] > 0, failed\n")
          text = text.replace("          assert failed['max_ulp_ratio'] == 19.0, failed\n", "          assert failed['max_ulp_distance'] > 8, failed\n")
          text = text.replace("          assert failed['max_absolute_error'] == 8.881784197001252e-16, failed\n", "")
          text = text.replace(
              "              assert hw['fresh_evaluation_status'] == 'NOT_EVALUATED_EQUIVALENCE_FENCE_FAILED', hw\n",
              "              assert hw['fresh_evaluation_status'] == 'NOT_EVALUATED_BOUNDARY_INVALIDATED', hw\n",
          )
          text = text.replace(
              "              assert hw['source_equivalence']['fresh_boundary_values_consumed'] is False, hw\n",
              "              assert hw['source_equivalence']['fresh_boundary_values_consumed'] is False, hw\n              assert hw['adequacy_decision'] is None, hw\n",
          )
          text = text.replace(
              "          print('decision=', result['decision'])\n",
              "          assert result['adequacy_decision'] is None, result\n          assert result['fresh_boundary']['source_model_predictions_were_materialized'] is True, result\n          assert result['fresh_boundary']['status'] == 'INVALIDATED_BY_SUPERSEDED_PREDICTOR_MATERIALIZATION', result\n          print('decision=', result['decision'])\n",
          )
          text = text.replace("          print('fresh_boundary_consumed=false')\n", "          print('fresh_boundary_invalidated=true')\n")
          p.write_text(text)
          PY
      - name: Run focused contract tests
        run: |
          python -m pip install --upgrade pip pytest
          python -m pytest -q tests/simulator/test_c64d_export.py tests/simulator/test_inference_cost_v3.py
      - name: Commit review fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add simulator/c64d_export.py experiments/c64d_source_polynomial_adequacy.py tests/simulator/test_c64d_export.py .github/workflows/c64d-source-polynomial-adequacy.yml
          git diff --cached --check
          git commit -m "C6.4d: harden equivalence fence and boundary accounting"
          git push origin HEAD:c6/source-polynomial-v3-adequacy

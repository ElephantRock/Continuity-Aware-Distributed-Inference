name: c1-request-origin

on:
  push:
    branches: [c1/deterministic-core]
    paths:
      - '.github/workflows/c1-request-origin.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c1/deterministic-core
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply request-origin State consistency rule
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'expected one match in {path}; got {text.count(old)}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'continuity/core.py',
              '''        if origin_type == "request":\n            r = self.requests[origin_id]; return r.continuation_id, r.id, r.committed_attempt_id, None\n''',
              '''        if origin_type == "request":\n            r = self.requests[origin_id]\n            if r.status != RequestStatus.COMPLETED or r.committed_attempt_id is None:\n                raise SemanticViolation("request-origin State requires a COMPLETED request with a committed Attempt")\n            return r.continuation_id, r.id, r.committed_attempt_id, None\n'''
          )

          replace_once(
              'continuity/invariants.py',
              '''        if x.origin_type == "request":\n            request = self.c.requests[x.origin_id]\n            assert x.origin_request_id == request.id\n            assert x.origin_continuation_id == request.continuation_id\n            assert x.producer_phase_id is None\n            return\n''',
              '''        if x.origin_type == "request":\n            request = self.c.requests[x.origin_id]\n            assert request.status == RequestStatus.COMPLETED\n            assert request.committed_attempt_id is not None\n            assert x.origin_request_id == request.id\n            assert x.origin_continuation_id == request.continuation_id\n            assert x.producer_attempt_id == request.committed_attempt_id\n            assert x.producer_phase_id is None\n            return\n'''
          )

          p = Path('tests/invariants/test_catalogue_obligations.py')
          p.write_text(p.read_text() + '''\n\ndef test_request_origin_state_requires_completed_request(core):\n    core.create_program('p'); core.create_session('s', 'p'); core.create_continuation('c', 's')\n    core.create_request('r', 'c'); core.start_attempt('a', 'r')\n    with pytest.raises(SemanticViolation):\n        core.create_state('x', origin_type='request', origin_id='r')\n\n\ndef test_oracle_rejects_request_origin_wrong_committed_producer(core, exact_evidence):\n    from continuity.entities import ExecutionStatus\n    core.create_program('p'); core.create_session('s', 'p'); core.create_continuation('c', 's')\n    core.create_request('r', 'c')\n    core.start_attempt('a1', 'r')\n    core.start_attempt('a2', 'r'); core.complete_attempt('a2', True)\n    exact_evidence(core, 'e2', {('attempt', 'a2')})\n    core.create_output('o2', 'a2', True, ['e2']); core.finalize_request('r', 'o2', now=10)\n    state = core.create_state('x', origin_type='request', origin_id='r')\n    assert state.producer_attempt_id == 'a2'\n    core.states['x'] = replace(core.states['x'], producer_attempt_id='a1')\n    with pytest.raises(AssertionError):\n        InvariantOracle(core).assert_all()\n''')
          PY
      - name: Run deterministic C1 tests
        run: |
          python -m pip install --upgrade pip pytest
          python -m pytest -q
      - name: Commit request-origin rule and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add continuity/core.py continuity/invariants.py tests/invariants/test_catalogue_obligations.py
          git rm .github/workflows/c1-request-origin.yml
          git commit -m 'Constrain request-origin State to committed producer'
          git push origin HEAD:c1/deterministic-core

name: c64f-exhaustive-source-equivalence

on:
  push:
    branches:
      - c6/source-kernel-v4-exhaustive-proof
    paths:
      - .github/workflows/c64f-exhaustive-source-equivalence.yml
      - experiments/c64f_exhaustive_source_equivalence.py
      - simulator/inference_cost_v4.py
      - tests/simulator/test_c64f_exhaustive_source_equivalence.py
      - tests/simulator/test_inference_cost_v4.py
      - spec/47-c6.4f-exhaustive-source-equivalence-result.md
  pull_request:
    paths:
      - .github/workflows/c64f-exhaustive-source-equivalence.yml
      - experiments/c64f_exhaustive_source_equivalence.py
      - simulator/inference_cost_v4.py
      - tests/simulator/test_c64f_exhaustive_source_equivalence.py
      - tests/simulator/test_inference_cost_v4.py
      - spec/47-c6.4f-exhaustive-source-equivalence-result.md
  workflow_dispatch:

# Temporary recording permission for the first canonical result only. The
# recording step is push-only, stages exactly one artifact path, and is removed
# immediately after that artifact is committed. Scientific mechanics are
# unchanged from the frozen C6.4e protocol.
permissions:
  contents: write

env:
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  OPENBLAS_CORETYPE: 'Haswell'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  exhaustive-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify immutable event checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: Install frozen scientific runtime
        run: >-
          python -m pip install
          pytest==8.3.5
          numpy==1.26.4
          pandas==2.2.3
          scikit-learn==1.5.2
          scipy==1.14.1
          joblib==1.4.2
          threadpoolctl==3.5.0
          fasteners==0.19
      - name: Verify frozen platform, packages, and BLAS
        run: |
          python - <<'PY'
          import importlib.metadata as md
          import os
          import platform
          expected_packages = {
              'numpy': '1.26.4',
              'pandas': '2.2.3',
              'scikit-learn': '1.5.2',
              'scipy': '1.14.1',
              'joblib': '1.4.2',
              'threadpoolctl': '3.5.0',
              'fasteners': '0.19',
          }
          observed = {name: md.version(name) for name in expected_packages}
          assert observed == expected_packages, (expected_packages, observed)
          assert platform.python_version() == '3.12.14'
          assert platform.python_implementation() == 'CPython'
          assert platform.machine() == 'x86_64'
          assert os.environ.get('ImageOS') == 'ubuntu24'
          from simulator.inference_cost_v4 import assert_c64e_numerical_runtime
          print('runtime=', assert_c64e_numerical_runtime())
          print('ImageVersion=', os.environ.get('ImageVersion'))
          PY
      - name: Verify C6.4f harness without source execution
        run: >-
          python -m pytest -q -rs
          tests/simulator/test_inference_cost_v4.py
          tests/simulator/test_c64f_exhaustive_source_equivalence.py
      - name: Checkout exact pinned Vidur source
        run: |
          git clone --filter=blob:none https://github.com/microsoft/vidur.git .c64f_vidur
          git -C .c64f_vidur checkout --detach abae7f63aa857300f5cdc6f5e0d27860cd24721b
          test "$(git -C .c64f_vidur rev-parse HEAD)" = "abae7f63aa857300f5cdc6f5e0d27860cd24721b"
          test -z "$(git -C .c64f_vidur status --porcelain --untracked-files=all)"
      - name: Execute exact-source exhaustive proof twice
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/.c64f_vidur
        run: |
          python experiments/c64f_exhaustive_source_equivalence.py \
            --vidur-root .c64f_vidur \
            --output /tmp/c64f-run-1.json | tee /tmp/c64f-run-1.log
          python experiments/c64f_exhaustive_source_equivalence.py \
            --vidur-root .c64f_vidur \
            --output /tmp/c64f-run-2.json | tee /tmp/c64f-run-2.log
          cmp /tmp/c64f-run-1.json /tmp/c64f-run-2.json
      - name: Validate and stage canonical candidate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          expected_protocol = 'adc341d4e3eddf72c82e3a0c7b139b703b9ed0e662a724870aa8d74abe1f7df8'
          path = Path('/tmp/c64f-run-1.json')
          result = json.loads(path.read_text())
          assert result['schema'] == 'cadi.c6.4f.exhaustive-source-equivalence-result.v1'
          assert result['protocol_fingerprint'] == expected_protocol
          assert result['boundary_accounting']['replacement_fresh_boundary'] is None
          assert result['boundary_accounting']['holdout_claim'] is False
          assert result['post_hoc_repairs'] == []
          assert len(result['hardware']) == 2
          for hardware in result['hardware']:
              assert hardware['prefill']['point_count'] == 4096
              assert hardware['transfer']['point_count'] == 4096
          assert isinstance(result['scientific_fingerprint'], str)
          print('decision=', result['decision'])
          print('scientific_fingerprint=', result['scientific_fingerprint'])
          for hardware in result['hardware']:
              print(hardware['hardware_id'], 'decision=', hardware['decision'])
              print('  prefill max_ulp=', hardware['prefill']['max_ulp_distance'],
                    'violations=', hardware['prefill']['ulp_violation_count'])
              print('  transfer max_ulp=', hardware['transfer']['max_ulp_distance'],
                    'violations=', hardware['transfer']['ulp_violation_count'])
          out = Path('artifacts/c6.4f')
          out.mkdir(parents=True, exist_ok=True)
          (out / 'exhaustive-source-equivalence.json').write_bytes(path.read_bytes())
          PY
      - name: Commit canonical result artifact once
        if: github.event_name == 'push'
        run: |
          git add -- artifacts/c6.4f/exhaustive-source-equivalence.json
          staged="$(git diff --cached --name-only)"
          if [ -z "$staged" ]; then
            echo "Canonical artifact already matches the regenerated result."
            exit 0
          fi
          test "$staged" = "artifacts/c6.4f/exhaustive-source-equivalence.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "C6.4f: record canonical exhaustive source-equivalence result"
          git push origin HEAD:c6/source-kernel-v4-exhaustive-proof
      - name: Upload canonical candidate artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: c64f-exhaustive-source-equivalence-${{ github.sha }}
          path: artifacts/c6.4f/exhaustive-source-equivalence.json
          if-no-files-found: error
          retention-days: 30

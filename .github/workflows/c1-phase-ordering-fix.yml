name: c1-phase-ordering-fix

on:
  push:
    branches: [c1/deterministic-core]
    paths: [.github/workflows/c1-phase-ordering-fix.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c1/deterministic-core
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply Phase dependency ordering guard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match in {path}; got {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'continuity/core.py',
              '        for sid in dependencies:\n            dependency = self.states[sid]\n            if not self.is_ancestor(dependency.origin_continuation_id, oc):\n                raise SemanticViolation("derived State dependency must be a causal ancestor of the declared origin")\n',
              '        for sid in dependencies:\n            dependency = self.states[sid]\n            if not self.is_ancestor(dependency.origin_continuation_id, oc):\n                raise SemanticViolation("derived State dependency must be a causal ancestor of the declared origin")\n            if pp and dependency.producer_phase_id and dependency.producer_attempt_id == pa:\n                producer_phase = self.phases[pp]\n                dependency_phase = self.phases[dependency.producer_phase_id]\n                if dependency_phase.ordinal >= producer_phase.ordinal:\n                    raise SemanticViolation("derived State cannot depend on same-or-later Phase State within an Attempt")\n'
          )

          p = Path('tests/invariants/test_phases.py')
          p.write_text(p.read_text() + '''\n\ndef test_phase_origin_state_rejects_future_phase_dependency(core):\n    setup_attempt(core)\n    core.create_phase('prefill', 'a', PhaseType.PREFILL); core.set_phase_status('prefill', PhaseStatus.RUNNING); core.complete_phase('prefill')\n    core.create_phase('decode', 'a', PhaseType.DECODE); core.set_phase_status('decode', PhaseStatus.RUNNING); core.complete_phase('decode')\n    core.create_state('late', origin_type='phase', origin_id='decode')\n    with pytest.raises(SemanticViolation):\n        core.create_state('invalid', origin_type='phase', origin_id='prefill', derived_from=['late'])\n''')
          PY
      - name: Run deterministic C1 tests
        run: |
          python -m pip install --upgrade pip pytest
          python -m pytest -q
      - name: Commit ordering guard and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add continuity/core.py tests/invariants/test_phases.py
          git rm .github/workflows/c1-phase-ordering-fix.yml
          git commit -m 'Guard Phase-derived State causal ordering'
          git push origin HEAD:c1/deterministic-core

name: c2-4-substrate-hardening

on:
  push:
    branches: [c2/fault-injection-substrate]
    paths:
      - .github/workflows/c2-4-substrate-hardening.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c2/fault-injection-substrate
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply bounded fault-boundary hardening
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('simulator/faults.py')
          text = path.read_text()

          old = '''    def _append(self, record: FaultRecord) -> FaultRecord:\n        self._records.append(record)\n        return record\n\n    def _reserve_fault_id(self, fault_id: str | None) -> str:\n        actual = self._next_fault_id() if fault_id is None else fault_id\n        if not isinstance(actual, str) or not actual:\n            raise ValueError("fault_id must be a non-empty string")\n        if actual in self._record_ids:\n            raise ValueError(f"duplicate fault_id: {actual}")\n        self._record_ids.add(actual)\n        return actual\n\n    def _next_fault_id(self) -> str:\n        while True:\n            candidate = f"fault-{self._next_fault:08d}"\n            self._next_fault += 1\n            if candidate not in self._record_ids:\n                return candidate\n'''
          new = '''    def _append(self, record: FaultRecord) -> FaultRecord:\n        if record.id in self._record_ids:\n            raise RuntimeError(f"fault_id became committed before record append: {record.id}")\n        self._record_ids.add(record.id)\n        self._records.append(record)\n        while f"fault-{self._next_fault:08d}" in self._record_ids:\n            self._next_fault += 1\n        return record\n\n    def _reserve_fault_id(self, fault_id: str | None) -> str:\n        actual = self._next_fault_id() if fault_id is None else fault_id\n        if not isinstance(actual, str) or not actual:\n            raise ValueError("fault_id must be a non-empty string")\n        if actual in self._record_ids:\n            raise ValueError(f"duplicate fault_id: {actual}")\n        return actual\n\n    def _next_fault_id(self) -> str:\n        index = self._next_fault\n        while True:\n            candidate = f"fault-{index:08d}"\n            if candidate not in self._record_ids:\n                return candidate\n            index += 1\n'''
          if old not in text:
              raise SystemExit('missing fault-id allocator target')
          text = text.replace(old, new, 1)

          old = '''        max_delay_value = self._finite_nonnegative(max_delay, "max_delay")\n        draw = self._rng.random()\n        selected: FaultClass | None = None\n        cursor = 0.0\n        for fault_class in ordered:\n            cursor += normalized[fault_class]\n            if draw < cursor:\n                selected = fault_class\n                break\n\n        ordinal = len(self._decisions)\n        if selected is None:\n            self._decisions.append(\n                ProbabilisticFaultDecision(self.seed, ordinal, event.event_id, draw, None, None)\n            )\n            return None\n\n        fault_id = self._next_fault_id()\n        if selected is FaultClass.DELIVERY_DROP:\n            record = self.drop_delivery(event.event_id, fault_id=fault_id, draw=draw)\n        elif selected is FaultClass.DELIVERY_DUPLICATE:\n            delay = self._rng.uniform(0.0, max_delay_value) if max_delay_value else 0.0\n            record = self.duplicate_delivery(event.event_id, delay=delay, fault_id=fault_id, draw=draw)\n        else:\n            delay = self._rng.uniform(0.0, max_delay_value) if max_delay_value else 0.0\n            record = self.delay_delivery(event.event_id, delay, fault_id=fault_id, draw=draw)\n        self._decisions.append(\n            ProbabilisticFaultDecision(self.seed, ordinal, event.event_id, draw, selected, record.id)\n        )\n        return record\n'''
          new = '''        max_delay_value = self._finite_nonnegative(max_delay, "max_delay")\n        rng_state = self._rng.getstate()\n        try:\n            draw = self._rng.random()\n            selected: FaultClass | None = None\n            cursor = 0.0\n            for fault_class in ordered:\n                cursor += normalized[fault_class]\n                if draw < cursor:\n                    selected = fault_class\n                    break\n\n            ordinal = len(self._decisions)\n            if selected is None:\n                self._decisions.append(\n                    ProbabilisticFaultDecision(self.seed, ordinal, event.event_id, draw, None, None)\n                )\n                return None\n\n            fault_id = self._next_fault_id()\n            if selected is FaultClass.DELIVERY_DROP:\n                record = self.drop_delivery(event.event_id, fault_id=fault_id, draw=draw)\n            elif selected is FaultClass.DELIVERY_DUPLICATE:\n                delay = self._rng.uniform(0.0, max_delay_value) if max_delay_value else 0.0\n                record = self.duplicate_delivery(\n                    event.event_id, delay=delay, fault_id=fault_id, draw=draw\n                )\n            else:\n                delay = self._rng.uniform(0.0, max_delay_value) if max_delay_value else 0.0\n                record = self.delay_delivery(\n                    event.event_id, delay, fault_id=fault_id, draw=draw\n                )\n            self._decisions.append(\n                ProbabilisticFaultDecision(\n                    self.seed, ordinal, event.event_id, draw, selected, record.id\n                )\n            )\n            return record\n        except Exception:\n            self._rng.setstate(rng_state)\n            raise\n'''
          if old not in text:
              raise SystemExit('missing probabilistic RNG target')
          text = text.replace(old, new, 1)

          old = '''        trace = {event.event_id: event for event in self.simulator.trace}\n        pending = {event.event_id: event for event in self.simulator.pending_events}\n        for record in self._records:\n            for event_id in record.cancelled_event_ids:\n                if event_id in trace or event_id in pending:\n                    raise AssertionError(f"cancelled fault target remained live or executed: {event_id}")\n            for event_id in record.produced_event_ids:\n                if event_id not in trace and event_id not in pending:\n                    raise AssertionError(f"fault-produced event missing from simulator history/state: {event_id}")\n'''
          new = '''        trace = {event.event_id: event for event in self.simulator.trace}\n        pending = {event.event_id: event for event in self.simulator.pending_events}\n        cancelled_by_fault = {\n            event_id\n            for record in self._records\n            for event_id in record.cancelled_event_ids\n        }\n        for record in self._records:\n            for event_id in record.cancelled_event_ids:\n                if event_id in trace or event_id in pending:\n                    raise AssertionError(f"cancelled fault target remained live or executed: {event_id}")\n            for event_id in record.produced_event_ids:\n                if (\n                    event_id not in trace\n                    and event_id not in pending\n                    and event_id not in cancelled_by_fault\n                ):\n                    raise AssertionError(\n                        f"fault-produced event missing from simulator history/state: {event_id}"\n                    )\n'''
          if old not in text:
              raise SystemExit('missing composition ground truth target')
          text = text.replace(old, new, 1)

          old = '''            elif record.fault_class is FaultClass.WORKER_FAILURE and self.resources is not None:\n                event_id = record.produced_event_ids[0]\n                if event_id in trace and self.resources.workers[record.target].status is not WorkerStatus.DOWN:\n                    raise AssertionError("worker-failure ground truth did not produce DOWN worker")\n'''
          new = '''            elif record.fault_class is FaultClass.WORKER_FAILURE and self.resources is not None:\n                event_id = record.produced_event_ids[0]\n                if event_id in trace and self.resources.workers[record.target].status is not WorkerStatus.DOWN:\n                    order = {event.event_id: index for index, event in enumerate(self.simulator.trace)}\n                    failure_index = order[event_id]\n                    recovered_after = any(\n                        index > failure_index\n                        and event.kind is EventKind.WORKER_RECOVERED\n                        and dict(event.payload).get("worker_id") == record.target\n                        for index, event in enumerate(self.simulator.trace)\n                    )\n                    if not recovered_after:\n                        raise AssertionError("worker-failure ground truth did not produce DOWN worker")\n'''
          if old not in text:
              raise SystemExit('missing worker recovery ground truth target')
          text = text.replace(old, new, 1)
          path.write_text(text)

          tests_path = Path('tests/simulator/test_faults.py')
          tests = tests_path.read_text().replace(
              'match="within \\[0, 1\\]"', 'match=r"within \\[0, 1\\]"'
          )
          tests += '''\n\ndef test_rejected_transform_does_not_reserve_explicit_or_automatic_fault_id():\n    sim = DiscreteEventSimulator()\n    sim.schedule(EventKind.ATTEMPT_COMPLETED, at=1, event_id="e")\n    sim.schedule(\n        EventKind.ATTEMPT_FAILED,\n        at=2,\n        event_id="fault:f:duplicate:e",\n    )\n    faults = FaultInjector(sim)\n\n    with pytest.raises(ValueError, match="duplicate simulator event_id"):\n        faults.duplicate_delivery("e", fault_id="f")\n    record = faults.drop_delivery("e", fault_id="f")\n    assert record.id == "f"\n\n    sim2 = DiscreteEventSimulator()\n    sim2.schedule(EventKind.ATTEMPT_COMPLETED, at=1, event_id="e")\n    sim2.schedule(\n        EventKind.ATTEMPT_FAILED,\n        at=2,\n        event_id="fault:fault-00000000:duplicate:e",\n    )\n    faults2 = FaultInjector(sim2)\n    with pytest.raises(ValueError, match="duplicate simulator event_id"):\n        faults2.duplicate_delivery("e")\n    assert faults2.drop_delivery("e").id == "fault-00000000"\n\n\ndef test_rejected_probabilistic_transform_restores_rng_state_and_fault_identity():\n    def setup(with_collision):\n        sim = DiscreteEventSimulator()\n        sim.schedule(EventKind.ATTEMPT_COMPLETED, at=1, event_id="e")\n        if with_collision:\n            sim.schedule(\n                EventKind.ATTEMPT_FAILED,\n                at=2,\n                event_id="fault:fault-00000000:duplicate:e",\n            )\n        return sim, FaultInjector(sim, seed=91)\n\n    failed_sim, failed = setup(True)\n    with pytest.raises(ValueError, match="duplicate simulator event_id"):\n        failed.probabilistic_delivery_fault(\n            "e", {FaultClass.DELIVERY_DUPLICATE: 1.0}, max_delay=3\n        )\n    assert failed.decisions == ()\n    assert failed.records == ()\n\n    clean_sim, clean = setup(False)\n    clean_record = clean.probabilistic_delivery_fault(\n        "e", {FaultClass.DELIVERY_DUPLICATE: 1.0}, max_delay=3\n    )\n    failed_sim.cancel("fault:fault-00000000:duplicate:e")\n    failed_record = failed.probabilistic_delivery_fault(\n        "e", {FaultClass.DELIVERY_DUPLICATE: 1.0}, max_delay=3\n    )\n    assert failed_record is not None and clean_record is not None\n    assert failed.decisions == clean.decisions\n    assert failed_record.id == clean_record.id == "fault-00000000"\n    assert failed_record.duration == clean_record.duration\n\n\ndef test_composed_delay_then_drop_preserves_ground_truth_chain():\n    sim = DiscreteEventSimulator()\n    sim.schedule(EventKind.ATTEMPT_COMPLETED, at=1, event_id="e")\n    faults = FaultInjector(sim)\n    delayed = faults.delay_delivery("e", 2, fault_id="delay")\n    faults.drop_delivery(delayed.produced_event_ids[0], fault_id="drop")\n    sim.run()\n    assert sim.trace == ()\n    faults.assert_ground_truth()\n\n\ndef test_worker_failure_ground_truth_allows_later_recovery():\n    sim = DiscreteEventSimulator()\n    resources = ResourceModel(sim)\n    resources.add_worker("w1")\n    faults = FaultInjector(sim, resources)\n    faults.fail_worker("w1", fault_id="down")\n    resources.recover_worker("w1")\n    sim.run()\n    assert resources.workers["w1"].status is WorkerStatus.UP\n    faults.assert_ground_truth()\n'''
          tests_path.write_text(tests)
          PY
      - name: Validate full repository suite
        run: |
          python -m pip install --upgrade pip pytest
          python -m pytest
      - name: Commit hardening and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c2-4-substrate-hardening.yml
          git add simulator/faults.py tests/simulator/test_faults.py
          git commit -m "Harden C2.4 fault transformation transactions"
          git push origin HEAD:c2/fault-injection-substrate

name: c64a-complete-family-knot-fence-patch

on:
  push:
    branches:
      - c6/c64a-complete-family-knot-fence
    paths:
      - .github/workflows/c64a-complete-family-knot-fence-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c6/c64a-complete-family-knot-fence
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --upgrade pip pytest
      - name: Apply bounded semantic patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('simulator/inference_cost_v2.py')
          text = path.read_text(encoding='utf-8')

          marker = '''def verify_fresh_boundary_against_c63_partition(
              boundary: FreshAdequacyBoundary,
              partition: ReferencePartition,
          ) -> None:
          '''
          helper = '''def _assert_complete_frozen_c63_family(partition: ReferencePartition) -> None:
              """Require the exact complete C6.3 family before using its partition.

              The identity fence is timing-free: it binds hardware, family, exact point
              count, and the canonical ``(point_id, axis_value)`` set only.
              """

              if not isinstance(partition, ReferencePartition):
                  raise TypeError("partition must be ReferencePartition")
              expected_identity = _C64A_FROZEN_C63_FAMILY_IDENTITIES.get(
                  (partition.hardware_id, partition.kind)
              )
              if expected_identity is None:
                  raise ValueError("partition is outside the frozen C6.3 revised-family domain")
              observed_identity = _c63_family_identity(partition)
              if observed_identity != expected_identity:
                  raise ValueError(
                      "partition does not match the complete frozen C6.3 family identity: "
                      f"expected={expected_identity}, observed={observed_identity}"
                  )


          def verify_fresh_boundary_against_c63_partition(
              boundary: FreshAdequacyBoundary,
              partition: ReferencePartition,
          ) -> None:
          '''
          if marker not in text:
              raise SystemExit('verify function marker not found')
          text = text.replace(marker, helper, 1)

          verify_start = text.index('def verify_fresh_boundary_against_c63_partition')
          identity_start = text.index(
              '    expected_identity = _C64A_FROZEN_C63_FAMILY_IDENTITIES.get(',
              verify_start,
          )
          observed_anchor = (
              '    observed_axes = {point.axis_value for point in partition.fit + partition.validation}\n'
          )
          identity_end = text.index(observed_anchor, identity_start)
          text = (
              text[:identity_start]
              + '    _assert_complete_frozen_c63_family(partition)\n\n'
              + text[identity_end:]
          )

          knot_start = text.index('def assert_knots_match_c63_fit')
          expected_anchor = '    expected_fit = {point.point_id for point in partition.fit}\n'
          expected_pos = text.index(expected_anchor, knot_start)
          text = (
              text[:expected_pos]
              + '    _assert_complete_frozen_c63_family(partition)\n'
              + text[expected_pos:]
          )
          path.write_text(text, encoding='utf-8')

          tests = Path('tests/simulator/test_inference_cost_v2.py')
          t = tests.read_text(encoding='utf-8')
          validation_start = t.index(
              'def test_validation_point_ids_cannot_enter_curve_knots() -> None:\n'
          )
          rewritten = '''def test_validation_point_ids_cannot_enter_curve_knots() -> None:
              partition = _partition(ReferenceKind.COLD_PREFILL, _cold_prefill_axes())
              fit_knots = tuple(
                  CurveKnot(
                      hardware_id=point.hardware_id,
                      reference_kind=point.kind,
                      axis_value=point.axis_value,
                      seconds=_scalar(point.observed_seconds, "seconds"),
                      source_point_id=point.point_id,
                  )
                  for point in partition.fit
              )
              curve = PiecewiseLinearCostCurve(
                  curve_id="fit-only",
                  hardware_id="a100-80gb",
                  reference_kind=ReferenceKind.COLD_PREFILL,
                  axis_unit="input-tokens",
                  knots=fit_knots,
              )
              assert_knots_match_c63_fit(curve, partition)

              leaked_knots = list(fit_knots)
              leaked_point = partition.validation[0]
              leaked_knots[0] = CurveKnot(
                  hardware_id=leaked_point.hardware_id,
                  reference_kind=leaked_point.kind,
                  axis_value=leaked_point.axis_value,
                  seconds=_scalar(leaked_point.observed_seconds, "seconds"),
                  source_point_id=leaked_point.point_id,
              )
              leaked = PiecewiseLinearCostCurve(
                  curve_id="leaked",
                  hardware_id="a100-80gb",
                  reference_kind=ReferenceKind.COLD_PREFILL,
                  axis_unit="input-tokens",
                  knots=tuple(sorted(leaked_knots, key=lambda knot: knot.axis_value)),
              )
              with pytest.raises(ValueError, match="VALIDATION points"):
                  assert_knots_match_c63_fit(leaked, partition)


          def test_knot_id_cannot_be_reused_with_corrupted_axis_or_timing() -> None:
              partition = _partition(ReferenceKind.COLD_PREFILL, _cold_prefill_axes())
              fit_knots = [
                  CurveKnot(
                      hardware_id=point.hardware_id,
                      reference_kind=point.kind,
                      axis_value=point.axis_value,
                      seconds=_scalar(point.observed_seconds, "seconds"),
                      source_point_id=point.point_id,
                  )
                  for point in partition.fit
              ]
              first = partition.fit[0]

              wrong_axis_knots = list(fit_knots)
              wrong_axis_knots[0] = _knot(
                  first.axis_value + 1,
                  first.observed_seconds,
                  first.point_id,
                  kind=ReferenceKind.COLD_PREFILL,
              )
              wrong_axis = PiecewiseLinearCostCurve(
                  curve_id="wrong-axis",
                  hardware_id="a100-80gb",
                  reference_kind=ReferenceKind.COLD_PREFILL,
                  axis_unit="input-tokens",
                  knots=tuple(wrong_axis_knots),
              )
              with pytest.raises(ValueError, match="axis does not match"):
                  assert_knots_match_c63_fit(wrong_axis, partition)

              wrong_timing_knots = list(fit_knots)
              wrong_timing_knots[0] = _knot(
                  first.axis_value,
                  first.observed_seconds + 1.0,
                  first.point_id,
                  kind=ReferenceKind.COLD_PREFILL,
              )
              wrong_timing = PiecewiseLinearCostCurve(
                  curve_id="wrong-timing",
                  hardware_id="a100-80gb",
                  reference_kind=ReferenceKind.COLD_PREFILL,
                  axis_unit="input-tokens",
                  knots=tuple(wrong_timing_knots),
              )
              with pytest.raises(ValueError, match="timing does not match"):
                  assert_knots_match_c63_fit(wrong_timing, partition)


          def test_knot_admission_rejects_incomplete_canonically_split_family() -> None:
              incomplete = _partition(
                  ReferenceKind.COLD_PREFILL,
                  _cold_prefill_axes()[:-2],
              )
              knots = tuple(
                  CurveKnot(
                      hardware_id=point.hardware_id,
                      reference_kind=point.kind,
                      axis_value=point.axis_value,
                      seconds=_scalar(point.observed_seconds, "seconds"),
                      source_point_id=point.point_id,
                  )
                  for point in incomplete.fit
              )
              curve = PiecewiseLinearCostCurve(
                  curve_id="incomplete-fit-only",
                  hardware_id="a100-80gb",
                  reference_kind=ReferenceKind.COLD_PREFILL,
                  axis_unit="input-tokens",
                  knots=knots,
              )
              with pytest.raises(ValueError, match="complete frozen C6.3 family identity"):
                  assert_knots_match_c63_fit(curve, incomplete)
          '''
          t = t[:validation_start] + rewritten + '\n'
          tests.write_text(t, encoding='utf-8')
          PY
      - name: Run focused C6.4a tests
        run: python -m pytest tests/simulator/test_inference_cost_v2.py
      - name: Commit bounded correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add simulator/inference_cost_v2.py tests/simulator/test_inference_cost_v2.py
          git commit -m "C6.4a: require complete family before knot admission"
          git push origin HEAD:c6/c64a-complete-family-knot-fence

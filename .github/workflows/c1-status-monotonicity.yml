name: c1-status-monotonicity

on:
  push:
    branches: [c1/deterministic-core]
    paths: [.github/workflows/c1-status-monotonicity.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c1/deterministic-core
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply monotonic status guards
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match in {path}; got {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'continuity/core.py',
              '''    def set_attempt_execution(self, attempt_id: str, status: ExecutionStatus) -> Attempt:\n        a = self.attempts[attempt_id]\n        terminal = {ExecutionStatus.SUCCEEDED, ExecutionStatus.FAILED, ExecutionStatus.CANCELLED}\n        if a.execution_status in terminal and status != a.execution_status:\n            raise InvalidTransition("terminal execution outcome is immutable")\n        a = replace(a, execution_status=status); self.attempts[attempt_id] = a; return a\n''',
              '''    def set_attempt_execution(self, attempt_id: str, status: ExecutionStatus) -> Attempt:\n        a = self.attempts[attempt_id]\n        terminal = {ExecutionStatus.SUCCEEDED, ExecutionStatus.FAILED, ExecutionStatus.CANCELLED}\n        if a.execution_status in terminal and status != a.execution_status:\n            raise InvalidTransition("terminal execution outcome is immutable")\n        nonterminal_rank = {\n            ExecutionStatus.CREATED: 0,\n            ExecutionStatus.DISPATCHED: 1,\n            ExecutionStatus.RUNNING: 2,\n        }\n        if a.execution_status in nonterminal_rank and status in nonterminal_rank:\n            if nonterminal_rank[status] < nonterminal_rank[a.execution_status]:\n                raise InvalidTransition("Attempt execution status cannot move backward")\n        a = replace(a, execution_status=status); self.attempts[attempt_id] = a; return a\n'''
          )
          replace_once(
              'continuity/core.py',
              '''    def set_phase_status(self, phase_id: str, status: PhaseStatus) -> Phase:\n        p = self.phases[phase_id]\n        terminal = {PhaseStatus.COMPLETED, PhaseStatus.FAILED, PhaseStatus.CANCELLED}\n        if p.status in terminal and status != p.status:\n            raise InvalidTransition("terminal Phase is immutable")\n        p = replace(p, status=status)\n        self.phases[phase_id] = p\n        return p\n''',
              '''    def set_phase_status(self, phase_id: str, status: PhaseStatus) -> Phase:\n        p = self.phases[phase_id]\n        terminal = {PhaseStatus.COMPLETED, PhaseStatus.FAILED, PhaseStatus.CANCELLED}\n        if p.status in terminal and status != p.status:\n            raise InvalidTransition("terminal Phase is immutable")\n        nonterminal_rank = {PhaseStatus.CREATED: 0, PhaseStatus.RUNNING: 1}\n        if p.status in nonterminal_rank and status in nonterminal_rank:\n            if nonterminal_rank[status] < nonterminal_rank[p.status]:\n                raise InvalidTransition("Phase status cannot move backward")\n        p = replace(p, status=status)\n        self.phases[phase_id] = p\n        return p\n'''
          )

          p = Path('tests/invariants/test_catalogue_obligations.py')
          p.write_text(p.read_text() + '''\n\ndef test_attempt_execution_status_cannot_move_backward(core):\n    from continuity.entities import ExecutionStatus\n    core.create_program('p'); core.create_session('s', 'p'); core.create_continuation('c', 's')\n    core.create_request('r', 'c'); core.start_attempt('a', 'r')\n    core.set_attempt_execution('a', ExecutionStatus.DISPATCHED)\n    core.set_attempt_execution('a', ExecutionStatus.RUNNING)\n    with pytest.raises(InvalidTransition):\n        core.set_attempt_execution('a', ExecutionStatus.DISPATCHED)\n    with pytest.raises(InvalidTransition):\n        core.set_attempt_execution('a', ExecutionStatus.CREATED)\n\n\ndef test_phase_status_cannot_move_backward(core):\n    from continuity.entities import PhaseStatus, PhaseType\n    core.create_program('p'); core.create_session('s', 'p'); core.create_continuation('c', 's')\n    core.create_request('r', 'c'); core.start_attempt('a', 'r')\n    core.create_phase('phase', 'a', PhaseType.PREFILL)\n    core.set_phase_status('phase', PhaseStatus.RUNNING)\n    with pytest.raises(InvalidTransition):\n        core.set_phase_status('phase', PhaseStatus.CREATED)\n''')
          PY
      - name: Run deterministic C1 tests
        run: |
          python -m pip install --upgrade pip pytest
          python -m pytest -q
      - name: Commit monotonicity guards and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add continuity/core.py tests/invariants/test_catalogue_obligations.py
          git rm .github/workflows/c1-status-monotonicity.yml
          git commit -m 'Enforce monotonic Attempt and Phase status transitions'
          git push origin HEAD:c1/deterministic-core

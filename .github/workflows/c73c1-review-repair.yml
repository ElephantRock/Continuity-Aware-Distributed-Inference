name: c73c1-review-repair

on:
  push:
    branches:
      - c7/retention-eval-protocol
    paths:
      - .github/workflows/c73c1-review-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: c7/retention-eval-protocol
          fetch-depth: 0
      - name: Apply fifth bounded review repair
        run: python tools/c73c1_review_repair.py
      - name: Commit protocol repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/c73c_protocol.py tests/experiments/test_c73c_protocol.py
          git commit -m "C7.3c1: close hardware and manifest review degrees"
          git push origin HEAD:c7/retention-eval-protocol

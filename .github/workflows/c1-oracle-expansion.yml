name: c1-oracle-expansion

on:
  push:
    branches: [c1/deterministic-core]
    paths: [.github/workflows/c1-oracle-expansion.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c1/deterministic-core
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Expand oracle and add catalogue obligations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match in {path}; got {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'continuity/invariants.py',
              '    def assert_all(self) -> None:\n        self._attempt_authority()\n        self._request_commit_consistency()\n        self._continuation_dags()\n        self._phase_ordering()\n        self._state_provenance()\n        self._binding_authority()\n        self._evidence_derivation()\n        self._event_identity()\n        self._state_validity()\n',
              '''    def assert_all(self) -> None:\n        self._parent_scopes()\n        self._attempt_authority()\n        self._attempt_generations()\n        self._request_commit_consistency()\n        self._continuation_dags()\n        self._phase_ordering()\n        self._state_provenance()\n        self._replica_integrity()\n        self._binding_authority()\n        self._binding_generations()\n        self._evidence_derivation()\n        self._event_identity()\n        self._output_integrity()\n        self._state_validity()\n\n    def _parent_scopes(self):\n        for session in self.c.sessions.values():\n            assert session.program_id in self.c.programs\n        for continuation in self.c.continuations.values():\n            assert continuation.session_id in self.c.sessions\n            for parent_id in continuation.parent_ids:\n                parent = self.c.continuations[parent_id]\n                assert parent.session_id == continuation.session_id\n        for request in self.c.requests.values():\n            assert request.continuation_id in self.c.continuations\n        for attempt in self.c.attempts.values():\n            assert attempt.request_id in self.c.requests\n        for phase in self.c.phases.values():\n            assert phase.attempt_id in self.c.attempts\n'''
          )
          replace_once(
              'continuity/invariants.py',
              '    def _request_commit_consistency(self):\n',
              '''    def _attempt_generations(self):\n        for request_id in self.c.requests:\n            attempts = [a for a in self.c.attempts.values() if a.request_id == request_id]\n            generations = sorted(a.generation for a in attempts)\n            assert generations == list(range(1, len(attempts) + 1))\n\n    def _request_commit_consistency(self):\n'''
          )
          replace_once(
              'continuity/invariants.py',
              '    def _binding_authority(self):\n',
              '''    def _replica_integrity(self):\n        for replica in self.c.replicas.values():\n            assert replica.state_id in self.c.states\n            if replica.binding_id is not None:\n                binding = self.c.bindings[replica.binding_id]\n                assert replica.binding_epoch == binding.epoch\n\n    def _binding_authority(self):\n'''
          )
          replace_once(
              'continuity/invariants.py',
              '    def _evidence_derivation(self):\n',
              '''    def _binding_generations(self):\n        by_subject = {}\n        for binding in self.c.bindings.values():\n            by_subject.setdefault(binding.subject_id, []).append(binding)\n            assert binding.epoch > binding.base_epoch\n        for subject, bindings in by_subject.items():\n            epochs = [b.epoch for b in bindings]\n            assert len(epochs) == len(set(epochs))\n            assert self.c.last_allocated_epoch_by_subject[subject] == max(epochs)\n            current_epoch = self.c.current_epoch_by_subject.get(subject)\n            if current_epoch is not None:\n                assert current_epoch in epochs\n\n    def _evidence_derivation(self):\n'''
          )
          replace_once(
              'continuity/invariants.py',
              '    def _state_validity(self):\n',
              '''    def _output_integrity(self):\n        for output in self.c.outputs.values():\n            assert output.attempt_id in self.c.attempts\n            for evidence_id in output.evidence_ids:\n                assert evidence_id in self.c.evidence\n\n    def _state_validity(self):\n'''
          )

          Path('tests/invariants/test_catalogue_obligations.py').write_text('''from dataclasses import replace\nimport pytest\n\nfrom continuity.entities import (\n    AttemptAuthority, ContinuationLifecycle, StateValidity, ReusableState,\n)\nfrom continuity.errors import InvalidTransition, SemanticViolation\nfrom continuity.invariants import InvariantOracle\n\n\ndef test_a1_entity_identity_uniqueness_is_enforced_globally(core):\n    core.create_program('same')\n    with pytest.raises(SemanticViolation):\n        core.create_session('same', 'same')\n\n\ndef test_a2_parent_scope_consistency_rejects_cross_session_continuation_parent(core):\n    core.create_program('p'); core.create_session('s1', 'p'); core.create_session('s2', 'p')\n    core.create_continuation('c1', 's1')\n    with pytest.raises(SemanticViolation):\n        core.create_continuation('c2', 's2', ['c1'])\n\n\ndef test_a3_oracle_detects_continuation_cycle_corruption(core):\n    core.create_program('p'); core.create_session('s', 'p')\n    core.create_continuation('c0', 's'); core.create_continuation('c1', 's', ['c0'])\n    core.continuations['c0'] = replace(core.continuations['c0'], parent_ids=frozenset({'c1'}))\n    with pytest.raises(AssertionError):\n        InvariantOracle(core).assert_all()\n\n\ndef test_a4_state_provenance_resolves_exactly_one_continuation(core):\n    core.create_program('p'); core.create_session('s', 'p'); core.create_continuation('c', 's')\n    state = core.create_state('x', origin_type='continuation', origin_id='c')\n    assert state.origin_continuation_id == 'c'\n    InvariantOracle(core).assert_all()\n\n\ndef test_b2_oracle_detects_cross_request_attempt_authority_corruption(core):\n    core.create_program('p'); core.create_session('s', 'p'); core.create_continuation('c', 's')\n    core.create_request('r1', 'c'); core.create_request('r2', 'c'); core.start_attempt('a1', 'r1')\n    core.requests['r2'] = replace(core.requests['r2'], current_attempt_id='a1')\n    with pytest.raises(AssertionError):\n        InvariantOracle(core).assert_all()\n\n\ndef test_b3_attempt_generations_are_monotonic_and_oracle_checked(core):\n    core.create_program('p'); core.create_session('s', 'p'); core.create_continuation('c', 's'); core.create_request('r', 'c')\n    assert core.start_attempt('a1', 'r').generation == 1\n    assert core.start_attempt('a2', 'r').generation == 2\n    assert core.start_attempt('a3', 'r').generation == 3\n    InvariantOracle(core).assert_all()\n    core.attempts['a3'] = replace(core.attempts['a3'], generation=7)\n    with pytest.raises(AssertionError):\n        InvariantOracle(core).assert_all()\n\n\ndef test_c5_multiple_replicas_preserve_one_logical_state_identity(core):\n    core.create_program('p'); core.create_session('s', 'p'); core.create_continuation('c', 's')\n    core.create_state('x', origin_type='continuation', origin_id='c')\n    core.add_replica('r1', 'x', 'w1'); core.add_replica('r2', 'x', 'w2')\n    assert {core.replicas['r1'].state_id, core.replicas['r2'].state_id} == {'x'}\n    assert set(core.states) == {'x'}\n    InvariantOracle(core).assert_all()\n\n\ndef test_c7_oracle_detects_state_derivation_cycle_corruption(core):\n    core.create_program('p'); core.create_session('s', 'p'); core.create_continuation('c', 's')\n    core.create_state('x1', origin_type='continuation', origin_id='c')\n    core.create_state('x2', origin_type='continuation', origin_id='c', derived_from=['x1'])\n    core.states['x1'] = replace(core.states['x1'], derived_from=frozenset({'x2'}))\n    with pytest.raises(AssertionError):\n        InvariantOracle(core).assert_all()\n\n\ndef test_f4_terminal_continuation_cannot_reactivate(core):\n    core.create_program('p'); core.create_session('s', 'p'); core.create_continuation('c', 's')\n    core.set_continuation_lifecycle('c', ContinuationLifecycle.TERMINAL)\n    with pytest.raises(InvalidTransition):\n        core.set_continuation_lifecycle('c', ContinuationLifecycle.ACTIVE)\n\n\ndef test_f6_invalid_state_cannot_be_resurrected(core):\n    core.create_program('p'); core.create_session('s', 'p'); core.create_continuation('c', 's')\n    core.create_state('x', origin_type='continuation', origin_id='c')\n    core.set_state_validity('x', StateValidity.INVALID)\n    with pytest.raises(InvalidTransition):\n        core.set_state_validity('x', StateValidity.VALID)\n\n\ndef test_oracle_detects_broken_replica_parent(core):\n    core.create_program('p'); core.create_session('s', 'p'); core.create_continuation('c', 's')\n    core.create_state('x', origin_type='continuation', origin_id='c'); core.add_replica('rp', 'x', 'w')\n    core.replicas['rp'] = replace(core.replicas['rp'], state_id='missing')\n    with pytest.raises(AssertionError):\n        InvariantOracle(core).assert_all()\n''')
          PY
      - name: Run deterministic C1 tests
        run: |
          python -m pip install --upgrade pip pytest
          python -m pytest -q
      - name: Commit oracle expansion and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add continuity/invariants.py tests/invariants/test_catalogue_obligations.py
          git rm .github/workflows/c1-oracle-expansion.yml
          git commit -m 'Expand independent invariant oracle coverage'
          git push origin HEAD:c1/deterministic-core

name: c64b-openblas-core-diagnostic

on:
  push:
    branches:
      - c6/replacement-calibration-fresh-adequacy
    paths:
      - .github/workflows/c64b-openblas-core-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-24.04
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      OPENBLAS_CORETYPE: 'Haswell'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: c6/replacement-calibration-fresh-adequacy
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install frozen evaluator runtime
        run: >-
          python -m pip install
          numpy==1.26.4
          pandas==2.2.3
          scikit-learn==1.5.2
          scipy==1.14.1
          joblib==1.4.2
          threadpoolctl==3.5.0
          fasteners==0.19
      - name: Record forced numerical substrate
        shell: bash
        run: |
          set -euo pipefail
          echo "diagnostic_shard=${{ matrix.shard }}"
          echo "runner_os=${RUNNER_OS:-}"
          echo "runner_arch=${RUNNER_ARCH:-}"
          echo "image_os=${ImageOS:-}"
          echo "image_version=${ImageVersion:-}"
          echo "openblas_coretype=${OPENBLAS_CORETYPE}"
          lscpu | grep -E '^(Architecture|Vendor ID|Model name|CPU family|Model:|Stepping|Flags):' || true
          python - <<'PY'
          import json
          import platform
          from importlib.metadata import version
          import numpy as np
          from threadpoolctl import threadpool_info

          np.dot(np.ones((2, 2)), np.ones((2, 2)))
          print('python=', platform.python_version())
          print('packages=', json.dumps({
              name: version(name)
              for name in (
                  'numpy', 'pandas', 'scikit-learn', 'scipy',
                  'joblib', 'threadpoolctl', 'fasteners'
              )
          }, sort_keys=True))
          info = threadpool_info()
          print('threadpool_info=', json.dumps(info, sort_keys=True, default=str))
          openblas = [item for item in info if item.get('internal_api') == 'openblas']
          if len(openblas) != 1:
              raise SystemExit(f'expected exactly one OpenBLAS runtime, got {openblas!r}')
          observed = {
              'version': str(openblas[0].get('version')),
              'coretype': str(openblas[0].get('architecture')),
              'threading_layer': str(openblas[0].get('threading_layer')),
              'num_threads': int(openblas[0].get('num_threads', -1)),
          }
          expected = {
              'version': '0.3.23.dev',
              'coretype': 'Haswell',
              'threading_layer': 'pthreads',
              'num_threads': 1,
          }
          if observed != expected:
              raise SystemExit(f'OpenBLAS substrate drift: expected={expected}, observed={observed}')
          PY
      - name: Checkout pinned Vidur source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/microsoft/vidur.git .c64b_vidur
          git -C .c64b_vidur checkout --detach abae7f63aa857300f5cdc6f5e0d27860cd24721b
          test "$(git -C .c64b_vidur rev-parse HEAD)" = "abae7f63aa857300f5cdc6f5e0d27860cd24721b"
      - name: Verify canonical protocol-v2 scientific output
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/.c64b_vidur
        run: |
          set -euo pipefail
          python experiments/c64b_fresh_adequacy.py \
            --vidur-root .c64b_vidur \
            --output /tmp/c64b-v2-cross-host.json > /tmp/c64b-v2-cross-host.log
          python - <<'PY'
          import json
          from pathlib import Path

          expected = {
              'protocol_id': 'cadi.c6.4b.vidur-linear-regression-source-model.v2',
              'protocol_fingerprint': '9decab129b64921d59696c58242f0047ad986c76b82a22819eb93166b5d3a717',
              'scientific_fingerprint': '6efc18490f1df94353c5a42143ba388d49f35947da334563d2b98fc05421af90',
              'decision': 'INADEQUATE_REVISE_REPRESENTATION',
          }
          result = json.loads(Path('/tmp/c64b-v2-cross-host.json').read_text())
          observed = {key: result[key] for key in expected}
          print('expected=', json.dumps(expected, sort_keys=True))
          print('observed=', json.dumps(observed, sort_keys=True))
          if observed != expected:
              raise SystemExit(
                  f'C6.4b protocol-v2 cross-host reproduction failed: expected={expected}, observed={observed}'
              )
          for hw in result['hardware']:
              print('hardware=', hw['hardware_id'])
              print('prefill_refs=', [p['reference_seconds'] for p in hw['fresh_prefill']['points']])
              print('transfer_refs=', [p['reference_seconds'] for p in hw['fresh_transfer']['points']])
          PY

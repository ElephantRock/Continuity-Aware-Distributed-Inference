name: c1-event-model-bootstrap

on:
  push:
    branches: [c1/deterministic-core]
    paths: [.github/workflows/c1-event-model-bootstrap.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c1/deterministic-core
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply event identity/idempotence patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one match in {path}: {old!r}; got {text.count(old)}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'continuity/entities.py',
              'class ReconcileOutcome(Enum):\n    MATCHED = auto(); WAIT = auto(); RETRY = auto(); RECOMPUTE = auto(); MIGRATE = auto(); REJECT = auto(); REPAIR = auto(); FAIL = auto(); AMBIGUOUS = auto()\n\n@dataclass(frozen=True)\nclass Program:',
              'class ReconcileOutcome(Enum):\n    MATCHED = auto(); WAIT = auto(); RETRY = auto(); RECOMPUTE = auto(); MIGRATE = auto(); REJECT = auto(); REPAIR = auto(); FAIL = auto(); AMBIGUOUS = auto()\n\n@dataclass(frozen=True)\nclass SemanticEvent:\n    id: str\n    kind: str\n    subject_type: str\n    subject_id: str\n    payload: FrozenSet[tuple[str, str]] = frozenset()\n\n@dataclass(frozen=True)\nclass Program:'
          )

          replace_once(
              'continuity/core.py',
              '    RequestStatus, ReusableState, Session, StateLifecycle, StateReplica, StateValidity,\n)',
              '    RequestStatus, ReusableState, SemanticEvent, Session, StateLifecycle, StateReplica, StateValidity,\n)'
          )
          replace_once(
              'continuity/core.py',
              '        self.outputs: dict[str, Output] = {}\n        self.current_binding_by_subject: dict[str, str] = {}',
              '        self.outputs: dict[str, Output] = {}\n        self.events: dict[str, SemanticEvent] = {}\n        self.event_order: list[str] = []\n        self.current_binding_by_subject: dict[str, str] = {}'
          )
          replace_once(
              'continuity/core.py',
              '                       self.evidence, self.outputs)\n',
              '                       self.evidence, self.outputs, self.events)\n'
          )
          replace_once(
              'continuity/core.py',
              '    # ---------- evidence / reconcile ----------\n    def record_evidence(self, e: Evidence) -> Evidence:\n        self._unique(e.id); self.evidence[e.id] = e; return e\n',
              '    # ---------- events ----------\n    def record_event(self, event: SemanticEvent) -> SemanticEvent:\n        existing = self.events.get(event.id)\n        if existing is not None:\n            if existing == event:\n                return existing\n            raise SemanticViolation("conflicting duplicate semantic event identity")\n        self._unique(event.id)\n        self.events[event.id] = event\n        self.event_order.append(event.id)\n        return event\n\n    # ---------- evidence / reconcile ----------\n    def record_evidence(self, e: Evidence) -> Evidence:\n        existing = self.evidence.get(e.id)\n        if existing is not None:\n            if existing == e:\n                return existing\n            raise SemanticViolation("conflicting duplicate Evidence identity")\n        self._unique(e.id); self.evidence[e.id] = e; return e\n'
          )

          replace_once(
              'continuity/invariants.py',
              '        self._binding_authority()\n        self._state_validity()\n',
              '        self._binding_authority()\n        self._event_identity()\n        self._state_validity()\n'
          )
          replace_once(
              'continuity/invariants.py',
              '    def _state_validity(self):\n',
              '    def _event_identity(self):\n        assert len(self.c.event_order) == len(set(self.c.event_order))\n        assert set(self.c.event_order) == set(self.c.events)\n        for event_id in self.c.event_order:\n            assert self.c.events[event_id].id == event_id\n\n    def _state_validity(self):\n'
          )

          Path('tests/invariants/test_events.py').write_text('''import pytest\n\nfrom continuity.entities import Evidence, EvidenceAuthority, EvidenceStatus, SemanticEvent\nfrom continuity.errors import SemanticViolation\nfrom continuity.invariants import InvariantOracle\n\n\ndef test_duplicate_semantic_event_delivery_is_idempotent(core):\n    event = SemanticEvent('ev1', 'ATTEMPT_COMPLETED', 'attempt', 'a1', frozenset({('result', 'ok')}))\n    first = core.record_event(event)\n    second = core.record_event(event)\n    assert first == second == event\n    assert core.event_order == ['ev1']\n    assert len(core.events) == 1\n    InvariantOracle(core).assert_all()\n\n\ndef test_conflicting_duplicate_semantic_event_is_rejected(core):\n    core.record_event(SemanticEvent('ev1', 'STATE_EVICTED', 'state', 'x'))\n    with pytest.raises(SemanticViolation):\n        core.record_event(SemanticEvent('ev1', 'STATE_MATERIALIZED', 'state', 'x'))\n\n\ndef test_event_log_preserves_first_delivery_order(core):\n    core.record_event(SemanticEvent('ev2', 'SECOND', 'system', 'runtime'))\n    core.record_event(SemanticEvent('ev1', 'FIRST', 'system', 'runtime'))\n    core.record_event(SemanticEvent('ev2', 'SECOND', 'system', 'runtime'))\n    assert core.event_order == ['ev2', 'ev1']\n\n\ndef test_event_identity_cannot_collide_with_logical_entity(core):\n    core.create_program('shared-id')\n    with pytest.raises(SemanticViolation):\n        core.record_event(SemanticEvent('shared-id', 'PROGRAM_CREATED', 'program', 'shared-id'))\n\n\ndef test_duplicate_evidence_delivery_is_idempotent(core):\n    evidence = Evidence(\n        'e1', 'replica present', 'observer', EvidenceAuthority.EXACT_OBSERVATION,\n        EvidenceStatus.VALID, 1.0, frozenset({('state', 'x'), ('replica', 'r')})\n    )\n    first = core.record_evidence(evidence)\n    second = core.record_evidence(evidence)\n    assert first == second == evidence\n    assert len(core.evidence) == 1\n\n\ndef test_conflicting_duplicate_evidence_is_rejected(core):\n    first = Evidence('e1', 'owner w1', 'observer', EvidenceAuthority.EXACT_OBSERVATION, EvidenceStatus.VALID, 1.0)\n    second = Evidence('e1', 'owner w2', 'observer', EvidenceAuthority.EXACT_OBSERVATION, EvidenceStatus.VALID, 1.0)\n    core.record_evidence(first)\n    with pytest.raises(SemanticViolation):\n        core.record_evidence(second)\n''')
          PY
      - name: Run deterministic C1 tests
        run: |
          python -m pip install --upgrade pip pytest
          python -m pytest -q
      - name: Commit C1 event model and remove bootstrap workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add continuity/entities.py continuity/core.py continuity/invariants.py tests/invariants/test_events.py
          git rm .github/workflows/c1-event-model-bootstrap.yml
          git commit -m 'Add explicit semantic event identity and idempotence'
          git push origin HEAD:c1/deterministic-core

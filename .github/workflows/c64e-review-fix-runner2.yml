name: c64e-review-fix-runner2

on:
  push:
    branches: [c6/source-kernel-v4-exhaustive-protocol]
    paths:
      - .github/workflows/c64e-review-fix-runner2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      OPENBLAS_CORETYPE: Haswell
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.12.14
          check-latest: false
      - name: Apply review hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/c64e-review-fix.yml').read_text()
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          script = textwrap.dedent(workflow[start:end])
          broken = "if old not in t:\\n              raise SystemExit('numerical model test block not found')"
          fixed = "if old not in t:\n    raise SystemExit('numerical model test block not found')"
          if broken not in script:
              raise SystemExit('expected review patch syntax defect not found')
          exec(compile(script.replace(broken, fixed, 1), '<c64e-review-fix>', 'exec'))

          # Keep the synthetic structural fixture distinct from sklearn's oracle class.
          tpath = Path('tests/simulator/test_inference_cost_v4.py')
          t = tpath.read_text()
          target = '''    from sklearn.preprocessing import PolynomialFeatures\n\n    values = (257.0, 66049.0)\n    poly = PolynomialFeatures(degree=3, include_bias=True, interaction_only=False)\n'''
          replacement = '''    from sklearn.preprocessing import PolynomialFeatures as SkPolynomialFeatures\n\n    values = (257.0, 66049.0)\n    poly = SkPolynomialFeatures(degree=3, include_bias=True, interaction_only=False)\n'''
          if target not in t:
              raise SystemExit('expected sklearn oracle block not found')
          tpath.write_text(t.replace(target, replacement, 1))

          # sklearn/scipy may load a second BLAS library in the same process; fence the
          # NumPy-linked OpenBLAS that actually executes ndarray matmul.
          path = Path('simulator/inference_cost_v4.py')
          s = path.read_text()
          old = '''    blas = [x for x in threadpool_info() if x.get("internal_api") == "openblas"]\n    if len(blas) != 1:\n        raise RuntimeError(f"expected exactly one OpenBLAS runtime, observed={blas}")\n'''
          new = '''    blas = [\n        x for x in threadpool_info()\n        if x.get("internal_api") == "openblas"\n        and "/numpy.libs/" in str(x.get("filepath", ""))\n    ]\n    if len(blas) != 1:\n        raise RuntimeError(\n            f"expected exactly one NumPy OpenBLAS runtime, observed={blas}"\n        )\n'''
          if old not in s:
              raise SystemExit('expected OpenBLAS fence block not found')
          path.write_text(s.replace(old, new, 1))
          PY
      - name: Install exact test runtime
        run: python -m pip install pytest==8.3.5 numpy==1.26.4 pandas==2.2.3 scikit-learn==1.5.2 scipy==1.14.1 joblib==1.4.2 threadpoolctl==3.5.0 fasteners==0.19
      - name: Run focused contract tests
        run: python -m pytest -q -rs tests/simulator/test_inference_cost_v4.py
      - name: Commit review fixes
        shell: bash
        run: |
          git config user.name "Alajmah"
          git config user.email "55954113+Alajmah@users.noreply.github.com"
          git add simulator/inference_cost_v4.py tests/simulator/test_inference_cost_v4.py spec/46-c6.4e-source-kernel-v4-exhaustive-protocol.md
          git diff --cached --check
          git commit -m "C6.4e: preserve source materialization kernel"
          git push origin HEAD:c6/source-kernel-v4-exhaustive-protocol

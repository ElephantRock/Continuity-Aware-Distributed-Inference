name: c74c-migration-efficiency-results

on:
  push:
    branches:
      - c7/migration-efficiency-results
      - main
    paths:
      - .github/workflows/c74c-migration-efficiency-results.yml
      - experiments/c74_migration_results.py
      - experiments/c74_migration_engine.py
      - experiments/c74_migration_protocol.py
      - experiments/c7_protocol.py
      - simulator/**
      - continuity/**
      - artifacts/c6.4f/exhaustive-source-equivalence.json
      - tests/experiments/test_c74_migration_results.py
      - tests/experiments/test_c74c_result_freeze.py
      - artifacts/c7.4c/migration-efficiency-result-manifest.json
      - spec/58-c7.4c-migration-efficiency-result.md
      - pyproject.toml
  pull_request:
    paths:
      - .github/workflows/c74c-migration-efficiency-results.yml
      - experiments/c74_migration_results.py
      - experiments/c74_migration_engine.py
      - experiments/c74_migration_protocol.py
      - experiments/c7_protocol.py
      - simulator/**
      - continuity/**
      - artifacts/c6.4f/exhaustive-source-equivalence.json
      - tests/experiments/test_c74_migration_results.py
      - tests/experiments/test_c74c_result_freeze.py
      - artifacts/c7.4c/migration-efficiency-result-manifest.json
      - spec/58-c7.4c-migration-efficiency-result.md
      - pyproject.toml
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'
  REVIEWED_C74B_MERGE: '9227e36883af785aef1dc7d253404cee0e8675d1'
  FROZEN_GENERATION_SHA: '4e9d9ad5fd119a266dfb9282274cd414354d0d72'
  FROZEN_GENERATION_PR_REF: 'refs/pull/161/head'
  EXPECTED_SCIENTIFIC_FINGERPRINT: 'a8d435456b1d784592eda96e3352190456fb9aeb34dda6c12c5a0edb58b54944'
  EXPECTED_ARTIFACT_SHA256: '3550516d9d2355849f5d6a731d7577f906856ec94a60d8947ad81e8382e25e18'
  EXPECTED_MANIFEST_SHA256: '84c7f62ecf9f799cc87f1750cfd58507d760d69afba6321f97471540410ebee7'

jobs:
  frozen-result:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify immutable checkout
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Materialize frozen generation ancestry
        run: |
          git fetch --no-tags origin \
            "+${FROZEN_GENERATION_PR_REF}:refs/remotes/origin/c74c-frozen-generation"
          git cat-file -e "${FROZEN_GENERATION_SHA}^{commit}"
          git merge-base --is-ancestor \
            "$FROZEN_GENERATION_SHA" \
            refs/remotes/origin/c74c-frozen-generation
      - name: Verify generation used the reviewed C7.4b mechanics tree
        run: |
          git diff --exit-code "$REVIEWED_C74B_MERGE" "$FROZEN_GENERATION_SHA" -- \
            experiments/c74_migration_engine.py \
            experiments/c74_migration_protocol.py \
            experiments/c7_protocol.py \
            simulator \
            continuity \
            artifacts/c6.4f/exhaustive-source-equivalence.json
      - name: Verify frozen scientific code is unchanged since result generation
        run: |
          git diff --exit-code "$FROZEN_GENERATION_SHA" HEAD -- \
            experiments/c74_migration_results.py \
            experiments/c74_migration_engine.py \
            experiments/c74_migration_protocol.py \
            experiments/c7_protocol.py \
            simulator \
            continuity \
            artifacts/c6.4f/exhaustive-source-equivalence.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: Install test runner only
        run: python -m pip install 'pytest==8.4.2'
      - name: Run C7.4c result and freeze tests
        run: |
          python -m pytest -q \
            tests/experiments/test_c74_migration_results.py \
            tests/experiments/test_c74c_result_freeze.py
      - name: Replay frozen result twice
        run: |
          python -m experiments.c74_migration_results \
            --execution-git-commit "$FROZEN_GENERATION_SHA" \
            --output /tmp/c74c-1.json
          python -m experiments.c74_migration_results \
            --execution-git-commit "$FROZEN_GENERATION_SHA" \
            --output /tmp/c74c-2.json
          cmp /tmp/c74c-1.json /tmp/c74c-2.json
      - name: Verify literal result identity and committed manifest
        run: |
          test "$(sha256sum /tmp/c74c-1.json | awk '{print $1}')" = "$EXPECTED_ARTIFACT_SHA256"
          test "$(sha256sum artifacts/c7.4c/migration-efficiency-result-manifest.json | awk '{print $1}')" = "$EXPECTED_MANIFEST_SHA256"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path('/tmp/c74c-1.json').read_text())
          manifest = json.loads(Path('artifacts/c7.4c/migration-efficiency-result-manifest.json').read_text())
          assert payload['execution_git_commit'] == os.environ['FROZEN_GENERATION_SHA']
          assert payload['scientific_fingerprint'] == os.environ['EXPECTED_SCIENTIFIC_FINGERPRINT']
          assert payload['h6_efficiency']['h6_efficiency_classification'] == 'EFFICIENCY_STRENGTHENED_WITHIN_DECLARED_PHASE_SPACE'
          assert payload['h6_efficiency']['support_region_count'] == 6
          assert payload['row_counts'] == {
              'track_a': 40,
              'track_b': 1200,
              'track_b_rankable': 1000,
              'track_b_partial_unranked': 200,
          }
          assert sum(item['semantic_violation_row_count'] for item in payload['track_b_summary']) == 0
          artifact = manifest['canonical_artifact']
          assert artifact['generation_git_commit'] == os.environ['FROZEN_GENERATION_SHA']
          assert artifact['scientific_fingerprint'] == os.environ['EXPECTED_SCIENTIFIC_FINGERPRINT']
          assert artifact['artifact_json_sha256'] == os.environ['EXPECTED_ARTIFACT_SHA256']
          assert manifest['h6_efficiency'] == payload['h6_efficiency']
          assert manifest['track_a_summary'] == payload['track_a_summary']
          assert manifest['track_b_summary'] == payload['track_b_summary']
          print('reviewed_c74b_merge=' + os.environ['REVIEWED_C74B_MERGE'])
          print('frozen_generation_sha=' + os.environ['FROZEN_GENERATION_SHA'])
          print('scientific_fingerprint=' + payload['scientific_fingerprint'])
          print('artifact_sha256=' + os.environ['EXPECTED_ARTIFACT_SHA256'])
          print('h6_efficiency=' + payload['h6_efficiency']['h6_efficiency_classification'])
          print('support_region_count=' + str(payload['h6_efficiency']['support_region_count']))
          PY
      - name: Stage canonical replay artifact
        run: |
          mkdir -p /tmp/c74c-artifact
          cp /tmp/c74c-1.json /tmp/c74c-artifact/migration-efficiency-result.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: c74c-migration-efficiency-result-replay
          path: /tmp/c74c-artifact/migration-efficiency-result.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

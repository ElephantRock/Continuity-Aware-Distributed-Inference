name: c1-record-151

on:
  push:
    branches: [c1/deterministic-core]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c1/deterministic-core
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Synchronize canonical C1 record
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('spec/07-c1-deterministic-core-record.md')
          text = path.read_text()
          replacements = [
              ('```text\n142 passed\n```', '```text\n151 passed\n```'),
              ('Codex review identified thirteen correctness inconsistencies during closure:',
               'Codex review identified fourteen correctness inconsistencies during closure:'),
              ('13. snapshot restore did not enforce the core global logical-ID namespace across entity collections.\n\nAll thirteen are fixed and covered by regression tests.',
               '13. snapshot restore did not enforce the core global logical-ID namespace across entity collections;\n14. external semantic-operation traces could inject wrongly typed decoded arguments, including forged Evidence authority, because replay did not validate action argument/entity types.\n\nAll fourteen are fixed and covered by regression tests.'),
              ('- strict JSON parsing rejects numeric exponent overflow that would become ±infinity.\n',
               '- strict JSON parsing rejects numeric exponent overflow that would become ±infinity;\n- Operation JSONL arguments are validated against whitelisted `ContinuityCore` signatures before construction, serialization, and dispatch;\n- nested semantic-operation dataclass, enum, scalar, finite-float, and typed-container values are recursively validated;\n- malformed directly constructed `SemanticOperation` objects, duplicate argument names, and one-shot iterator arguments are rejected before canonical emission or mutation.\n'),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one record match, got {count}: {old[:120]!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Validate deterministic C1 suite
        run: |
          python -m pip install --upgrade pip pytest
          python -m pytest -q
      - name: Commit record sync and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add spec/07-c1-deterministic-core-record.md
          git rm .github/workflows/c1-record-151.yml
          git commit -m 'Synchronize C1 record at 151 tests'
          git push origin HEAD:c1/deterministic-core

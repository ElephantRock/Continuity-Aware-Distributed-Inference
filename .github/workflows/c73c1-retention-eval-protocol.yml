name: c73c1-retention-eval-protocol

on:
  push:
    branches:
      - c7/retention-eval-protocol
    paths:
      - .github/workflows/c73c1-retention-eval-protocol.yml
      - experiments/c73c_protocol.py
      - experiments/c73_retention_engine.py
      - experiments/c73_retention_protocol.py
      - experiments/c7_protocol.py
      - tests/experiments/test_c73c_protocol.py
      - spec/55-c7.3c-paired-retention-evaluation-protocol.md
      - pyproject.toml
  pull_request:
    paths:
      - .github/workflows/c73c1-retention-eval-protocol.yml
      - experiments/c73c_protocol.py
      - experiments/c73_retention_engine.py
      - experiments/c73_retention_protocol.py
      - experiments/c7_protocol.py
      - tests/experiments/test_c73c_protocol.py
      - spec/55-c7.3c-paired-retention-evaluation-protocol.md
      - pyproject.toml
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'

jobs:
  protocol-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify immutable checkout
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: Install test runner only
        run: python -m pip install 'pytest==8.4.2'
      - name: Run C7.3c1 deterministic protocol tests
        run: python -m pytest -q tests/experiments/test_c73c_protocol.py
      - name: Reproduce protocol identity twice
        run: |
          python -m experiments.c73c_protocol > /tmp/c73c1-a.json
          python -m experiments.c73c_protocol > /tmp/c73c1-b.json
          cmp /tmp/c73c1-a.json /tmp/c73c1-b.json
      - name: Verify frozen identities and pre-result boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from experiments.c73c_protocol import (
              C73C_BASE_COMMIT,
              C73C_FROZEN_C71_FINGERPRINT,
              C73C_FROZEN_C73A_FINGERPRINT,
              C73C_FROZEN_STATE_SIZE_MAP_FINGERPRINT,
              C73C_PROTOCOL_FINGERPRINT,
          )

          expected = '694f3c4e24ecca61b5c265e26f8417eafbcd4c932af3f9e60813fbb76d1b6800'
          payload = json.loads(Path('/tmp/c73c1-a.json').read_text())
          protocol = payload['protocol']
          assert protocol['schema'] == 'cadi.c7.3c.paired-retention-evaluation-protocol.v1'
          assert C73C_BASE_COMMIT == '451cafddb21d667f6abb73f48477560c850cda20'
          assert C73C_FROZEN_C71_FINGERPRINT == '706e0d5fff362a1eda8c906b957c914251c6e7949bac6be3c2c143ae21625474'
          assert C73C_FROZEN_C73A_FINGERPRINT == 'f6165cb9248f5f4292846942e797e5ddcd8d004027ad503b2a7de35210021379'
          assert C73C_FROZEN_STATE_SIZE_MAP_FINGERPRINT == '36bacaad6462ca3e5eeb2688040e4dcf0d829849158c5b5ad9bad3c58afe173b'
          assert C73C_PROTOCOL_FINGERPRINT == expected
          assert payload['protocol_fingerprint'] == expected
          assert protocol['comparative_result_inspection'] == 'NONE'
          assert protocol['full_cartesian_search_forbidden'] is True
          assert protocol['statistics']['bootstrap_resamples'] == 10000
          assert protocol['statistics']['bootstrap_seed'] == 20260911
          assert protocol['paired_fairness']['base_manifest_exact_series_parameter_set_and_psrc4_required'] is True
          assert protocol['h5_rule']['primary_baselines'] == ['LRU', 'FIXED_TTL(5s)', 'SESSION_PINNING']
          assert protocol['h5_rule']['single_hardware_ttft_can_trigger_h5'] is False
          assert 'policy_results' not in protocol
          assert 'p2_results' not in protocol
          assert 'p3_results' not in protocol
          source = Path('experiments/c73c_protocol.py').read_text()
          assert 'run_retention_program(' not in source
          print('frozen_protocol_fingerprint=' + payload['protocol_fingerprint'])
          print('comparative_result_inspection=NONE')
          PY

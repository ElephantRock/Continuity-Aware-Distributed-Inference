name: c2-4-2-fault-classes

on:
  push:
    branches: [c2/fault-outcome-linkage]
    paths:
      - .github/workflows/c2-4-2-fault-classes.yml

permissions:
  contents: write

jobs:
  extend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c2/fault-outcome-linkage
          fetch-depth: 0
      - name: Extend fault vocabulary
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('simulator/faults.py')
          text = path.read_text()
          old = '''    WORKER_FAILURE = "WORKER_FAILURE"\n    REPLICA_LOSS = "REPLICA_LOSS"\n'''
          new = '''    WORKER_FAILURE = "WORKER_FAILURE"\n    REPLICA_LOSS = "REPLICA_LOSS"\n    REPLICA_EVICTION = "REPLICA_EVICTION"\n    ATTEMPT_TIMEOUT = "ATTEMPT_TIMEOUT"\n    LATE_ATTEMPT_RESULT = "LATE_ATTEMPT_RESULT"\n    STALE_ATTEMPT_OBSERVATION = "STALE_ATTEMPT_OBSERVATION"\n'''
          if old not in text:
              raise SystemExit('missing FaultClass extension target')
          text = text.replace(old, new, 1)

          old = '''    FaultClass.WORKER_FAILURE: ("physical availability", "retry/recovery path"),\n    FaultClass.REPLICA_LOSS: ("physical StateReplica availability", "State reuse safety"),\n}\n'''
          new = '''    FaultClass.WORKER_FAILURE: ("physical availability", "retry/recovery path"),\n    FaultClass.REPLICA_LOSS: ("physical StateReplica availability", "State reuse safety"),\n    FaultClass.REPLICA_EVICTION: ("physical StateReplica availability", "cold-resume/reuse path"),\n    FaultClass.ATTEMPT_TIMEOUT: ("Attempt authority supersession", "late-result fencing"),\n    FaultClass.LATE_ATTEMPT_RESULT: ("superseded-event fencing", "finalization authority"),\n    FaultClass.STALE_ATTEMPT_OBSERVATION: ("Evidence scope/authority", "terminal-request fencing"),\n}\n'''
          if old not in text:
              raise SystemExit('missing pressure extension target')
          text = text.replace(old, new, 1)

          old = '''    FaultClass.WORKER_FAILURE: ("FAIL_PHYSICAL_WORK", "RETRY", "RECOMPUTE", "MIGRATE"),\n    FaultClass.REPLICA_LOSS: ("RECOMPUTE", "MIGRATE", "REJECT_REUSE"),\n}\n'''
          new = '''    FaultClass.WORKER_FAILURE: ("FAIL_PHYSICAL_WORK", "RETRY", "RECOMPUTE", "MIGRATE"),\n    FaultClass.REPLICA_LOSS: ("RECOMPUTE", "MIGRATE", "REJECT_REUSE"),\n    FaultClass.REPLICA_EVICTION: ("RECOMPUTE", "RESTORE", "COLD_RESUME"),\n    FaultClass.ATTEMPT_TIMEOUT: ("RETRY", "IGNORE_STALE", "WAIT"),\n    FaultClass.LATE_ATTEMPT_RESULT: ("RECORD_NON_AUTHORITATIVE", "IGNORE_STALE"),\n    FaultClass.STALE_ATTEMPT_OBSERVATION: ("REJECT", "IGNORE_STALE", "FAIL_CLOSED"),\n}\n'''
          if old not in text:
              raise SystemExit('missing safe outcome extension target')
          text = text.replace(old, new, 1)

          old = '''            elif record.fault_class is FaultClass.REPLICA_LOSS and self.resources is not None:\n                event_id = record.produced_event_ids[0]\n                if event_id in trace and self.resources.replicas[record.target].status is not ReplicaRuntimeStatus.LOST:\n                    raise AssertionError("replica-loss ground truth did not produce LOST replica")\n'''
          new = '''            elif record.fault_class is FaultClass.REPLICA_LOSS and self.resources is not None:\n                event_id = record.produced_event_ids[0]\n                if event_id in trace and self.resources.replicas[record.target].status is not ReplicaRuntimeStatus.LOST:\n                    raise AssertionError("replica-loss ground truth did not produce LOST replica")\n            elif record.fault_class is FaultClass.REPLICA_EVICTION and self.resources is not None:\n                event_id = record.produced_event_ids[0]\n                if event_id in trace and self.resources.replicas[record.target].status is not ReplicaRuntimeStatus.EVICTED:\n                    raise AssertionError("replica-eviction ground truth did not produce EVICTED replica")\n'''
          if old not in text:
              raise SystemExit('missing eviction ground truth target')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Commit extension and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c2-4-2-fault-classes.yml
          git add simulator/faults.py
          git commit -m "Extend C2.4 cross-layer fault vocabulary"
          git push origin HEAD:c2/fault-outcome-linkage

name: c83a-v2-archive-integrity

on:
  push:
    branches:
      - c8/cross-layer-replay-protocol
      - main
    paths:
      - .github/workflows/c83a-cross-layer-replay-protocol.yml
      - experiments/c83_replay_protocol.py
      - tests/experiments/test_c83_replay_protocol.py
      - spec/63-c8.3a-cross-layer-replay-protocol.md
      - experiments/c8_protocol.py
  pull_request:
    paths:
      - .github/workflows/c83a-cross-layer-replay-protocol.yml
      - experiments/c83_replay_protocol.py
      - tests/experiments/test_c83_replay_protocol.py
      - spec/63-c8.3a-cross-layer-replay-protocol.md
      - experiments/c8_protocol.py
  workflow_dispatch:

permissions:
  contents: read

env:
  C82_MERGE: '85a0ef4be82d45dc5e309332c5f41d067e4c952a'
  C81_PROTOCOL_FINGERPRINT: '616cc4daa4c167152875522767a8cc968da25c63d6acc099c265bc3554641cb6'
  C83A_V2_FINGERPRINT: '40780a318a5a692c713d7d27ded86d1f0fc6cd920d1c1ef82114889f9d9e099a'

jobs:
  archive-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Verify immutable clean checkout
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          check-latest: false

      - name: Install test runner only
        run: python -m pip install 'pytest==8.4.2'

      - name: Verify immutable v2 protocol identity
        run: |
          python - <<'PY'
          from experiments.c8_protocol import C8_PROTOCOL_FINGERPRINT
          from experiments.c83_replay_protocol import (
              C83A_BASE_COMMIT,
              C83A_COMPARATIVE_RESULT_INSPECTION,
              C83A_PROTOCOL_FINGERPRINT,
              protocol_fingerprint,
              validate_protocol_identity,
          )
          assert C8_PROTOCOL_FINGERPRINT == '${{ env.C81_PROTOCOL_FINGERPRINT }}'
          assert C83A_BASE_COMMIT == '${{ env.C82_MERGE }}'
          assert C83A_PROTOCOL_FINGERPRINT == '${{ env.C83A_V2_FINGERPRINT }}'
          assert protocol_fingerprint() == C83A_PROTOCOL_FINGERPRINT
          assert C83A_COMPARATIVE_RESULT_INSPECTION == 'NONE'
          validate_protocol_identity()
          PY

      - name: Run archived v2 protocol contract tests
        run: python -m pytest -q tests/experiments/test_c83_replay_protocol.py

      - name: Record archival boundary
        run: |
          echo "c83a_v2_status=ARCHIVED_IMMUTABLE_PREDECESSOR"
          echo "c83a_v2_protocol_fingerprint=$C83A_V2_FINGERPRINT"
          echo "live_substrate_fence_owner=C8.3a_v3"
          echo "comparative_result_inspection=NONE"

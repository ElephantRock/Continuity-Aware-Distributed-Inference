name: c6-4a-representation-contract

on:
  push:
    branches:
      - c6/source-semantic-cost-representation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --upgrade pip pytest
      - name: Test C6.4a representation contract
        run: python -m pytest tests/simulator/test_inference_cost_v2.py
      - name: Prove fresh boundary is timing-free
        shell: python
        run: |
          from simulator.inference_cost_v2 import (
              C64A_FRESH_PREFILL_BOUNDARY,
              C64A_FRESH_TRANSFER_BOUNDARY,
          )

          for boundary in (
              C64A_FRESH_PREFILL_BOUNDARY,
              C64A_FRESH_TRANSFER_BOUNDARY,
          ):
              payload = boundary.to_dict()
              assert payload['contains_reference_timings'] is False
              assert not any('second' in key for key in payload)
              print('C6_4A_BOUNDARY=' + boundary.to_json())

name: bootstrap-import

on:
  push:
    branches:
      - bootstrap/c0.1-c1
    paths:
      - '.github/workflows/bootstrap-import.yml'

permissions:
  contents: write

jobs:
  reconstruct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Reconstruct canonical files
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          manifest = root / '.bootstrap/manifest.tsv'
          current = None
          out = None
          try:
              for line in manifest.read_text(encoding='utf-8').splitlines():
                  final_path, fragment_path = line.split('\t', 1)
                  dst = root / final_path
                  if final_path != current:
                      if out is not None:
                          out.close()
                      dst.parent.mkdir(parents=True, exist_ok=True)
                      out = dst.open('w', encoding='utf-8', newline='')
                      current = final_path
                  out.write((root / fragment_path).read_text(encoding='utf-8'))
          finally:
              if out is not None:
                  out.close()
          PY

      - name: Verify exact file hashes
        run: sha256sum --check .bootstrap/checksums.sha256

      - name: Validate deterministic core
        run: |
          python -m pip install --upgrade pip pytest
          python -m pytest

      - name: Remove bootstrap transport
        run: |
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-import.yml

      - name: Commit canonical bootstrap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bootstrap C1 deterministic core and repository scaffold"
          git push

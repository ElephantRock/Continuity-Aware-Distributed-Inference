name: c75a-g2-integration-protocol

on:
  push:
    branches:
      - c7/g2-integration-protocol
    paths:
      - .github/workflows/c75a-g2-integration-protocol.yml
      - experiments/c75_g2_protocol.py
      - tests/experiments/test_c75_g2_protocol.py
      - spec/58-c7.5a-g2-integration-protocol.md
  pull_request:
    paths:
      - .github/workflows/c75a-g2-integration-protocol.yml
      - experiments/c75_g2_protocol.py
      - tests/experiments/test_c75_g2_protocol.py
      - spec/58-c7.5a-g2-integration-protocol.md
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'
  C75_BASE: '8ecb61c67ca73de4855d34a01ae35e54b2677cb3'
  MOONCAKE_URL: 'https://raw.githubusercontent.com/kvcache-ai/Mooncake/3cca71daccf2a7afb8fe3f0295358f70e3a69fdb/FAST25-release/traces/conversation_trace.jsonl'
  C75_REVIEWED_PROTOCOL_FINGERPRINT: '318c415b9531001fc4637b7de6f21cd13ffb33a06d74444fb41c1ace3709ae41'

jobs:
  protocol-freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify immutable checkout
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: Install test runner only
        run: python -m pip install 'pytest==8.4.2'
      - name: Prove C7.1/C7.2 scientific tree unchanged
        run: |
          git diff --exit-code "$C75_BASE"..HEAD -- \
            experiments/c7_protocol.py \
            experiments/c72_routing_reuse.py \
            tests/experiments/test_c72_routing_reuse.py \
            spec/50-c7.1-efficiency-protocol.md \
            spec/51-c7.2-routing-reuse.md \
            simulator/policies.py \
            simulator/continuity_policy.py
      - name: Run C7.5a protocol tests
        run: python -m pytest -q tests/experiments/test_c75_g2_protocol.py
      - name: Reproduce protocol identity twice
        run: |
          python -m experiments.c75_g2_protocol > /tmp/c75-a.json
          python -m experiments.c75_g2_protocol > /tmp/c75-b.json
          cmp /tmp/c75-a.json /tmp/c75-b.json
      - name: Verify literal protocol fence and pre-result boundary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from experiments.c75_g2_protocol import C75_PROTOCOL_FINGERPRINT

          payload = json.loads(Path('/tmp/c75-a.json').read_text())
          expected = os.environ['C75_REVIEWED_PROTOCOL_FINGERPRINT']
          assert payload['protocol']['comparative_result_inspection'] == 'NONE'
          assert payload['protocol_fingerprint'] == C75_PROTOCOL_FINGERPRINT
          assert payload['protocol_fingerprint'] == expected
          assert expected == '318c415b9531001fc4637b7de6f21cd13ffb33a06d74444fb41c1ace3709ae41'
          assert 'policy_results' not in payload['protocol']
          assert payload['protocol']['h4']['cell_support_is_per_comparator'] is True
          assert 'at least one primary comparator' in payload['protocol']['h4']['hypothesis_support']
          assert 'at least one qualifying P1 or P4' in payload['protocol']['h7']['hypothesis_support']
          print(f"protocol_fingerprint={payload['protocol_fingerprint']}")
          print('comparative_result_inspection=NONE')
          PY
      - name: Download exact pinned Mooncake source
        run: curl --fail --location --silent --show-error "$MOONCAKE_URL" --output /tmp/mooncake.jsonl
      - name: Reproduce frozen 64-seed source selection twice
        run: |
          python - <<'PY' > /tmp/c75-source-a.json
          import json
          from pathlib import Path
          from experiments.c72_routing_reuse import derive_pinned_mooncake_c7_admissible
          from experiments.c75_g2_protocol import seed_selection_fingerprint, select_seed_records
          from experiments.mooncake_trace import load_pinned_mooncake_trace

          source = load_pinned_mooncake_trace(Path('/tmp/mooncake.jsonl').read_bytes())
          admissible = derive_pinned_mooncake_c7_admissible(source)
          selected = select_seed_records(admissible.source_order)
          payload = {
              'admissible_fingerprint': admissible.fingerprint,
              'selected_count': len(selected),
              'record_ids': [r.record_id for r in selected],
              'input_tokens': [r.input_tokens for r in selected],
              'output_tokens': [r.output_tokens for r in selected],
              'selection_fingerprint': seed_selection_fingerprint(
                  admissible.source_order,
                  admissible_dataset_fingerprint=admissible.fingerprint,
              ),
          }
          print(json.dumps(payload, sort_keys=True, separators=(',', ':'), allow_nan=False))
          PY
          python - <<'PY' > /tmp/c75-source-b.json
          import json
          from pathlib import Path
          from experiments.c72_routing_reuse import derive_pinned_mooncake_c7_admissible
          from experiments.c75_g2_protocol import seed_selection_fingerprint, select_seed_records
          from experiments.mooncake_trace import load_pinned_mooncake_trace

          source = load_pinned_mooncake_trace(Path('/tmp/mooncake.jsonl').read_bytes())
          admissible = derive_pinned_mooncake_c7_admissible(source)
          selected = select_seed_records(admissible.source_order)
          payload = {
              'admissible_fingerprint': admissible.fingerprint,
              'selected_count': len(selected),
              'record_ids': [r.record_id for r in selected],
              'input_tokens': [r.input_tokens for r in selected],
              'output_tokens': [r.output_tokens for r in selected],
              'selection_fingerprint': seed_selection_fingerprint(
                  admissible.source_order,
                  admissible_dataset_fingerprint=admissible.fingerprint,
              ),
          }
          print(json.dumps(payload, sort_keys=True, separators=(',', ':'), allow_nan=False))
          PY
          cmp /tmp/c75-source-a.json /tmp/c75-source-b.json
      - name: Verify frozen source-selection identity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from experiments.c75_g2_protocol import C75_SOURCE_SELECTION_FINGERPRINT

          payload = json.loads(Path('/tmp/c75-source-a.json').read_text())
          assert payload['admissible_fingerprint'] == '05a37c9cb3d1649aacd82de1b773161feafa6304b33d90fa3cff33eb60ae7846'
          assert payload['selected_count'] == 64
          assert len(set(payload['record_ids'])) == 64
          assert all(value % 4 == 0 for value in payload['input_tokens'])
          assert all(i >= 1 and o >= 1 and i + o <= 4096 for i, o in zip(payload['input_tokens'], payload['output_tokens'], strict=True))
          assert payload['selection_fingerprint'] == C75_SOURCE_SELECTION_FINGERPRINT
          assert payload['selection_fingerprint'] == 'bebaf2e535b78177cb3ef2c39fddd9e23180c4aecb3e06deac9390d29b190fe4'
          print(f"selection_fingerprint={payload['selection_fingerprint']}")
          print('comparative_result_inspection=NONE')
          PY

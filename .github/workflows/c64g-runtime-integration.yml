name: c64g-runtime-integration

on:
  push:
    branches:
      - c6/runtime-v4-integration
    paths:
      - .github/workflows/c64g-runtime-integration.yml
      - artifacts/c6.4f/exhaustive-source-equivalence.json
      - simulator/inference_cost_runtime.py
      - tests/simulator/test_inference_cost_runtime.py
      - spec/48-c6.4g-runtime-integration.md
      - pyproject.toml
  pull_request:
    paths:
      - .github/workflows/c64g-runtime-integration.yml
      - artifacts/c6.4f/exhaustive-source-equivalence.json
      - simulator/inference_cost_runtime.py
      - tests/simulator/test_inference_cost_runtime.py
      - spec/48-c6.4g-runtime-integration.md
      - pyproject.toml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify immutable source checkout
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: Verify request-time import without site packages
        run: |
          python -S - <<'PY'
          import sys
          from simulator.inference_cost_runtime import (
              C64F_ARTIFACT_SHA256,
              C64F_SCIENTIFIC_FINGERPRINT,
          )
          assert "numpy" not in sys.modules
          assert "sklearn" not in sys.modules
          assert C64F_ARTIFACT_SHA256 == "93990386135ecbf6fc38e579841eace3431a068b10ee59209fe6ad7084bd8889"
          assert C64F_SCIENTIFIC_FINGERPRINT == "cc1b62c4e38a1612720f601375c425c0bd7d67b4eff11b101bfdf87b79a7a61a"
          print("dependency_free_import=PASS")
          PY
      - name: Verify zero mandatory project dependencies
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path
          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          assert project["project"]["dependencies"] == []
          print("mandatory_dependencies=0")
          PY
      - name: Install test runner only
        run: python -m pip install pytest==8.3.5
      - name: Run C6.4g runtime contract
        run: python -m pytest -q tests/simulator/test_inference_cost_runtime.py
      - name: Verify accepted artifact and complete runtime projection
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          from simulator.inference_cost_runtime import (
              C64F_ARTIFACT_SHA256,
              C64F_SCIENTIFIC_FINGERPRINT,
              load_c64f_runtime_profiles,
          )

          artifact = Path("artifacts/c6.4f/exhaustive-source-equivalence.json")
          observed = hashlib.sha256(artifact.read_bytes()).hexdigest()
          assert observed == C64F_ARTIFACT_SHA256
          profiles = load_c64f_runtime_profiles(artifact)
          assert set(profiles) == {"a100-80gb", "h100-80gb"}
          for profile in profiles.values():
              assert len(profile.prefill_seconds_by_input_token) == 4096
              assert len(profile.transfer_seconds_by_predictor_token) == 4096
              assert profile.scientific_fingerprint == C64F_SCIENTIFIC_FINGERPRINT
          print("scientific_fingerprint=", C64F_SCIENTIFIC_FINGERPRINT)
          print("artifact_sha256=", observed)
          print("runtime_projection=PASS")
          PY

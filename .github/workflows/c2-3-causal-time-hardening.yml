name: c2-3-causal-time-hardening

on:
  push:
    branches: [c2/semantic-adapter]
    paths:
      - .github/workflows/c2-3-causal-time-hardening.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c2/semantic-adapter
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply causal-time and retry fencing
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('simulator/semantic_adapter.py')
          text = path.read_text()

          old = '''        self.records: list[SemanticActionRecord] = []\n        self._scheduled_retry_attempts: set[str] = set()\n\n        self._register(EventKind.REQUEST_CREATED, self._on_request_created)\n'''
          new = '''        self.records: list[SemanticActionRecord] = []\n        self._scheduled_retry_attempts: set[str] = set()\n        self._attempt_success_times: dict[str, float] = {}\n\n        self._register(EventKind.REQUEST_CREATED, self._on_request_created)\n'''
          if old not in text: raise SystemExit('missing adapter state target')
          text = text.replace(old, new, 1)

          old = '''        for value, name in (\n            (request_id, "request_id"),\n            (timed_out_attempt_id, "timed_out_attempt_id"),\n            (retry_attempt_id, "retry_attempt_id"),\n        ):\n            self._require_id(value, name)\n        return self.simulator.schedule(\n'''
          new = '''        for value, name in (\n            (request_id, "request_id"),\n            (timed_out_attempt_id, "timed_out_attempt_id"),\n            (retry_attempt_id, "retry_attempt_id"),\n        ):\n            self._require_id(value, name)\n        if retry_attempt_id == timed_out_attempt_id:\n            raise ValueError("retry_attempt_id must differ from timed_out_attempt_id")\n        return self.simulator.schedule(\n'''
          if old not in text: raise SystemExit('missing timeout identity target')
          text = text.replace(old, new, 1)

          old = '''        return self.simulator.schedule(\n            EventKind.RETRY_STARTED,\n            at=at,\n            event_id=event_id or f"retry-start:{retry_attempt_id}",\n            payload={\n                "request_id": request_id,\n                "superseded_attempt_id": superseded_attempt_id,\n                "retry_attempt_id": retry_attempt_id,\n            },\n        )\n\n    def schedule_attempt_completion(\n'''
          new = '''        if retry_attempt_id == superseded_attempt_id:\n            raise ValueError("retry_attempt_id must differ from superseded_attempt_id")\n        if retry_attempt_id in self._scheduled_retry_attempts:\n            raise ValueError("retry Attempt is already scheduled")\n        self._scheduled_retry_attempts.add(retry_attempt_id)\n        try:\n            return self.simulator.schedule(\n                EventKind.RETRY_STARTED,\n                at=at,\n                event_id=event_id or f"retry-start:{retry_attempt_id}",\n                payload={\n                    "request_id": request_id,\n                    "superseded_attempt_id": superseded_attempt_id,\n                    "retry_attempt_id": retry_attempt_id,\n                },\n            )\n        except Exception:\n            self._scheduled_retry_attempts.remove(retry_attempt_id)\n            raise\n\n    def schedule_attempt_completion(\n'''
          if old not in text: raise SystemExit('missing explicit retry reservation target')
          text = text.replace(old, new, 1)

          old = '''    def _on_attempt_completed(self, event: SimEvent) -> None:\n        payload = self._payload(event, "attempt_id")\n        self._apply(\n            event,\n            "complete_attempt:SUCCEEDED",\n            lambda: self.core.complete_attempt(payload["attempt_id"], succeeded=True),\n        )\n\n    def _on_attempt_failed(self, event: SimEvent) -> None:\n'''
          new = '''    def _on_attempt_completed(self, event: SimEvent) -> None:\n        payload = self._payload(event, "attempt_id")\n        attempt = self.core.attempts.get(payload["attempt_id"])\n        already_succeeded = (\n            attempt is not None and attempt.execution_status is ExecutionStatus.SUCCEEDED\n        )\n        result = self._apply(\n            event,\n            "complete_attempt:SUCCEEDED",\n            lambda: self.core.complete_attempt(payload["attempt_id"], succeeded=True),\n        )\n        if result is not None and not already_succeeded:\n            self._attempt_success_times.setdefault(payload["attempt_id"], self.simulator.now)\n\n    def _on_attempt_failed(self, event: SimEvent) -> None:\n'''
          if old not in text: raise SystemExit('missing completion time target')
          text = text.replace(old, new, 1)

          old = '''        if attempt.execution_status is not ExecutionStatus.SUCCEEDED:\n            self._note(\n                event,\n                "observe_terminal_attempt",\n                AdapterOutcome.REJECTED,\n                error=SemanticViolation("terminal success observation requires SUCCEEDED Attempt"),\n            )\n            return\n\n        try:\n'''
          new = '''        if attempt.execution_status is not ExecutionStatus.SUCCEEDED:\n            self._note(\n                event,\n                "observe_terminal_attempt",\n                AdapterOutcome.REJECTED,\n                error=SemanticViolation("terminal success observation requires SUCCEEDED Attempt"),\n            )\n            return\n        success_time = self._attempt_success_times.get(payload["attempt_id"])\n        if success_time is not None and observed_at < success_time:\n            self._note(\n                event,\n                "observation_timestamp",\n                AdapterOutcome.REJECTED,\n                error=_AdapterInputError(\n                    "terminal observation cannot predate delivered Attempt success"\n                ),\n            )\n            return\n\n        try:\n'''
          if old not in text: raise SystemExit('missing observation causal time target')
          text = text.replace(old, new, 1)
          path.write_text(text)

          tests_path = Path('tests/simulator/test_semantic_adapter.py')
          tests = tests_path.read_text()
          tests += '''\n\ndef test_terminal_observation_cannot_predate_delivered_attempt_success():\n    sim = DiscreteEventSimulator()\n    core = _scaffold_core()\n    adapter = ContinuityAdapter(sim, core)\n    adapter.schedule_request("r", "c", at=0)\n    adapter.schedule_attempt_start("r", "a1", at=1)\n    adapter.schedule_attempt_completion("a1", at=5)\n    adapter.schedule_observation("r", "a1", "e1", "o1", at=6, observed_at=4)\n    sim.run()\n\n    assert "e1" not in core.evidence\n    assert "o1" not in core.outputs\n    assert core.requests["r"].committed_attempt_id is None\n    record = next(\n        record for record in adapter.records\n        if record.event_id == "observation:e1:o1"\n    )\n    assert record.operation == "observation_timestamp"\n    assert record.outcome is AdapterOutcome.REJECTED\n\n\n@pytest.mark.parametrize("timeout_first", [True, False])\ndef test_simultaneous_timeout_and_completion_orderings_preserve_a2_authority(timeout_first):\n    reference = _reference_retry_race()\n    sim = DiscreteEventSimulator()\n    core = _scaffold_core()\n    adapter = ContinuityAdapter(sim, core)\n    adapter.schedule_request("r", "c", at=0)\n    adapter.schedule_attempt_start("r", "a1", at=1)\n    if timeout_first:\n        adapter.schedule_timeout("r", "a1", "a2", at=5)\n        adapter.schedule_attempt_completion("a1", at=5)\n    else:\n        adapter.schedule_attempt_completion("a1", at=5)\n        adapter.schedule_timeout("r", "a1", "a2", at=5)\n    adapter.schedule_attempt_completion("a2", at=7)\n    adapter.schedule_observation("r", "a2", "e2", "o2", at=8)\n    sim.run()\n\n    assert_authoritative_equivalent(reference, core, "r")\n    assert core.attempts["a1"].execution_status is ExecutionStatus.SUCCEEDED\n    assert core.attempts["a1"].authority_status is AttemptAuthority.SUPERSEDED\n\n\ndef test_explicit_retry_reservation_deduplicates_later_timeout_delivery():\n    sim = DiscreteEventSimulator()\n    core = _scaffold_core()\n    adapter = ContinuityAdapter(sim, core)\n    adapter.schedule_request("r", "c", at=0)\n    adapter.schedule_attempt_start("r", "a1", at=1)\n    adapter.schedule_retry_start("r", "a1", "a2", at=5, event_id="preplanned-retry")\n    adapter.schedule_timeout("r", "a1", "a2", at=4, event_id="timeout")\n    sim.run()\n\n    assert [(a.id, a.generation) for a in sorted(core.attempts.values(), key=lambda a: a.generation)] == [\n        ("a1", 1), ("a2", 2)\n    ]\n    timeout = [record for record in adapter.records if record.event_id == "timeout"]\n    assert timeout[-1].outcome is AdapterOutcome.IGNORED\n\n\ndef test_retry_attempt_identity_must_differ_from_superseded_attempt():\n    sim = DiscreteEventSimulator()\n    core = _scaffold_core()\n    adapter = ContinuityAdapter(sim, core)\n    with pytest.raises(ValueError, match="must differ"):\n        adapter.schedule_timeout("r", "a1", "a1", at=1)\n    with pytest.raises(ValueError, match="must differ"):\n        adapter.schedule_retry_start("r", "a1", "a1", at=1)\n'''
          tests_path.write_text(tests)

          spec_path = Path('spec/09-c2-semantic-adapter-record.md')
          spec = spec_path.read_text()
          spec = spec.replace(
              'reordered duplicate-before-original observation delivery\nconflicting Evidence identity rejection',
              'reordered duplicate-before-original observation delivery\nconflicting Evidence identity rejection\nterminal observation timestamp fenced after adapter-delivered Attempt success\nsimultaneous timeout/completion in both insertion orders\npreplanned retry vs timeout deduplication',
              1,
          )
          spec_path.write_text(spec)
          PY
      - name: Validate full repository suite
        run: |
          python -m pip install --upgrade pip pytest
          python -m pytest
      - name: Commit validated hardening and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c2-3-causal-time-hardening.yml
          git add simulator/semantic_adapter.py tests/simulator/test_semantic_adapter.py spec/09-c2-semantic-adapter-record.md
          git commit -m "Fence C2.3 observation causality and retry scheduling"
          git push origin HEAD:c2/semantic-adapter

name: c1-output-evidence

on:
  push:
    branches: [c1/deterministic-core]
    paths:
      - '.github/workflows/c1-output-evidence.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c1/deterministic-core
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply Output Evidence integrity guard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          core = Path('continuity/core.py')
          text = core.read_text()
          old = '''    def create_output(self, id_: str, attempt_id: str, terminal: bool, evidence_ids: Iterable[str] = ()) -> Output:\n        self._unique(id_); self.attempts[attempt_id]\n        o = Output(id_, attempt_id, terminal, frozenset(evidence_ids)); self.outputs[id_] = o; return o\n'''
          new = '''    def create_output(self, id_: str, attempt_id: str, terminal: bool, evidence_ids: Iterable[str] = ()) -> Output:\n        self._unique(id_); self.attempts[attempt_id]\n        evidence = frozenset(evidence_ids)\n        missing = sorted(eid for eid in evidence if eid not in self.evidence)\n        if missing:\n            raise SemanticViolation(f"Output references unknown Evidence: {missing}")\n        o = Output(id_, attempt_id, terminal, evidence); self.outputs[id_] = o; return o\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one create_output block, found {text.count(old)}')
          core.write_text(text.replace(old, new, 1))

          test = Path('tests/invariants/test_catalogue_obligations.py')
          test.write_text(test.read_text() + '''\n\ndef test_output_rejects_unresolved_evidence_reference(core):\n    import pytest\n    from continuity.errors import SemanticViolation\n    core.create_program('p'); core.create_session('s', 'p'); core.create_continuation('c', 's')\n    core.create_request('r', 'c'); core.start_attempt('a', 'r')\n    with pytest.raises(SemanticViolation):\n        core.create_output('o', 'a', True, ['later'])\n    assert 'o' not in core.outputs\n''')
          PY
      - name: Run deterministic C1 tests
        run: |
          python -m pip install --upgrade pip pytest
          python -m pytest -q
      - name: Commit integrity fix and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add continuity/core.py tests/invariants/test_catalogue_obligations.py
          git rm .github/workflows/c1-output-evidence.yml
          git commit -m 'Require Output Evidence references to resolve'
          git push origin HEAD:c1/deterministic-core

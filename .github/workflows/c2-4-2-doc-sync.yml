name: c2-4-2-doc-sync

on:
  push:
    branches: [c2/fault-outcome-linkage]
    paths:
      - .github/workflows/c2-4-2-doc-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c2/fault-outcome-linkage
          fetch-depth: 0
      - name: Synchronize C2.4.2 record
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('spec/10-c2-fault-injection-record.md')
          text = path.read_text()
          text = text.replace(
              '''```text\nPENDING\nDELIVERY_SUPPRESSED\nPHYSICAL_EFFECT\nSEMANTIC_APPLIED\nSEMANTIC_IDEMPOTENT\nSEMANTIC_IGNORED\nSEMANTIC_REJECTED\n```''',
              '''```text\nPENDING\nINVARIANT_VIOLATION\nDELIVERY_SUPPRESSED\nPHYSICAL_EFFECT\nSEMANTIC_APPLIED\nSEMANTIC_IDEMPOTENT\nSEMANTIC_IGNORED\nSEMANTIC_REJECTED\n```''',
              1,
          )
          text = text.replace(
              '''Classification precedence is intentionally fail-closed:\n\n```text\nREJECTED semantic action\n    > IGNORED\n    > APPLIED\n    > IDEMPOTENT\n```''',
              '''Classification precedence is intentionally fail-closed:\n\n```text\nINVARIANT_VIOLATION\n    > REJECTED semantic action\n    > IGNORED\n    > APPLIED\n    > IDEMPOTENT\n```''',
              1,
          )
          text = text.replace(
              'When an adapter and RequestID are available, the linker also records the C2.3 `AuthoritativeOutcome` projection. This lets experiments associate FaultID with the semantic winner without reimplementing C1 authority.',
              'When an adapter and RequestID are available and the independent invariant oracle is clean, the linker also records the C2.3 `AuthoritativeOutcome` projection. If the oracle reports any violation, the outcome is classified `INVARIANT_VIOLATION` and authoritative projection is suppressed. This lets experiments associate FaultID with the semantic winner without reimplementing or masking C1 authority.',
              1,
          )
          text = text.replace(
              'invariant violations remain empty for safe traces\n',
              'invariant violations remain empty for safe traces\ninvariant violation has highest classification precedence and suppresses authoritative projection\n',
              1,
          )
          text = text.replace(
              'fail-closed semantic rejection is classified explicitly\n',
              'fail-closed semantic rejection is classified explicitly\ninvariant-oracle failure is classified explicitly and cannot expose an authoritative projection\n',
              1,
          )
          path.write_text(text)
          PY
      - name: Commit synchronized record and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c2-4-2-doc-sync.yml
          git add spec/10-c2-fault-injection-record.md
          git commit -m "Synchronize C2.4.2 fail-closed outcome record"
          git push origin HEAD:c2/fault-outcome-linkage
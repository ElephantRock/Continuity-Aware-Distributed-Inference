name: c2-2-review-hardening

on:
  push:
    branches: [c2/resource-model]
    paths:
      - .github/workflows/c2-2-review-hardening.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c2/resource-model
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply bounded-review fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('simulator/resources.py')
          text = path.read_text()

          old = '''        if replica.location_id != link.source_id:\n            raise ValueError("replica location must match link source")\n        transfer = StateTransfer(\n'''
          new = '''        if replica.location_id != link.source_id:\n            raise ValueError("replica location must match link source")\n        if any(\n            transfer.replica_id == replica_id\n            and transfer.status in {TransferStatus.SCHEDULED, TransferStatus.RUNNING}\n            for transfer in self.transfers.values()\n        ):\n            raise ValueError("replica already has an active transfer")\n        transfer = StateTransfer(\n'''
          if old not in text: raise SystemExit('missing concurrent-transfer target')
          text = text.replace(old, new, 1)

          old = '''        self.tasks[task_id] = replace(task, status=TaskStatus.COMPLETED, completed_at=self.simulator.now)\n        self._dispatch(worker_id)\n'''
          new = '''        self.tasks[task_id] = replace(\n            task,\n            status=TaskStatus.COMPLETED,\n            completed_at=self.simulator.now,\n            completion_event_id=None,\n        )\n        self._dispatch(worker_id)\n'''
          if old not in text: raise SystemExit('missing task-complete target')
          text = text.replace(old, new, 1)

          old = '''            self.tasks[task_id] = replace(task, status=TaskStatus.FAILED, completed_at=self.simulator.now)\n            self.simulator.schedule(\n'''
          new = '''            self.tasks[task_id] = replace(\n                task,\n                status=TaskStatus.FAILED,\n                completed_at=self.simulator.now,\n                completion_event_id=None,\n            )\n            self.simulator.schedule(\n'''
          if old not in text: raise SystemExit('missing task-fail target')
          text = text.replace(old, new, 1)

          old = '''        for transfer_id, transfer in list(self.transfers.items()):\n            if transfer.status is not TransferStatus.RUNNING:\n                continue\n            if worker_id not in {transfer.source_id, transfer.destination_id}:\n                continue\n'''
          new = '''        for transfer_id, transfer in list(self.transfers.items()):\n            if transfer.status not in {TransferStatus.SCHEDULED, TransferStatus.RUNNING}:\n                continue\n            if worker_id not in {transfer.source_id, transfer.destination_id}:\n                continue\n'''
          if old not in text: raise SystemExit('missing worker-transfer target')
          text = text.replace(old, new, 1)

          old = '''            self.transfers[transfer_id] = replace(\n                transfer,\n                status=TransferStatus.FAILED,\n                completed_at=self.simulator.now,\n            )\n'''
          new = '''            self.transfers[transfer_id] = replace(\n                transfer,\n                status=TransferStatus.FAILED,\n                completed_at=self.simulator.now,\n                completion_event_id=None,\n            )\n'''
          if old not in text: raise SystemExit('missing transfer-fail cleanup target')
          text = text.replace(old, new, 1)

          old = '''    def _on_state_evicted(self, _sim: DiscreteEventSimulator, event: SimEvent) -> None:\n        replica_id = dict(event.payload)["replica_id"]\n        replica = self.replicas.get(replica_id)\n        if replica is None or replica.status is ReplicaRuntimeStatus.LOST:\n            return\n        if replica.completion_event_id:\n            self.simulator.cancel(replica.completion_event_id)\n        self.replicas[replica_id] = replace(\n'''
          new = '''    def _on_state_evicted(self, _sim: DiscreteEventSimulator, event: SimEvent) -> None:\n        replica_id = dict(event.payload)["replica_id"]\n        replica = self.replicas.get(replica_id)\n        if replica is None or replica.status is ReplicaRuntimeStatus.LOST:\n            return\n        self._fail_active_transfers_for_replica(replica_id)\n        if replica.completion_event_id:\n            self.simulator.cancel(replica.completion_event_id)\n        self.replicas[replica_id] = replace(\n'''
          if old not in text: raise SystemExit('missing evict target')
          text = text.replace(old, new, 1)

          old = '''    def _on_state_lost(self, _sim: DiscreteEventSimulator, event: SimEvent) -> None:\n        replica_id = dict(event.payload)["replica_id"]\n        replica = self.replicas.get(replica_id)\n        if replica is None or replica.status is ReplicaRuntimeStatus.LOST:\n            return\n        if replica.completion_event_id:\n            self.simulator.cancel(replica.completion_event_id)\n        self.replicas[replica_id] = replace(\n'''
          new = '''    def _on_state_lost(self, _sim: DiscreteEventSimulator, event: SimEvent) -> None:\n        replica_id = dict(event.payload)["replica_id"]\n        replica = self.replicas.get(replica_id)\n        if replica is None or replica.status is ReplicaRuntimeStatus.LOST:\n            return\n        self._fail_active_transfers_for_replica(replica_id)\n        if replica.completion_event_id:\n            self.simulator.cancel(replica.completion_event_id)\n        self.replicas[replica_id] = replace(\n'''
          if old not in text: raise SystemExit('missing loss target')
          text = text.replace(old, new, 1)

          marker = '''    def _require_worker(self, worker_id: str) -> Worker:\n'''
          helper = '''    def _fail_active_transfers_for_replica(self, replica_id: str) -> None:\n        for transfer_id, transfer in list(self.transfers.items()):\n            if transfer.replica_id != replica_id:\n                continue\n            if transfer.status not in {TransferStatus.SCHEDULED, TransferStatus.RUNNING}:\n                continue\n            if transfer.completion_event_id:\n                self.simulator.cancel(transfer.completion_event_id)\n            self.transfers[transfer_id] = replace(\n                transfer,\n                status=TransferStatus.FAILED,\n                completed_at=self.simulator.now,\n                completion_event_id=None,\n            )\n            self.simulator.schedule(\n                EventKind.STATE_TRANSFER_FAILED,\n                delay=0,\n                payload={"transfer_id": transfer_id},\n            )\n\n    def _require_worker(self, worker_id: str) -> Worker:\n'''
          if marker not in text: raise SystemExit('missing helper insertion target')
          text = text.replace(marker, helper, 1)
          path.write_text(text)

          tests = Path('tests/simulator/test_resources.py')
          source = tests.read_text()
          if not source.startswith('from continuity import ContinuityCore\n'):
              raise SystemExit('unexpected resource test header')
          source = source.replace('from continuity import ContinuityCore\n', 'import pytest\n\nfrom continuity import ContinuityCore\n', 1)
          source += '''\n\ndef test_same_runtime_replica_cannot_have_overlapping_moves():\n    sim, resources = _resources()\n    resources.add_link("l12", "w1", "w2", latency=1, bandwidth_bytes_per_time=100)\n    resources.materialize_replica("rp", "state", "w1", size_bytes=100, duration=0)\n    sim.run()\n    resources.start_transfer("tx1", "rp", "l12")\n\n    with pytest.raises(ValueError, match="active transfer"):\n        resources.start_transfer("tx2", "rp", "l12")\n\n\ndef test_eviction_aborts_inflight_transfer_and_cancels_completion():\n    sim, resources = _resources()\n    resources.add_link("l12", "w1", "w2", latency=1, bandwidth_bytes_per_time=100)\n    resources.materialize_replica("rp", "state", "w1", size_bytes=200, duration=0)\n    sim.run()\n    resources.start_transfer("tx", "rp", "l12")\n    sim.run_next()\n    assert resources.transfers["tx"].status is TransferStatus.RUNNING\n\n    resources.evict_replica("rp")\n    sim.run()\n\n    assert resources.replicas["rp"].status is ReplicaRuntimeStatus.EVICTED\n    assert resources.transfers["tx"].status is TransferStatus.FAILED\n    assert resources.transfers["tx"].completion_event_id is None\n    assert all(event.event_id != "transfer-complete:tx" for event in sim.trace)\n    assert any(event.kind is EventKind.STATE_TRANSFER_FAILED for event in sim.trace)\n\n\ndef test_terminal_task_records_clear_completion_event_identity():\n    sim, resources = _resources()\n    resources.enqueue_task("w1", "ok", duration=0)\n    sim.run()\n    assert resources.tasks["ok"].status is TaskStatus.COMPLETED\n    assert resources.tasks["ok"].completion_event_id is None\n\n    resources.enqueue_task("w1", "fail", duration=5)\n    sim.run_next()\n    resources.fail_worker("w1")\n    sim.run_next()\n    assert resources.tasks["fail"].status is TaskStatus.FAILED\n    assert resources.tasks["fail"].completion_event_id is None\n'''
          tests.write_text(source)
          PY
      - name: Validate full repository suite
        run: |
          python -m pip install --upgrade pip pytest
          python -m pytest
      - name: Commit validated review fixes and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c2-2-review-hardening.yml
          git add simulator/resources.py tests/simulator/test_resources.py
          git commit -m "Harden C2.2 transfer and terminal resource lifecycle"
          git push origin HEAD:c2/resource-model

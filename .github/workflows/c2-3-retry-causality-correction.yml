name: c2-3-retry-causality-correction

on:
  push:
    branches: [c2/semantic-adapter]
    paths:
      - .github/workflows/c2-3-retry-causality-correction.yml

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c2/semantic-adapter
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Remove host-time retry reservation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('simulator/semantic_adapter.py')
          text = path.read_text()
          old = '''        if retry_attempt_id == superseded_attempt_id:\n            raise ValueError("retry_attempt_id must differ from superseded_attempt_id")\n        if retry_attempt_id in self._scheduled_retry_attempts:\n            raise ValueError("retry Attempt is already scheduled")\n        self._scheduled_retry_attempts.add(retry_attempt_id)\n        try:\n            return self.simulator.schedule(\n                EventKind.RETRY_STARTED,\n                at=at,\n                event_id=event_id or f"retry-start:{retry_attempt_id}",\n                payload={\n                    "request_id": request_id,\n                    "superseded_attempt_id": superseded_attempt_id,\n                    "retry_attempt_id": retry_attempt_id,\n                },\n            )\n        except Exception:\n            self._scheduled_retry_attempts.remove(retry_attempt_id)\n            raise\n'''
          new = '''        if retry_attempt_id == superseded_attempt_id:\n            raise ValueError("retry_attempt_id must differ from superseded_attempt_id")\n        return self.simulator.schedule(\n            EventKind.RETRY_STARTED,\n            at=at,\n            event_id=event_id or f"retry-start:{retry_attempt_id}",\n            payload={\n                "request_id": request_id,\n                "superseded_attempt_id": superseded_attempt_id,\n                "retry_attempt_id": retry_attempt_id,\n            },\n        )\n'''
          if old not in text: raise SystemExit('missing host reservation target')
          text = text.replace(old, new, 1)

          old = '''                EventKind.RETRY_STARTED,\n                delay=0,\n                event_id=f"retry-start:{retry_attempt_id}",\n                payload={\n'''
          new = '''                EventKind.RETRY_STARTED,\n                delay=0,\n                event_id=f"retry-start:{retry_attempt_id}:from:{event.event_id}",\n                payload={\n'''
          if old not in text: raise SystemExit('missing timeout child event identity target')
          text = text.replace(old, new, 1)
          path.write_text(text)

          tests_path = Path('tests/simulator/test_semantic_adapter.py')
          tests = tests_path.read_text()
          old = '''def test_explicit_retry_reservation_deduplicates_later_timeout_delivery():\n    sim = DiscreteEventSimulator()\n    core = _scaffold_core()\n    adapter = ContinuityAdapter(sim, core)\n    adapter.schedule_request("r", "c", at=0)\n    adapter.schedule_attempt_start("r", "a1", at=1)\n    adapter.schedule_retry_start("r", "a1", "a2", at=5, event_id="preplanned-retry")\n    adapter.schedule_timeout("r", "a1", "a2", at=4, event_id="timeout")\n    sim.run()\n\n    assert [(a.id, a.generation) for a in sorted(core.attempts.values(), key=lambda a: a.generation)] == [\n        ("a1", 1), ("a2", 2)\n    ]\n    timeout = [record for record in adapter.records if record.event_id == "timeout"]\n    assert timeout[-1].outcome is AdapterOutcome.IGNORED\n\n\n'''
          new = '''def test_preplanned_future_retry_does_not_suppress_earlier_timeout_retry():\n    sim = DiscreteEventSimulator()\n    core = _scaffold_core()\n    adapter = ContinuityAdapter(sim, core)\n    adapter.schedule_request("r", "c", at=0)\n    adapter.schedule_attempt_start("r", "a1", at=1)\n    adapter.schedule_retry_start("r", "a1", "a2", at=5, event_id="preplanned-retry")\n    adapter.schedule_timeout("r", "a1", "a2", at=4, event_id="timeout")\n    sim.run()\n\n    assert [(a.id, a.generation) for a in sorted(core.attempts.values(), key=lambda a: a.generation)] == [\n        ("a1", 1), ("a2", 2)\n    ]\n    assert core.attempts["a2"].authority_status is AttemptAuthority.CURRENT\n    timeout = [record for record in adapter.records if record.event_id == "timeout"]\n    assert timeout[-1].operation == "schedule_retry"\n    assert timeout[-1].outcome is AdapterOutcome.APPLIED\n    preplanned = [record for record in adapter.records if record.event_id == "preplanned-retry"]\n    assert preplanned[-1].operation == "retry_eligibility"\n    assert preplanned[-1].outcome is AdapterOutcome.IGNORED\n\n\ndef test_retry_setup_call_order_does_not_change_different_time_delivery_outcome():\n    def run(preplanned_first):\n        sim = DiscreteEventSimulator()\n        core = _scaffold_core()\n        adapter = ContinuityAdapter(sim, core)\n        adapter.schedule_request("r", "c", at=0)\n        adapter.schedule_attempt_start("r", "a1", at=1)\n        if preplanned_first:\n            adapter.schedule_retry_start("r", "a1", "a2", at=5, event_id="preplanned-retry")\n            adapter.schedule_timeout("r", "a1", "a2", at=4, event_id="timeout")\n        else:\n            adapter.schedule_timeout("r", "a1", "a2", at=4, event_id="timeout")\n            adapter.schedule_retry_start("r", "a1", "a2", at=5, event_id="preplanned-retry")\n        sim.run()\n        return authoritative_outcome(core, "r")\n\n    assert run(True) == run(False)\n\n\n'''
          if old not in tests: raise SystemExit('missing flawed retry test target')
          tests = tests.replace(old, new, 1)
          tests_path.write_text(tests)

          spec_path = Path('spec/09-c2-semantic-adapter-record.md')
          spec = spec_path.read_text().replace(
              'preplanned retry vs timeout deduplication',
              'preplanned retry vs earlier timeout convergence without host-time reservation',
              1,
          )
          spec_path.write_text(spec)
          PY
      - name: Validate full repository suite
        run: |
          python -m pip install --upgrade pip pytest
          python -m pytest
      - name: Commit correction and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c2-3-retry-causality-correction.yml
          git add simulator/semantic_adapter.py tests/simulator/test_semantic_adapter.py spec/09-c2-semantic-adapter-record.md
          git commit -m "Remove host-time dependence from C2.3 retry scheduling"
          git push origin HEAD:c2/semantic-adapter

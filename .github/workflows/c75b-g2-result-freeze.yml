name: c75b-g2-result-freeze

on:
  push:
    branches:
      - c7/g2-results
      - main
    paths:
      - .github/workflows/c75b-g2-result-freeze.yml
      - .github/workflows/c75b-stage2-execute.yml
      - experiments/c7_protocol.py
      - experiments/c72_routing_reuse.py
      - experiments/c73c_protocol.py
      - experiments/c75_g2_protocol.py
      - experiments/c75_g2_execute.py
      - experiments/c75_g2_adjudicate.py
      - experiments/c75_g2_finalize.py
      - experiments/c75_g2_stage2_contract.py
      - experiments/c75_g2_run.py
      - experiments/mooncake_trace.py
      - experiments/trace_workload.py
      - simulator/**
      - continuity/**
      - artifacts/c6.4f/exhaustive-source-equivalence.json
      - artifacts/c7.5b/g2-result-manifest.json
      - artifacts/c7.5b/superseded-9ecb-candidate-manifest.json
      - tests/experiments/test_c75_g2_execute.py
      - tests/experiments/test_c75_g2_adjudicate.py
      - tests/experiments/test_c75_g2_stage2_contract.py
      - tests/experiments/test_c75_g2_review_repairs.py
      - tests/experiments/test_c75_g2_run.py
      - tests/experiments/test_c75b_result_freeze.py
      - spec/59-c7.5b-g2-results.md
      - spec/60-c7.5b-g2-result.md
      - pyproject.toml
  pull_request:
    paths:
      - .github/workflows/c75b-g2-result-freeze.yml
      - .github/workflows/c75b-stage2-execute.yml
      - experiments/c7_protocol.py
      - experiments/c72_routing_reuse.py
      - experiments/c73c_protocol.py
      - experiments/c75_g2_protocol.py
      - experiments/c75_g2_execute.py
      - experiments/c75_g2_adjudicate.py
      - experiments/c75_g2_finalize.py
      - experiments/c75_g2_stage2_contract.py
      - experiments/c75_g2_run.py
      - experiments/mooncake_trace.py
      - experiments/trace_workload.py
      - simulator/**
      - continuity/**
      - artifacts/c6.4f/exhaustive-source-equivalence.json
      - artifacts/c7.5b/g2-result-manifest.json
      - artifacts/c7.5b/superseded-9ecb-candidate-manifest.json
      - tests/experiments/test_c75_g2_execute.py
      - tests/experiments/test_c75_g2_adjudicate.py
      - tests/experiments/test_c75_g2_stage2_contract.py
      - tests/experiments/test_c75_g2_review_repairs.py
      - tests/experiments/test_c75_g2_run.py
      - tests/experiments/test_c75b_result_freeze.py
      - spec/59-c7.5b-g2-results.md
      - spec/60-c7.5b-g2-result.md
      - pyproject.toml
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'
  C75B_BASE: 'fcee10c5c647c9dfe11c7930987e331222fe124d'
  STAGE1_REVIEW_SHA: 'bf9af8fa54a2948c9fa4a77f3a1325ecbf5e2e68'
  RUNNER_REVIEW_SHA: '4bd4a8d268356daf1c856512a34b1b5a02cd8a31'
  FROZEN_GENERATION_SHA: '823bcb1f6ad9178d21052eec81934fb0199e1efa'
  FROZEN_GENERATION_PR_REF: 'refs/pull/167/head'
  EXPECTED_SCIENTIFIC_FINGERPRINT: '1ff70aa4985743483ca897120e819889846576a66d320ec23674406919ba2b17'
  EXPECTED_RESULT_SHA256: 'f3eb3b8c5ee9e031aa9d3a1465e7e50c995cc6dab1020c3ee03662bfaa6765d7'
  EXPECTED_SUMMARY_SHA256: 'e20e2cfb517007ae197f4ecc13d25995f49e43721850a4a0b4402cc0e28a63bd'
  EXPECTED_ROWS_SHA256: '63692ca2b5940649c83e8d3e9cd2794eb93521bbbbcfa57b77a2d71bac5474be'
  EXPECTED_MANIFEST_SHA256: '774eb4e59ba61f254b6fd5d4b5db908649ca5ce42cb93d1b9e2296da3208b3d5'
  MOONCAKE_URL: 'https://raw.githubusercontent.com/kvcache-ai/Mooncake/3cca71daccf2a7afb8fe3f0295358f70e3a69fdb/FAST25-release/traces/conversation_trace.jsonl'

jobs:
  freeze-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify immutable current checkout
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Materialize frozen generation ancestry
        run: |
          git fetch --no-tags origin \
            "+${FROZEN_GENERATION_PR_REF}:refs/remotes/origin/c75b-frozen-generation"
          git cat-file -e "${FROZEN_GENERATION_SHA}^{commit}"
          git merge-base --is-ancestor \
            "$FROZEN_GENERATION_SHA" \
            refs/remotes/origin/c75b-frozen-generation
      - name: Verify authoritative generation used reviewed stage-1 mechanics
        run: |
          git diff --exit-code "$STAGE1_REVIEW_SHA" "$FROZEN_GENERATION_SHA" -- \
            experiments/c75_g2_execute.py \
            experiments/c75_g2_adjudicate.py \
            experiments/c75_g2_finalize.py \
            experiments/c75_g2_stage2_contract.py \
            tests/experiments/test_c75_g2_execute.py \
            tests/experiments/test_c75_g2_adjudicate.py \
            tests/experiments/test_c75_g2_stage2_contract.py \
            tests/experiments/test_c75_g2_review_repairs.py
      - name: Verify authoritative generation used reviewed runner
        run: |
          git diff --exit-code "$RUNNER_REVIEW_SHA" "$FROZEN_GENERATION_SHA" -- \
            experiments/c75_g2_run.py \
            tests/experiments/test_c75_g2_run.py \
            .github/workflows/c75b-stage2-plan.yml
      - name: Verify frozen scientific parents at generation
        run: |
          git diff --exit-code "$C75B_BASE" "$FROZEN_GENERATION_SHA" -- \
            experiments/c7_protocol.py \
            experiments/c72_routing_reuse.py \
            experiments/c73c_protocol.py \
            experiments/c75_g2_protocol.py \
            experiments/mooncake_trace.py \
            experiments/trace_workload.py \
            simulator \
            continuity \
            artifacts/c6.4f/exhaustive-source-equivalence.json
      - name: Verify scientific code unchanged since authoritative generation
        run: |
          git diff --exit-code "$FROZEN_GENERATION_SHA" HEAD -- \
            experiments/c7_protocol.py \
            experiments/c72_routing_reuse.py \
            experiments/c73c_protocol.py \
            experiments/c75_g2_protocol.py \
            experiments/c75_g2_execute.py \
            experiments/c75_g2_adjudicate.py \
            experiments/c75_g2_finalize.py \
            experiments/c75_g2_stage2_contract.py \
            experiments/c75_g2_run.py \
            experiments/mooncake_trace.py \
            experiments/trace_workload.py \
            simulator \
            continuity \
            artifacts/c6.4f/exhaustive-source-equivalence.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: Install test runner only
        run: python -m pip install 'pytest==8.4.2'
      - name: Run frozen result and provenance tests
        run: |
          python -m pytest -q \
            tests/experiments/test_c75_g2_execute.py \
            tests/experiments/test_c75_g2_adjudicate.py \
            tests/experiments/test_c75_g2_stage2_contract.py \
            tests/experiments/test_c75_g2_review_repairs.py \
            tests/experiments/test_c75_g2_run.py \
            tests/experiments/test_c75b_result_freeze.py
      - name: Verify committed manifest literal identity
        run: |
          test "$(sha256sum artifacts/c7.5b/g2-result-manifest.json | awk '{print $1}')" = "$EXPECTED_MANIFEST_SHA256"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path('artifacts/c7.5b/g2-result-manifest.json').read_text())
          artifact = manifest['canonical_artifact']
          assert artifact['generation_git_commit'] == os.environ['FROZEN_GENERATION_SHA']
          assert artifact['scientific_fingerprint'] == os.environ['EXPECTED_SCIENTIFIC_FINGERPRINT']
          assert artifact['result_json_sha256'] == os.environ['EXPECTED_RESULT_SHA256']
          assert artifact['summary_json_sha256'] == os.environ['EXPECTED_SUMMARY_SHA256']
          assert artifact['program_rows_sha256'] == os.environ['EXPECTED_ROWS_SHA256']
          assert manifest['gate_g2']['classification'] == 'G2_A_STRONG_EFFICIENCY_SUPPORT'
          assert manifest['independent_raw_row_audit']['h4_support_exact_match'] is True
          assert manifest['independent_raw_row_audit']['h7_qualifying_run_signatures_exact_match'] is True
          PY

  replay-generation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Fresh checkout of authoritative generation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: '823bcb1f6ad9178d21052eec81934fb0199e1efa'
          fetch-depth: 0
          clean: true
      - name: Verify exact clean generation checkout
        run: |
          test "$(git rev-parse HEAD)" = "$FROZEN_GENERATION_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: Download exact pinned Mooncake source
        run: curl --fail --location --silent --show-error "$MOONCAKE_URL" --output /tmp/mooncake.jsonl
      - name: Replay authoritative result twice
        run: |
          python -m experiments.c75_g2_run \
            --execute \
            --source /tmp/mooncake.jsonl \
            --c64f-artifact artifacts/c6.4f/exhaustive-source-equivalence.json \
            --execution-sha "$FROZEN_GENERATION_SHA" \
            --output /tmp/c75b-result-1.json \
            --rows-output /tmp/c75b-rows-1.jsonl \
            > /tmp/c75b-summary-1.json
          python -m experiments.c75_g2_run \
            --execute \
            --source /tmp/mooncake.jsonl \
            --c64f-artifact artifacts/c6.4f/exhaustive-source-equivalence.json \
            --execution-sha "$FROZEN_GENERATION_SHA" \
            --output /tmp/c75b-result-2.json \
            --rows-output /tmp/c75b-rows-2.jsonl \
            > /tmp/c75b-summary-2.json
          cmp /tmp/c75b-result-1.json /tmp/c75b-result-2.json
          cmp /tmp/c75b-rows-1.jsonl /tmp/c75b-rows-2.jsonl
          cmp /tmp/c75b-summary-1.json /tmp/c75b-summary-2.json
      - name: Verify frozen result identities and Gate G2
        run: |
          test "$(sha256sum /tmp/c75b-result-1.json | awk '{print $1}')" = "$EXPECTED_RESULT_SHA256"
          test "$(sha256sum /tmp/c75b-summary-1.json | awk '{print $1}')" = "$EXPECTED_SUMMARY_SHA256"
          test "$(sha256sum /tmp/c75b-rows-1.jsonl | awk '{print $1}')" = "$EXPECTED_ROWS_SHA256"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(Path('/tmp/c75b-result-1.json').read_text())
          summary = json.loads(Path('/tmp/c75b-summary-1.json').read_text())
          assert result['execution_git_sha'] == os.environ['FROZEN_GENERATION_SHA']
          assert result['scientific_fingerprint'] == os.environ['EXPECTED_SCIENTIFIC_FINGERPRINT']
          assert result['program_row_count'] == 60160
          assert result['program_rows_sha256'] == os.environ['EXPECTED_ROWS_SHA256']
          final = result['final_adjudication']
          assert final['h4']['decision'] == 'SUPPORTED_WITHIN_DECLARED_PHASE_SPACE'
          assert final['h7']['decision'] == 'SUPPORTED_WITHIN_DECLARED_PHASE_SPACE'
          assert final['h7']['p7_pass'] is True
          assert len(final['h7']['qualifying_runs']) == 65
          assert final['gate_g2'] == 'G2_A_STRONG_EFFICIENCY_SUPPORT'
          assert summary['gate_g2'] == 'G2_A_STRONG_EFFICIENCY_SUPPORT'
          print('frozen_generation_sha=' + os.environ['FROZEN_GENERATION_SHA'])
          print('scientific_fingerprint=' + result['scientific_fingerprint'])
          print('result_sha256=' + os.environ['EXPECTED_RESULT_SHA256'])
          print('summary_sha256=' + os.environ['EXPECTED_SUMMARY_SHA256'])
          print('program_rows_sha256=' + os.environ['EXPECTED_ROWS_SHA256'])
          print('gate_g2=' + final['gate_g2'])
          PY
      - name: Stage canonical replay artifact
        run: |
          mkdir -p /tmp/c75b-replay
          cp /tmp/c75b-result-1.json /tmp/c75b-replay/g2-result.json
          cp /tmp/c75b-summary-1.json /tmp/c75b-replay/g2-result-summary.json
          cp /tmp/c75b-rows-1.jsonl /tmp/c75b-replay/program-rows.jsonl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: c75b-g2-result-replay
          path: /tmp/c75b-replay
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

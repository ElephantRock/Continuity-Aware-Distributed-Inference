name: c64c-review-fix

on:
  push:
    branches:
      - c6/source-polynomial-v3-boundary
    paths:
      - .github/workflows/c64c-review-fix.yml

permissions:
  contents: write

jobs:
  apply-review-fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify immutable event checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Apply C6.4c review fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          v3 = Path('simulator/inference_cost_v3.py')
          text = v3.read_text()
          old = 'from dataclasses import dataclass\n'
          new = 'from dataclasses import dataclass\nfrom itertools import product\n'
          if text.count(old) != 1:
              raise SystemExit('unexpected dataclass import count')
          text = text.replace(old, new, 1)

          marker = '\n\n@dataclass(frozen=True, slots=True)\nclass CanonicalPolynomialModel:'
          helper = '''\n\ndef _expected_polynomial_powers(\n    feature_count: int, degree: int, interaction_only: bool\n) -> tuple[tuple[int, ...], ...]:\n    """Canonical nonconstant basis generated by sklearn PolynomialFeatures."""\n\n    candidates = product(range(degree + 1), repeat=feature_count)\n    powers = [\n        exponents\n        for exponents in candidates\n        if 1 <= sum(exponents) <= degree\n        and (not interaction_only or all(exponent <= 1 for exponent in exponents))\n    ]\n    return tuple(sorted(powers))\n\n\n@dataclass(frozen=True, slots=True)\nclass CanonicalPolynomialModel:'''
          if text.count(marker) != 1:
              raise SystemExit('unexpected CanonicalPolynomialModel marker count')
          text = text.replace(marker, helper, 1)

          marker = '''            if encoded[key] not in {"true", "false"}:\n                raise ValueError(f"{key} must use canonical true/false encoding")\n\n    def evaluate(self, feature_values: Sequence[float]) -> float:\n'''
          replacement = '''            if encoded[key] not in {"true", "false"}:\n                raise ValueError(f"{key} must use canonical true/false encoding")\n\n        degree = int(encoded["polynomialfeatures__degree"])\n        interaction_only = (\n            encoded["polynomialfeatures__interaction_only"] == "true"\n        )\n        expected_powers = _expected_polynomial_powers(\n            len(self.feature_names), degree, interaction_only\n        )\n        if self.powers != expected_powers:\n            raise ValueError(\n                "powers must exactly match the frozen PolynomialFeatures nonconstant basis"\n            )\n        if (\n            encoded["polynomialfeatures__include_bias"] == "false"\n            and encoded["linearregression__fit_intercept"] == "false"\n            and self.intercept != 0.0\n        ):\n            raise ValueError(\n                "intercept must be zero when source include_bias and fit_intercept are false"\n            )\n\n    def evaluate(self, feature_values: Sequence[float]) -> float:\n'''
          if text.count(marker) != 1:
              raise SystemExit('unexpected hyperparameter validation marker count')
          text = text.replace(marker, replacement, 1)
          v3.write_text(text)

          tests = Path('tests/simulator/test_inference_cost_v3.py')
          text = tests.read_text()
          marker = '''HYPERPARAMETERS = (\n    ("linearregression__fit_intercept", "true"),\n    ("polynomialfeatures__degree", "1"),\n    ("polynomialfeatures__include_bias", "true"),\n    ("polynomialfeatures__interaction_only", "false"),\n)\n'''
          replacement = marker + '''DEGREE2_HYPERPARAMETERS = (\n    ("linearregression__fit_intercept", "true"),\n    ("polynomialfeatures__degree", "2"),\n    ("polynomialfeatures__include_bias", "true"),\n    ("polynomialfeatures__interaction_only", "false"),\n)\nINTERACTION_ONLY_HYPERPARAMETERS = (\n    ("linearregression__fit_intercept", "true"),\n    ("polynomialfeatures__degree", "2"),\n    ("polynomialfeatures__include_bias", "true"),\n    ("polynomialfeatures__interaction_only", "true"),\n)\nNO_CONSTANT_HYPERPARAMETERS = (\n    ("linearregression__fit_intercept", "false"),\n    ("polynomialfeatures__degree", "1"),\n    ("polynomialfeatures__include_bias", "false"),\n    ("polynomialfeatures__interaction_only", "false"),\n)\n'''
          if text.count(marker) != 1:
              raise SystemExit('unexpected HYPERPARAMETERS block count')
          text = text.replace(marker, replacement, 1)

          marker = '''    coefficients: tuple[float, ...] = (1.0,),\n    intercept: float = 0.0,\n) -> CanonicalPolynomialModel:\n'''
          replacement = '''    coefficients: tuple[float, ...] = (1.0,),\n    intercept: float = 0.0,\n    upstream_hyperparameters: tuple[tuple[str, str], ...] = HYPERPARAMETERS,\n) -> CanonicalPolynomialModel:\n'''
          if text.count(marker) != 1:
              raise SystemExit('unexpected _poly signature marker count')
          text = text.replace(marker, replacement, 1)
          marker = '        upstream_hyperparameters=HYPERPARAMETERS,\n'
          replacement = '        upstream_hyperparameters=upstream_hyperparameters,\n'
          if text.count(marker) != 1:
              raise SystemExit('unexpected _poly hyperparameter assignment count')
          text = text.replace(marker, replacement, 1)

          marker = '''        prefill_attention=_poly(\n            "attn_prefill",\n            feature_names=("kv_cache_size", "prefill_chunk_size_squared"),\n            powers=((0, 1),),\n        ),\n'''
          replacement = '''        prefill_attention=_poly(\n            "attn_prefill",\n            feature_names=("kv_cache_size", "prefill_chunk_size_squared"),\n            powers=((0, 1), (1, 0)),\n            coefficients=(1.0, 0.0),\n        ),\n'''
          if text.count(marker) != 1:
              raise SystemExit('unexpected prefill_attention fixture count')
          text = text.replace(marker, replacement, 1)

          marker = '''        coefficients=(2.0, 3.0),\n        intercept=-5.0,\n    )\n'''
          replacement = '''        coefficients=(2.0, 3.0),\n        intercept=-5.0,\n        upstream_hyperparameters=DEGREE2_HYPERPARAMETERS,\n    )\n'''
          if text.count(marker) != 1:
              raise SystemExit('unexpected quadratic fixture count')
          text = text.replace(marker, replacement, 1)

          marker = '''def test_component_predictions_are_not_clipped_before_composition() -> None:\n'''
          inserted = '''def test_polynomial_basis_must_match_recorded_source_hyperparameters() -> None:\n    with pytest.raises(ValueError, match="exactly match the frozen PolynomialFeatures"):\n        _poly(\n            "degree-mismatch",\n            powers=((1,), (2,)),\n            coefficients=(1.0, 1.0),\n        )\n\n    with pytest.raises(ValueError, match="exactly match the frozen PolynomialFeatures"):\n        _poly(\n            "interaction-mismatch",\n            feature_names=("x", "y"),\n            powers=((0, 1), (1, 0), (2, 0)),\n            coefficients=(1.0, 1.0, 1.0),\n            upstream_hyperparameters=INTERACTION_ONLY_HYPERPARAMETERS,\n        )\n\n    valid_interaction = _poly(\n        "interaction-valid",\n        feature_names=("x", "y"),\n        powers=((0, 1), (1, 0), (1, 1)),\n        coefficients=(1.0, 1.0, 1.0),\n        upstream_hyperparameters=INTERACTION_ONLY_HYPERPARAMETERS,\n    )\n    assert valid_interaction.evaluate((2.0, 3.0)) == pytest.approx(11.0)\n\n\ndef test_no_source_constant_requires_zero_canonical_intercept() -> None:\n    with pytest.raises(ValueError, match="intercept must be zero"):\n        _poly(\n            "constant-mismatch",\n            intercept=0.5,\n            upstream_hyperparameters=NO_CONSTANT_HYPERPARAMETERS,\n        )\n    valid = _poly(\n        "constant-valid",\n        intercept=0.0,\n        upstream_hyperparameters=NO_CONSTANT_HYPERPARAMETERS,\n    )\n    assert valid.evaluate((3.0,)) == pytest.approx(3.0)\n\n\n''' + marker
          if text.count(marker) != 1:
              raise SystemExit('unexpected component-test marker count')
          text = text.replace(marker, inserted, 1)
          tests.write_text(text)
          PY

          git diff --check
          python -m py_compile simulator/inference_cost_v3.py tests/simulator/test_inference_cost_v3.py
          git diff -- simulator/inference_cost_v3.py tests/simulator/test_inference_cost_v3.py
      - name: Commit review fixes and remove staging workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Alajmah"
          git config user.email "55954113+Alajmah@users.noreply.github.com"
          git add simulator/inference_cost_v3.py tests/simulator/test_inference_cost_v3.py
          git rm .github/workflows/c64c-review-fix.yml
          git commit -m "C6.4c: enforce source polynomial basis identity"
          git push origin HEAD:c6/source-polynomial-v3-boundary

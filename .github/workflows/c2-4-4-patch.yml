name: c2-4-4-patch

on:
  push:
    branches: [c2/fault-trust-oracle]
    paths:
      - .github/workflows/c2-4-4-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c2/fault-trust-oracle
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply schema hardening
        run: python tools/c2_4_4_patch.py
      - name: Validate full suite
        run: |
          python -m pip install --upgrade pip pytest
          python -m pytest
      - name: Commit hardening and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c2-4-4-patch.yml tools/c2_4_4_patch.py
          git add simulator/fault_oracle.py tests/simulator/test_fault_oracle.py
          git commit -m "Harden C2.4.4 class-specific parameter schema"
          git push origin HEAD:c2/fault-trust-oracle

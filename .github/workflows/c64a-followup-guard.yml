name: c64a-followup-guard

on:
  pull_request:
    paths:
      - simulator/inference_cost_v2.py
      - tests/simulator/test_inference_cost_v2.py
      - .github/workflows/c64a-followup-guard.yml

jobs:
  focused:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest tests/simulator/test_inference_cost_v2.py

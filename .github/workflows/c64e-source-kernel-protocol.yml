name: c64e-source-kernel-protocol

on:
  push:
    branches:
      - c6/source-kernel-v4-exhaustive-protocol
    paths:
      - .github/workflows/c64e-source-kernel-protocol.yml
      - simulator/inference_cost_v4.py
      - tests/simulator/test_inference_cost_v4.py
      - spec/46-c6.4e-source-kernel-v4-exhaustive-protocol.md
  pull_request:
    paths:
      - .github/workflows/c64e-source-kernel-protocol.yml
      - simulator/inference_cost_v4.py
      - tests/simulator/test_inference_cost_v4.py
      - spec/46-c6.4e-source-kernel-v4-exhaustive-protocol.md
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  OPENBLAS_CORETYPE: 'Haswell'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  source-kernel-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify immutable event checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install frozen contract runtime
        run: >-
          python -m pip install
          pytest==8.3.5
          numpy==1.26.4
          scikit-learn==1.5.2
          scipy==1.14.1
          threadpoolctl==3.5.0
      - name: Verify accepted numerical substrate
        run: |
          python - <<'PY'
          from simulator.inference_cost_v4 import assert_c64e_numerical_runtime
          print(assert_c64e_numerical_runtime())
          PY
      - name: Verify source-kernel representation and timing-free protocol
        run: python -m pytest -q tests/simulator/test_inference_cost_v4.py
      - name: Prove this freeze contains no source result values
        run: |
          python - <<'PY'
          from simulator.inference_cost_v4 import C64E_EXHAUSTIVE_PROTOCOL
          result = C64E_EXHAUSTIVE_PROTOCOL.to_dict()
          assert result['contains_reference_timings'] is False
          assert result['source_predictions_evaluated_by_this_protocol_freeze'] is False
          assert result['domains']['cold_prefill_input_tokens']['point_count'] == 4096
          assert result['domains']['point_to_point_transfer']['point_count'] == 4096
          assert result['boundary_accounting']['replacement_fresh_boundary'] is None
          assert result['boundary_accounting']['holdout_claim'] is False
          print('protocol_fingerprint=', C64E_EXHAUSTIVE_PROTOCOL.fingerprint)
          PY

name: c1-request-origin-record

on:
  push:
    branches: [c1/deterministic-core]
    paths:
      - '.github/workflows/c1-request-origin-record.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c1/deterministic-core
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Update C1 completion record
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('spec/07-c1-deterministic-core-record.md')
          text = p.read_text()
          replacements = [
              ('Latest completion-candidate result after all review fixes:\n\n```text\n118 passed\n```',
               'Latest completion-candidate result after all review fixes:\n\n```text\n120 passed\n```'),
              ('- invalid logical State.\n\nLogical State identity remains distinct from physical replicas.',
               '- invalid logical State;\n- request-origin State before the LogicalRequest has completed and established a `CommittedAttempt`.\n\nFor Paper 1 C1, request-origin State is explicitly post-commit: its producer is exactly `CommittedAttempt(request)`. This removes temporal ambiguity from request-origin provenance.\n\nLogical State identity remains distinct from physical replicas.'),
              ('- the independent oracle rejects a Phase-origin State whose declared `origin_id` disagrees with its cached producer Phase.',
               '- the independent oracle rejects a Phase-origin State whose declared `origin_id` disagrees with its cached producer Phase;\n- request-origin State is rejected before request completion, and the oracle rejects a request-origin State whose cached producer differs from `CommittedAttempt(request)`.'),
              ('Codex review identified four correctness inconsistencies during closure:\n\n1. wall-clock-dependent time-sensitive operation replay;\n2. missing independent Phase-dependency ordering validation in restored/corrupted State provenance;\n3. public Output creation accepting unresolved Evidence references while the oracle rejected them;\n4. restored/corrupted State could declare one Phase origin while carrying cached producer provenance from another Phase.\n\nAll four are fixed and covered by regression tests.',
               'Codex review identified five correctness inconsistencies during closure:\n\n1. wall-clock-dependent time-sensitive operation replay;\n2. missing independent Phase-dependency ordering validation in restored/corrupted State provenance;\n3. public Output creation accepting unresolved Evidence references while the oracle rejected them;\n4. restored/corrupted State could declare one Phase origin while carrying cached producer provenance from another Phase;\n5. request-origin State producer identity was ambiguous unless request completion was made a precondition.\n\nAll five are fixed and covered by regression tests.')
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one match for {old[:90]!r}; got {text.count(old)}')
              text = text.replace(old, new, 1)
          p.write_text(text)
          PY
      - name: Verify deterministic C1 suite
        run: |
          python -m pip install --upgrade pip pytest
          python -m pytest -q
      - name: Commit record and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add spec/07-c1-deterministic-core-record.md
          git rm .github/workflows/c1-request-origin-record.yml
          git commit -m 'Record request-origin C1 semantics and 120-test validation'
          git push origin HEAD:c1/deterministic-core

name: c73a-context-review-repair

on:
  push:
    branches:
      - c7/retention-protocol
    paths:
      - .github/workflows/c73a-context-review-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: c7/retention-protocol
          fetch-depth: 0
      - name: Apply TTFT finite-domain repair
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('experiments/c73_retention_protocol.py')
          text = p.read_text()
          old = '    AXES,\n    C6_STATE_BYTES_PER_TOKEN,'
          new = '    AXES,\n    C6_MAX_MODEL_LENGTH,\n    C6_STATE_BYTES_PER_TOKEN,'
          if text.count(old) != 1:
              raise SystemExit('module import anchor drift')
          text = text.replace(old, new)
          old = '    context = _positive_int(full_context_tokens, "full_context_tokens")\n    first_token_completion = start + recompute + fixed + slope * context'
          new = ('    context = _positive_int(full_context_tokens, "full_context_tokens")\n'
                 '    if context >= C6_MAX_MODEL_LENGTH:\n'
                 '        raise ValueError(\n'
                 '            "full_context_tokens must be within the accepted C6 first-token decode domain 1..4095"\n'
                 '        )\n'
                 '    first_token_completion = start + recompute + fixed + slope * context')
          if text.count(old) != 1:
              raise SystemExit('module TTFT anchor drift')
          text = text.replace(old, new)
          old = '                "positive_context_required": True,\n                "queue_delay_included": True,'
          new = ('                "positive_context_required": True,\n'
                 '                "max_first_decode_context_tokens": C6_MAX_MODEL_LENGTH - 1,\n'
                 '                "queue_delay_included": True,')
          if text.count(old) != 1:
              raise SystemExit('module protocol TTFT anchor drift')
          p.write_text(text.replace(old, new))

          t = Path('tests/experiments/test_c73_retention_protocol.py')
          text = t.read_text()
          old = '    AXES,\n    C6_STATE_BYTES_PER_TOKEN,'
          new = '    AXES,\n    C6_MAX_MODEL_LENGTH,\n    C6_STATE_BYTES_PER_TOKEN,'
          if text.count(old) != 1:
              raise SystemExit('test import anchor drift')
          text = text.replace(old, new)
          text += '''\n\ndef test_tool_return_ttft_fails_closed_at_c6_first_decode_context_boundary() -> None:\n    accepted = tool_return_ttft_seconds(\n        resume_eligibility_seconds=0.0, service_start_seconds=0.0,\n        recompute_prefill_seconds=0.0, decode_fixed_seconds=0.1,\n        decode_seconds_per_context_token_step=0.001,\n        full_context_tokens=C6_MAX_MODEL_LENGTH - 1,\n    )\n    assert accepted > 0.0\n    with pytest.raises(ValueError, match="accepted C6 first-token decode domain 1..4095"):\n        tool_return_ttft_seconds(\n            resume_eligibility_seconds=0.0, service_start_seconds=0.0,\n            recompute_prefill_seconds=0.0, decode_fixed_seconds=0.1,\n            decode_seconds_per_context_token_step=0.001,\n            full_context_tokens=C6_MAX_MODEL_LENGTH,\n        )\n\n\ndef test_protocol_serializes_finite_first_decode_context_fence() -> None:\n    rule = FROZEN_C73_RETENTION_PROTOCOL.to_dict()["tool_return_ttft"]\n    assert rule["positive_context_required"] is True\n    assert rule["max_first_decode_context_tokens"] == C6_MAX_MODEL_LENGTH - 1 == 4095\n'''
          t.write_text(text)

          f = Path('tests/experiments/test_c73_retention_fingerprint.py')
          f.write_text('''from __future__ import annotations\n\nfrom experiments.c73_retention_protocol import (\n    C73_RETENTION_PROTOCOL_FINGERPRINT, C73_STATE_SIZE_MAP_FINGERPRINT,\n)\n\nEXPECTED_C73_STATE_SIZE_MAP_FINGERPRINT = "36bacaad6462ca3e5eeb2688040e4dcf0d829849158c5b5ad9bad3c58afe173b"\n\ndef test_candidate_retention_protocol_fingerprint_is_canonical_sha256() -> None:\n    assert len(C73_RETENTION_PROTOCOL_FINGERPRINT) == 64\n    int(C73_RETENTION_PROTOCOL_FINGERPRINT, 16)\n\ndef test_state_size_map_fingerprint_remains_independently_frozen() -> None:\n    assert C73_STATE_SIZE_MAP_FINGERPRINT == EXPECTED_C73_STATE_SIZE_MAP_FINGERPRINT\n''')

          s = Path('spec/51-c7.3a-retention-protocol.md')
          text = s.read_text()
          old = ('Modeled first-token service is required recompute-prefill plus the first carried C6.3 decode step. '
                 'Queue/resource delay from resume eligibility to service start remains included. Positive decode context is required, '
                 'consistent with the closed C6 domain. Full-decode duration may not substitute for first-token completion.')
          new = ('Modeled first-token service is required recompute-prefill plus the first carried C6.3 decode step. '
                 'Queue/resource delay from resume eligibility to service start remains included. The first-decode context is fail-closed '
                 'to `1..4095` tokens, matching the closed C6 positive-decode domain for a first generated token under the 4096-token model-length fence. '
                 'Full-decode duration may not substitute for first-token completion.')
          if text.count(old) != 1:
              raise SystemExit('spec TTFT anchor drift')
          s.write_text(text.replace(old, new))

          freeze = Path('spec/53-c7.3a-retention-protocol-freeze.md')
          if freeze.exists():
              freeze.unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/c73_retention_protocol.py tests/experiments/test_c73_retention_protocol.py tests/experiments/test_c73_retention_fingerprint.py spec/51-c7.3a-retention-protocol.md spec/53-c7.3a-retention-protocol-freeze.md
          git commit -m "C7.3a: fence TTFT to accepted C6 first-token context domain"
          git push origin HEAD:c7/retention-protocol

name: c1-record-sync

on:
  push:
    branches: [c1/deterministic-core]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c1/deterministic-core
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Synchronize final C1 record
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('spec/07-c1-deterministic-core-record.md')
          text = p.read_text()

          replacements = [
              (
                  'and cannot regress from `RUNNING` to `CREATED`; terminal Phase outcomes are immutable.\n\nPhase-origin State requires a `COMPLETED` producer Phase.',
                  'and cannot regress from `RUNNING` to `CREATED`; terminal Phase outcomes are immutable.\n\nA Phase belonging to a superseded Attempt cannot transition to `COMPLETED`. This fences delayed Phase completion from mutating authoritative semantic state after supersession.\n\nPhase-origin State requires a `COMPLETED` producer Phase, and neither Attempt-origin nor Phase-origin State may be newly produced by a superseded Attempt.'
              ),
              (
                  'Serialization is deterministic and canonical.\n\nA SHA-256 snapshot fingerprint is available for semantic-state equivalence checks.',
                  'Serialization is deterministic and canonical. Canonical JSON serialization rejects non-finite floating-point values (`NaN`, `+Infinity`, `-Infinity`) rather than emitting non-standard JSON tokens.\n\nA SHA-256 snapshot fingerprint is available for semantic-state equivalence checks.'
              ),
              (
                  'Two fresh cores replaying the same valid operation trace must therefore produce identical canonical snapshots and identical snapshot fingerprints independently of when replay occurs.',
                  'Two fresh cores replaying the same valid operation trace must therefore produce identical canonical snapshots and identical snapshot fingerprints independently of when replay occurs. Event and Operation JSONL use the same strict finite-number canonical JSON rule.'
              ),
              ('```text\n120 passed\n```', '```text\n128 passed\n```'),
              (
                  '- request-origin State is rejected before request completion, and the oracle rejects a request-origin State whose cached producer differs from `CommittedAttempt(request)`.',
                  '- request-origin State is rejected before request completion, and the oracle rejects a request-origin State whose cached producer differs from `CommittedAttempt(request)`;\n- a superseded Attempt cannot authoritatively complete a Phase or produce new Attempt-/Phase-origin State;\n- canonical snapshots and Operation JSONL reject `NaN`, `+Infinity`, and `-Infinity`.'
              ),
              ('Codex review identified five correctness inconsistencies during closure:', 'Codex review identified seven correctness inconsistencies during closure:'),
              (
                  '5. request-origin State producer identity was ambiguous unless request completion was made a precondition.\n\nAll five are fixed and covered by regression tests.',
                  '5. request-origin State producer identity was ambiguous unless request completion was made a precondition;\n6. delayed Phase completion after Attempt supersession could still mutate semantic state and enable new State production;\n7. canonical JSON/JSONL serialization could emit non-standard `NaN`/`Infinity` tokens.\n\nAll seven are fixed and covered by regression tests.'
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one match, got {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          p.write_text(text)
          PY
      - name: Validate deterministic C1 suite
        run: |
          python -m pip install --upgrade pip pytest
          python -m pytest -q
      - name: Commit synchronized record and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add spec/07-c1-deterministic-core-record.md
          git rm .github/workflows/c1-record-sync.yml
          git commit -m 'Synchronize C1 record after final safety review'
          git push origin HEAD:c1/deterministic-core

name: c83a1-cross-layer-replay-protocol-v3

on:
  push:
    branches:
      - c8/c2-replay-feasibility-repair-v3
      - main
    paths:
      - .github/workflows/c83a1-cross-layer-replay-protocol-v3.yml
      - experiments/c83_replay_protocol.py
      - experiments/c83_replay_protocol_v3.py
      - tests/experiments/test_c83_replay_protocol.py
      - tests/experiments/test_c83_replay_protocol_v3.py
      - tests/counterexamples/test_failure_model_traces.py
      - spec/65-c8.3a1-c2-entry-amendment-v3.md
      - experiments/c8_protocol.py
      - experiments/correctness.py
      - prototype/**
      - continuity/**
      - simulator/**
  pull_request:
    paths:
      - .github/workflows/c83a1-cross-layer-replay-protocol-v3.yml
      - experiments/c83_replay_protocol.py
      - experiments/c83_replay_protocol_v3.py
      - tests/experiments/test_c83_replay_protocol.py
      - tests/experiments/test_c83_replay_protocol_v3.py
      - tests/counterexamples/test_failure_model_traces.py
      - spec/65-c8.3a1-c2-entry-amendment-v3.md
      - experiments/c8_protocol.py
      - experiments/correctness.py
      - prototype/**
      - continuity/**
      - simulator/**
  workflow_dispatch:

permissions:
  contents: read

env:
  C83A_V2_MERGE: 'd8e05ef0fe4ab6bf469202b4a2476dcbb12eede5'
  C82_1_MERGE: 'd08283ec8e13567609b4b472ce6e45587d93d9ea'
  C81_PROTOCOL_FINGERPRINT: '616cc4daa4c167152875522767a8cc968da25c63d6acc099c265bc3554641cb6'
  C83A_V2_FINGERPRINT: '40780a318a5a692c713d7d27ded86d1f0fc6cd920d1c1ef82114889f9d9e099a'

jobs:
  protocol-v3:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify immutable exact-head checkout
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          git cat-file -e "${C83A_V2_MERGE}^{commit}"
          git cat-file -e "${C82_1_MERGE}^{commit}"
          git merge-base --is-ancestor "$C82_1_MERGE" HEAD

      - name: Prove predecessor v2 and C1/C2 semantics survived C8.2.1 unchanged
        run: |
          git diff --exit-code "$C83A_V2_MERGE" "$C82_1_MERGE" -- \
            experiments/c83_replay_protocol.py \
            experiments/c8_protocol.py \
            experiments/correctness.py \
            tests/counterexamples/test_failure_model_traces.py \
            continuity \
            simulator

      - name: Fence repaired substrate and semantic tree after C8.2.1
        run: |
          git diff --exit-code "$C82_1_MERGE" HEAD -- \
            experiments/c83_replay_protocol.py \
            experiments/c8_protocol.py \
            experiments/correctness.py \
            tests/counterexamples/test_failure_model_traces.py \
            prototype \
            continuity \
            simulator

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          check-latest: false

      - name: Install test runner only
        run: python -m pip install 'pytest==8.4.2'

      - name: Run predecessor and v3 protocol tests
        run: |
          python -m pytest -q \
            tests/experiments/test_c83_replay_protocol.py \
            tests/experiments/test_c83_replay_protocol_v3.py

      - name: Run repaired real-process substrate conformance tests
        run: python -m pytest -q tests/prototype

      - name: Record candidate or frozen v3 identity
        run: |
          python - <<'PY'
          from experiments.c8_protocol import C8_PROTOCOL_FINGERPRINT
          from experiments import c83_replay_protocol as v2
          from experiments import c83_replay_protocol_v3 as v3

          assert C8_PROTOCOL_FINGERPRINT == '${{ env.C81_PROTOCOL_FINGERPRINT }}'
          assert v2.C83A_PROTOCOL_FINGERPRINT == '${{ env.C83A_V2_FINGERPRINT }}'
          assert v3.C83A_PREDECESSOR_PROTOCOL_FINGERPRINT == '${{ env.C83A_V2_FINGERPRINT }}'
          assert v3.C83A_REPAIRED_SUBSTRATE_COMMIT == '${{ env.C82_1_MERGE }}'
          assert v3.C83A_BASE_COMMIT == '${{ env.C82_1_MERGE }}'
          assert v3.protocol_payload()['base_commit'] == '${{ env.C82_1_MERGE }}'
          assert v3.C83A_COMPARATIVE_RESULT_INSPECTION == 'NONE'
          v3.validate_protocol_identity(require_frozen=False)
          actual = v3.protocol_fingerprint()
          if v3.C83A_PROTOCOL_FINGERPRINT is not None:
              assert actual == v3.C83A_PROTOCOL_FINGERPRINT
              print('frozen_protocol_fingerprint=' + actual)
          else:
              print('candidate_protocol_fingerprint=' + actual)
          print('predecessor_protocol_fingerprint=' + v3.C83A_PREDECESSOR_PROTOCOL_FINGERPRINT)
          print('repaired_substrate_commit=' + v3.C83A_REPAIRED_SUBSTRATE_COMMIT)
          print('comparative_result_inspection=' + v3.C83A_COMPARATIVE_RESULT_INSPECTION)
          print('amendment_scope=C2_ENTRY_POINT_DESCRIPTION_ONLY_PLUS_PARENT_REBIND')
          PY

name: c64d-result-summary

on:
  push:
    branches: [c6/source-polynomial-v3-adequacy]
    paths: [.github/workflows/c64d-result-summary.yml]

permissions:
  contents: read

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Print canonical C6.4d failure summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('artifacts/c6.4d/source-polynomial-adequacy.json').read_text())
          print('scientific_fingerprint=',r['scientific_fingerprint'])
          print('result_kind=',r.get('result_kind'))
          print('adequacy_decision=',r.get('adequacy_decision'))
          print('representation_decision=',r.get('representation_decision'))
          print('boundary=',r['fresh_boundary'])
          for hw in r['hardware']:
              print('hardware=',hw['hardware_id'],'equivalence=',hw['source_equivalence']['decision'],'adequacy=',hw.get('adequacy_decision'),'representation=',hw.get('representation_decision'))
              for c in hw['source_equivalence']['components']:
                  if c['decision'] != 'PASS':
                      print('failure=',hw['hardware_id'],c)
          PY

name: c64b-fresh-evaluation

on:
  push:
    branches:
      - c6/replacement-calibration-fresh-adequacy
    paths:
      - .github/workflows/c64b-fresh-evaluation.yml
      - simulator/c64b_protocol.py
      - experiments/c64b_fresh_adequacy.py

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      OPENBLAS_CORETYPE: 'Haswell'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: c6/replacement-calibration-fresh-adequacy
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Verify frozen platform contract
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import platform
          import sys

          expected_platform = {
              "python": "3.12.14",
              "runner_os": "Linux",
              "runner_arch": "X64",
              "machine": "x86_64",
              "image_os": "ubuntu24",
          }
          observed_platform = {
              "python": platform.python_version(),
              "runner_os": os.environ.get("RUNNER_OS"),
              "runner_arch": os.environ.get("RUNNER_ARCH"),
              "machine": platform.machine(),
              "image_os": os.environ.get("ImageOS"),
          }
          if observed_platform != expected_platform:
              raise SystemExit(
                  "C6.4b platform drift: "
                  f"expected={expected_platform}, observed={observed_platform}"
              )
          if sys.implementation.name != "cpython":
              raise SystemExit(
                  f"C6.4b requires CPython, observed={sys.implementation.name}"
              )

          expected_env = {
              "PYTHONHASHSEED": "0",
              "OMP_NUM_THREADS": "1",
              "OPENBLAS_NUM_THREADS": "1",
              "OPENBLAS_CORETYPE": "Haswell",
              "MKL_NUM_THREADS": "1",
              "NUMEXPR_NUM_THREADS": "1",
          }
          observed_env = {name: os.environ.get(name) for name in expected_env}
          if observed_env != expected_env:
              raise SystemExit(
                  f"C6.4b numerical environment drift: expected={expected_env}, observed={observed_env}"
              )

          provenance = {
              "ImageOS": os.environ.get("ImageOS"),
              "ImageVersion": os.environ.get("ImageVersion"),
              "RUNNER_OS": os.environ.get("RUNNER_OS"),
              "RUNNER_ARCH": os.environ.get("RUNNER_ARCH"),
          }
          print("frozen_platform=", json.dumps(observed_platform, sort_keys=True))
          print("frozen_environment=", json.dumps(observed_env, sort_keys=True))
          print("runner_provenance=", json.dumps(provenance, sort_keys=True))
          PY
      - name: Install frozen evaluator runtime
        run: >-
          python -m pip install
          numpy==1.26.4
          pandas==2.2.3
          scikit-learn==1.5.2
          scipy==1.14.1
          joblib==1.4.2
          threadpoolctl==3.5.0
          fasteners==0.19
      - name: Verify frozen package and BLAS runtime
        shell: bash
        run: |
          python - <<'PY'
          import json
          from importlib.metadata import version

          import numpy as np
          from threadpoolctl import threadpool_info

          expected_packages = {
              "numpy": "1.26.4",
              "pandas": "2.2.3",
              "scikit-learn": "1.5.2",
              "scipy": "1.14.1",
              "joblib": "1.4.2",
              "threadpoolctl": "3.5.0",
              "fasteners": "0.19",
          }
          observed_packages = {name: version(name) for name in expected_packages}
          if observed_packages != expected_packages:
              raise SystemExit(
                  "C6.4b package runtime drift: "
                  f"expected={expected_packages}, observed={observed_packages}"
              )

          # Exercise NumPy before inspection so its bundled OpenBLAS library is
          # loaded and threadpoolctl can verify the actual dispatched kernel.
          np.dot(np.ones((2, 2)), np.ones((2, 2)))
          openblas = [
              item for item in threadpool_info()
              if item.get("internal_api") == "openblas"
          ]
          if len(openblas) != 1:
              raise SystemExit(
                  f"C6.4b expected exactly one OpenBLAS runtime, observed={openblas!r}"
              )
          observed_blas = {
              "version": str(openblas[0].get("version")),
              "coretype": str(openblas[0].get("architecture")),
              "threading_layer": str(openblas[0].get("threading_layer")),
              "num_threads": int(openblas[0].get("num_threads", -1)),
          }
          expected_blas = {
              "version": "0.3.23.dev",
              "coretype": "Haswell",
              "threading_layer": "pthreads",
              "num_threads": 1,
          }
          if observed_blas != expected_blas:
              raise SystemExit(
                  f"C6.4b BLAS runtime drift: expected={expected_blas}, observed={observed_blas}"
              )
          print("frozen_packages=", json.dumps(observed_packages, sort_keys=True))
          print("frozen_openblas=", json.dumps(observed_blas, sort_keys=True))
          PY
      - name: Checkout pinned Vidur source
        shell: bash
        run: |
          git clone --filter=blob:none https://github.com/microsoft/vidur.git .c64b_vidur
          git -C .c64b_vidur checkout --detach abae7f63aa857300f5cdc6f5e0d27860cd24721b
          test "$(git -C .c64b_vidur rev-parse HEAD)" = "abae7f63aa857300f5cdc6f5e0d27860cd24721b"
      - name: Run exact-source evaluation twice
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/.c64b_vidur
        run: |
          python experiments/c64b_fresh_adequacy.py \
            --vidur-root .c64b_vidur \
            --output /tmp/c64b-run-1.json > /tmp/c64b-run-1.log
          python experiments/c64b_fresh_adequacy.py \
            --vidur-root .c64b_vidur \
            --output /tmp/c64b-run-2.json > /tmp/c64b-run-2.log
          cmp /tmp/c64b-run-1.json /tmp/c64b-run-2.json
          mkdir -p artifacts/c6.4b
          cp /tmp/c64b-run-1.json artifacts/c6.4b/fresh-adequacy.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('/tmp/c64b-run-1.json').read_text())
          print('decision=', result['decision'])
          print('protocol_fingerprint=', result['protocol_fingerprint'])
          print('scientific_fingerprint=', result['scientific_fingerprint'])
          for hw in result['hardware']:
              print(hw['hardware_id'], hw['decision'])
              for name in ('fresh_prefill', 'fresh_transfer'):
                  r = hw[name]
                  print(name, r['decision'], r['evaluated_subset_mape'], r['evaluated_subset_max_ape'], r['all_frozen_axes_evaluated'])
          PY
      - name: Record canonical scientific result if changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/c6.4b/fresh-adequacy.json
          if git diff --cached --quiet; then
            echo "canonical scientific result unchanged"
          else
            git commit -m "C6.4b: record fresh adequacy result"
            git push origin HEAD:c6/replacement-calibration-fresh-adequacy
          fi
